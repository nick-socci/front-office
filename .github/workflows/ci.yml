name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type check (mypy, strict)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

      - name: Build fixture warehouse
        run: uv run front-office load --raw-root fixtures/landing --db dbt/ci.duckdb

      - name: dbt deps
        run: uv run dbt deps
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .

      - name: dbt build (fixtures)
        run: uv run dbt build --target ci
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
