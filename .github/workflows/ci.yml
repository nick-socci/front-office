name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token is read-only by declaration; only the deploy job gets more.
permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests
    # The image is named, not `ubuntu-latest`, so that moving to a newer Ubuntu is a change
    # someone makes and CI judges, not one that happens under it (#122).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # An exact tag: setup-uv publishes no `v8`-style major tags from v8 on.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Type check (mypy, strict)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest

      - name: Build fixture warehouse
        run: uv run front-office load --raw-root fixtures/landing --db dbt/ci.duckdb

      - name: dbt deps
        run: uv run dbt deps
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .

      - name: Lint SQL (sqlfluff)
        # The dbt templater opens the relative `ci` target; without the variable, run
        # from the root, it would create an empty ci.duckdb instead of using the fixtures.
        run: uv run sqlfluff lint dbt/models dbt/tests
        env:
          FO_CI_DUCKDB_PATH: dbt/ci.duckdb

      - name: dbt build (fixtures, anonymised)
        # Quoted: the colon inside --vars '{anonymize: true}' makes YAML try to
        # parse a nested mapping, which stops the workflow from starting at all.
        run: "uv run dbt build --target ci --vars '{anonymize: true}'"
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .

      - name: Example queries match their exposures and run
        run: uv run python scripts/check_examples.py --db dbt/ci.duckdb

      - name: dbt docs generate
        # Quoted for the same reason as dbt build above.
        run: "uv run dbt docs generate --target ci --vars '{anonymize: true}'"
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .

      - name: Docs site (assemble and check)
        # Only three named files are copied out of dbt's target, and they are checked
        # before anything can be uploaded (spec 0013, ADR 0042).
        run: uv run python scripts/build_docs_site.py --target-dir dbt/target --out site

      - name: Upload the docs site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Tenant isolation (two leagues by two seasons)
        # Builds fixtures/landing_multi together and each league-season alone, and fails
        # if any model gives a league-season different rows (spec 0028, ADR 0013).
        run: uv run python scripts/check_tenant_isolation.py

  deploy-docs:
    name: publish the docs site
    # Only for main, and only when every step of quality passed: the site never shows a
    # commit that failed its gates (ADR 0042).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
