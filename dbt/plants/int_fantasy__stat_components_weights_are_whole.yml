# int_fantasy__stat_components_weights_are_whole: every component weight is a whole number of
# at most 10^6, which keeps the order-exempt sums in rec_fantasy__category_wins_added exact. CI
# holds the ESPN rows only, whose weights are 1, 3 and 27.
plants:
  - name: fractional_weight
    why: a weight of 1/3 would make the unordered category-value sums order-dependent
    sql: >-
      update intermediate.int_fantasy__stat_components
      set weight = 1.0 / 3
      where platform = 'espn' and stat_key = 0 and part = 'numerator'
    expect: {status: fail, failures: 1}
  - name: another_whole_weight
    why: the case the test must let through, since a whole weight keeps the sums exact
    sql: >-
      update intermediate.int_fantasy__stat_components
      set weight = 2
      where platform = 'espn' and stat_key = 0 and part = 'numerator'
    expect: pass
  - name: huge_weight
    why: a whole weight of 10^7 could take a sum past where doubles add exactly
    sql: >-
      update intermediate.int_fantasy__stat_components
      set weight = 10000000
      where platform = 'espn' and stat_key = 0 and part = 'numerator'
    expect: {status: fail, failures: 1}
  - name: largest_allowed_weight
    why: the bound itself, 10^6, is allowed
    sql: >-
      update intermediate.int_fantasy__stat_components
      set weight = 1000000
      where platform = 'espn' and stat_key = 0 and part = 'numerator'
    expect: pass
