  - name: category_scales_pool_earlier_seasons_over_matchups_and_stand_alone_before_any_is_decided
    description: >
      2024 has one measured margin of 11 and 2025 three of 5. Pooled over matchups the
      history's scale is sqrt((121 + 75) / 4) = 7; the mean of the two seasons' scales
      would be 8. 2026 has no decided matchup, so its scale is exactly the history's.
      Catches: an average of season scales in place of a pooled one, and a season with
      nothing decided left without a scale.
    model: int_fantasy__category_scales
    overrides:
      vars:
        fantasy_scale_prior_matchups: 2
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
