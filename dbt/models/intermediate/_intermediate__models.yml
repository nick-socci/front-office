      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 2}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 1, category_key: 2, standard_margin: 4, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 2, category_key: 2, standard_margin: -4, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 3, category_key: 2, standard_margin: 4, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 2, denominator: 100, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 2, denominator: 60, stat_value: 6}
    expect:
      rows:
        - {category_key: 2, matchups_measured: 1, margin_scale: 4, side_denominator: 80, scale_source: current_season, prior_matchups_measured: 0, prior_seasons_measured: 0, prior_margin_scale: null}

# -----------------------------------------------------------------------------
# int_fantasy__candidate_day_values unit tests (#12, R1): the arithmetic of
# fct_player_category_value at the grain of one day, and who is a candidate. The numbers
# are exact in binary floating point, because a unit test compares exactly.
# -----------------------------------------------------------------------------

  - name: candidate_day_values_a_hitters_day_is_valued_against_the_batting_level
    description: >
      A hitter with no strikeouts, where a replacement strikes out 6 times (lower is better), is
      +6; batter strikeouts' margin scale is 3, so the day is worth 2. A batting row has day_kind
      batting and only the batting categories. Catches a day valued with the wrong sign, the
      wrong scale, or a pitching category charged to a batting row.
    model: int_fantasy__candidate_day_values
    overrides:
      macros:
        fo_batting_columns: [games_batted, batter_strikeouts]
        fo_pitching_columns: [games_pitched, games_started, outs_recorded, earned_runs]
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: 910001, roster_slot_id: 12, is_started: true, slot_role: hitter}
      - input: ref('espn_lineup_slots')
        rows:
          - {lineup_slot_id: 12, is_injured_list_slot: false}
          - {lineup_slot_id: 14, is_injured_list_slot: false}
          - {lineup_slot_id: 16, is_injured_list_slot: false}
          - {lineup_slot_id: 17, is_injured_list_slot: true}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {mlbam_player_id: 910001, game_date: "2026-06-01", games_batted: 1, batter_strikeouts: 0}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 27, category_label: B_SO, is_lower_better: true}
          - {platform: espn, league_id: "1", season: 2026, category_key: 34, category_label: OUTS, is_lower_better: false}
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, category_label: ERA, is_lower_better: true}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 27, part: numerator, component: batter_strikeouts, weight: 1}
          - {platform: espn, stat_key: 34, part: numerator, component: outs_recorded, weight: 1}
          - {platform: espn, stat_key: 47, part: numerator, component: earned_runs, weight: 27}
          - {platform: espn, stat_key: 47, part: denominator, component: outs_recorded, weight: 1}
      - input: ref('int_fantasy__replacement_levels')
        rows:
          - {platform: espn, league_id: "1", season: 2026, day_kind: batting, component: batter_strikeouts, level_per_played_day: 6}
          - {platform: espn, league_id: "1", season: 2026, day_kind: batting, component: games_batted, level_per_played_day: 1}
          - {platform: espn, league_id: "1", season: 2026, day_kind: start, component: outs_recorded, level_per_played_day: 15}
          - {platform: espn, league_id: "1", season: 2026, day_kind: start, component: earned_runs, level_per_played_day: 2.5}
          - {platform: espn, league_id: "1", season: 2026, day_kind: relief, component: outs_recorded, level_per_played_day: 3}
          - {platform: espn, league_id: "1", season: 2026, day_kind: relief, component: earned_runs, level_per_played_day: 1}
      - input: ref('int_fantasy__category_scales')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 27, margin_scale: 3, side_denominator: null}
          - {platform: espn, league_id: "1", season: 2026, category_key: 34, margin_scale: 3, side_denominator: null}
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, margin_scale: 0.25, side_denominator: 108}
    expect:
      rows:
        - {platform_player_id: 1, side: batting, day_kind: batting, day_value: 2}

  - name: candidate_day_values_a_start_is_valued_against_the_start_level
    description: >
      A start of 18 outs and 1 earned run. Against the start level (15 outs, 2.5 earned runs) outs
      are +3, scaled by 3 to 1; ERA is -(27 - (67.5 / 15) * 18) = +54, scaled by 108 and 0.25
      to 2. The day is worth 1 + 2 = 3, summing two categories. Catches a category dropped from
      the sum, a rate not converted by the side denominator and then the margin scale, and a
      start measured against the relief level.
    model: int_fantasy__candidate_day_values
    overrides:
      macros:
