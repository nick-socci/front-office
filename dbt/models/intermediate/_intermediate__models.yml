    expect:
      rows:
        - {league_id: "1", season: 2026, platform_player_id: 30, player_name: "Pat Matched", mlbam_player_id: 810001, resolution: unambiguous_name}
        - {league_id: "2", season: 2026, platform_player_id: 30, player_name: "Pat Mismatched", mlbam_player_id: null, resolution: unresolved}

# -----------------------------------------------------------------------------
# Unit tests: MLB day aggregation and per player-day input status (#25).
#
# The CI fixtures have no doubleheader and no two-way player-day, and the real warehouse
# can't be checked in, so these synthetic cases are what prove the rules. Ids in the
# 900000s are made up.
# -----------------------------------------------------------------------------

  - name: player_game_days_sums_a_doubleheader_into_one_day
    description: >
      Two games on one official date are one player-day with both games' production.
      A game on the next date stays its own day.
    model: int_mlb__player_game_days
    given:
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 900001, official_date: "2026-06-01"}
          - {game_pk: 900002, official_date: "2026-06-01"}
          - {game_pk: 900003, official_date: "2026-06-02"}
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          - {game_pk: 900001, mlbam_player_id: 910001, at_bats: 4, hits: 1, home_runs: 0, total_bases: 1, walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, strikeouts: 2}
          - {game_pk: 900002, mlbam_player_id: 910001, at_bats: 3, hits: 2, home_runs: 1, total_bases: 5, walks: 1, runs: 1, runs_batted_in: 2, stolen_bases: 1, strikeouts: 0}
          - {game_pk: 900003, mlbam_player_id: 910001, at_bats: 5, hits: 0, home_runs: 0, total_bases: 0, walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, strikeouts: 1}
      - input: ref('stg_mlb__pitching_game_logs')
        rows: []
    expect:
      rows:
        - {mlbam_player_id: 910001, game_date: "2026-06-01", games_batted: 2, games_pitched: 0, at_bats: 7, hits: 3, home_runs: 1, total_bases: 6, batter_walks: 1, runs: 1, runs_batted_in: 2, stolen_bases: 1, batter_strikeouts: 2, outs_recorded: 0}
        - {mlbam_player_id: 910001, game_date: "2026-06-02", games_batted: 1, games_pitched: 0, at_bats: 5, hits: 0, home_runs: 0, total_bases: 0, batter_walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, batter_strikeouts: 1, outs_recorded: 0}

  - name: player_game_days_batting_and_pitching_on_one_day_are_one_row
    description: >
      A player who bats and pitches on the same day is one row with both sides populated;
      a pitcher who didn't bat still gets a row, with zero batting. Every component a
      scored category reads gets its own value, so a crossed or dropped column (batter
      walks into pitcher walks, say) shows up as a wrong number.
    model: int_mlb__player_game_days
    given:
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 900001, official_date: "2026-06-01"}
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          - {game_pk: 900001, mlbam_player_id: 910001, at_bats: 4, hits: 2, home_runs: 1, total_bases: 5, walks: 1, runs: 1, runs_batted_in: 3, stolen_bases: 1, strikeouts: 1}
      - input: ref('stg_mlb__pitching_game_logs')
        rows:
          - {game_pk: 900001, mlbam_player_id: 910001, outs_recorded: 17, hits_allowed: 4, walks: 2, earned_runs: 3, strikeouts: 9, wins: 1, losses: 0, saves: 0, holds: 0}
          - {game_pk: 900001, mlbam_player_id: 910002, outs_recorded: 3, hits_allowed: 1, walks: 0, earned_runs: 0, strikeouts: 2, wins: 0, losses: 0, saves: 1, holds: 0}
    expect:
      rows:
        - {mlbam_player_id: 910001, game_date: "2026-06-01", games_batted: 1, games_pitched: 1,
           at_bats: 4, hits: 2, home_runs: 1, total_bases: 5, batter_walks: 1, runs: 1, runs_batted_in: 3, stolen_bases: 1, batter_strikeouts: 1,
           outs_recorded: 17, hits_allowed: 4, pitcher_walks: 2, earned_runs: 3, pitcher_strikeouts: 9, wins: 1, losses: 0, saves: 0, holds: 0}
        - {mlbam_player_id: 910002, game_date: "2026-06-01", games_batted: 0, games_pitched: 1,
           at_bats: 0, hits: 0, home_runs: 0, total_bases: 0, batter_walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, batter_strikeouts: 0,
           outs_recorded: 3, hits_allowed: 1, pitcher_walks: 0, earned_runs: 0, pitcher_strikeouts: 2, wins: 0, losses: 0, saves: 1, holds: 0}

  - name: game_dates_counts_only_played_games
    description: >
      A cancelled game with no boxscore doesn't make its date incomplete; a played game
      with no boxscore does. A date whose only game was postponed has nothing to load.
    model: int_mlb__game_dates
    given:
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 900001, official_date: "2026-06-01", is_played: true}
          - {game_pk: 900002, official_date: "2026-06-01", is_played: false}
          - {game_pk: 900003, official_date: "2026-06-02", is_played: true}
          - {game_pk: 900004, official_date: "2026-06-02", is_played: true}
          - {game_pk: 900005, official_date: "2026-06-03", is_played: false}
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          # Two batters in one game: loaded counts games, not lines.
          - {game_pk: 900001, mlbam_player_id: 910001}
          - {game_pk: 900001, mlbam_player_id: 910002}
          - {game_pk: 900003, mlbam_player_id: 910001}
    expect:
      rows:
        - {official_date: "2026-06-01", played_games: 1, loaded_games: 1, is_complete: true}
        - {official_date: "2026-06-02", played_games: 2, loaded_games: 1, is_complete: false}
        - {official_date: "2026-06-03", played_games: 0, loaded_games: 0, is_complete: true}

  # One test per input_status. The roster-day rows are trimmed to what the model reads.

  - name: started_player_days_status_played_credits_only_the_slot_role
    description: >
      Two players with the same two-way day: every component a scored category reads
      has its own value. In a hitter slot (UTIL) only the batting side is credited; in a
      pitcher slot (SP) only the pitching side. That is ESPN's rule (#10). Every credited
      component passes through unchanged, including the ratio categories' numerators and
      denominators: H/AB (AVG); ER and outs (ERA); hits allowed, walks and outs (WHIP);
      K and outs (K/9); saves plus holds (SVHD). Both are played: input status is about
      the whole day, not the credited part.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: 910001, is_started: true, roster_slot: UTIL, slot_role: hitter}
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 2, mlbam_player_id: 910002, is_started: true, roster_slot: SP, slot_role: pitcher}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {mlbam_player_id: 910001, game_date: "2026-06-01", games_batted: 1, games_pitched: 1,
             at_bats: 11, hits: 12, home_runs: 13, total_bases: 14, batter_walks: 15, runs: 16, runs_batted_in: 17, stolen_bases: 18, batter_strikeouts: 19,
             outs_recorded: 21, hits_allowed: 22, pitcher_walks: 23, earned_runs: 24, pitcher_strikeouts: 25, wins: 26, losses: 27, saves: 28, holds: 29}
          - {mlbam_player_id: 910002, game_date: "2026-06-01", games_batted: 1, games_pitched: 1,
             at_bats: 11, hits: 12, home_runs: 13, total_bases: 14, batter_walks: 15, runs: 16, runs_batted_in: 17, stolen_bases: 18, batter_strikeouts: 19,
             outs_recorded: 21, hits_allowed: 22, pitcher_walks: 23, earned_runs: 24, pitcher_strikeouts: 25, wins: 26, losses: 27, saves: 28, holds: 29}
      - input: ref('int_mlb__game_dates')
        rows:
          - {official_date: "2026-06-01", is_complete: true}
    expect:
      rows:
        - {platform_player_id: 1, input_status: played, played: true, slot_role: hitter, games_batted: 1, games_pitched: 0,
           at_bats: 11, hits: 12, home_runs: 13, total_bases: 14, batter_walks: 15, runs: 16, runs_batted_in: 17, stolen_bases: 18, batter_strikeouts: 19,
           outs_recorded: 0, hits_allowed: 0, pitcher_walks: 0, earned_runs: 0, pitcher_strikeouts: 0, wins: 0, losses: 0, saves: 0, holds: 0}
        - {platform_player_id: 2, input_status: played, played: true, slot_role: pitcher, games_batted: 0, games_pitched: 1,
           at_bats: 0, hits: 0, home_runs: 0, total_bases: 0, batter_walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, batter_strikeouts: 0,
           outs_recorded: 21, hits_allowed: 22, pitcher_walks: 23, earned_runs: 24, pitcher_strikeouts: 25, wins: 26, losses: 27, saves: 28, holds: 29}

  - name: started_player_days_status_verified_off_on_a_complete_date
    description: >
      Every game that date is loaded and he is in none of them: a real zero. A benched
      roster-day is not a started player-day and has no row at all.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: 910001, is_started: true, slot_role: hitter}
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 2, mlbam_player_id: 910002, is_started: false, slot_role: bench}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {mlbam_player_id: 910002, game_date: "2026-06-01", at_bats: 4}
      - input: ref('int_mlb__game_dates')
        rows:
          - {official_date: "2026-06-01", is_complete: true}
    expect:
      rows:
        - {platform_player_id: 1, input_status: verified_off, played: false, at_bats: 0, outs_recorded: 0}

  - name: started_player_days_status_verified_off_on_a_date_with_no_games
    description: >
      No MLB games that date (the All-Star break, say) means nothing could be missing.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-07-14", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: 910001, is_started: true, slot_role: hitter}
      - input: ref('int_mlb__player_game_days')
        rows: []
      - input: ref('int_mlb__game_dates')
        rows: []
    expect:
      rows:
        - {platform_player_id: 1, input_status: verified_off, played: false}

  - name: started_player_days_status_missing_boxscore_on_an_incomplete_date
    description: >
      A doubleheader with game 2's boxscore missing. A player with no stats might be in
      game 2. A player with game 1's stats might be too, so his totals may be partial:
      he is missing_boxscore as well, with played still true and his game 1 stats kept.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: 910001, is_started: true, slot_role: hitter}
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 2, mlbam_player_id: 910002, is_started: true, slot_role: hitter}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {mlbam_player_id: 910002, game_date: "2026-06-01", at_bats: 4}
      - input: ref('int_mlb__game_dates')
        rows:
          - {official_date: "2026-06-01", is_complete: false}
    expect:
      rows:
        - {platform_player_id: 1, input_status: missing_boxscore, played: false, at_bats: 0}
        - {platform_player_id: 2, input_status: missing_boxscore, played: true, at_bats: 4}

  - name: started_player_days_status_unresolved_player_wins_over_missing_boxscore
    description: >
      With no MLBAM id his stats can't be looked up at all, on any date. That is the
      more basic failure, so it outranks an incomplete date.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: null, is_started: true, slot_role: hitter}
          - {scoring_date: "2026-06-02", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: null, is_started: true, slot_role: hitter}
      - input: ref('int_mlb__player_game_days')
        rows: []
      - input: ref('int_mlb__game_dates')
        rows:
          - {official_date: "2026-06-01", is_complete: false}
          - {official_date: "2026-06-02", is_complete: true}
    expect:
      rows:
        - {scoring_date: "2026-06-01", platform_player_id: 1, input_status: unresolved_player, played: false}
        - {scoring_date: "2026-06-02", platform_player_id: 1, input_status: unresolved_player, played: false}

# -----------------------------------------------------------------------------
# Unit tests: matchup aggregation (#10).
# -----------------------------------------------------------------------------

  - name: matchup_side_totals_leave_out_a_league_season_with_no_rosters
    description: >
      Season 2025 has a matchup and no rosters, as a past season loaded for its matchup
      totals has; season 2026 has both. Only 2026's sides get a row, team 2's of zeroes
      because it started nobody. Catches: a row of zeroes for a side of a season whose
      rosters were never loaded, which reads as a team that produced nothing (ADR 0026).
    model: int_fantasy__matchup_side_totals
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
          - {platform: espn, league_id: "1", season: 2025, has_rosters: false}
      - input: ref('int_fantasy__matchup_sides')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2, is_home: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1, is_home: false}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2, is_home: true}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1, is_home: false}
      - input: ref('int_fantasy__matchup_periods')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 1, scoring_date: "2026-06-01"}
          - {platform: espn, league_id: "1", season: 2025, matchup_period: 1, scoring_date: "2025-06-01"}
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", fantasy_team_id: 1, input_status: played, at_bats: 4, hits: 2, outs_recorded: 0}
    expect:
      rows:
        - {season: 2026, fantasy_team_id: 1, started_player_days: 1, at_bats: 4, hits: 2}
        - {season: 2026, fantasy_team_id: 2, started_player_days: 0, at_bats: 0, hits: 0}

  - name: matchup_side_totals_sum_only_the_matchup_days_for_the_team
    description: >
      Matchup period 1 covers two dates. Team 1's two started days in it are summed; its
      day in period 2 and the opponent's day are not. Team 2 started nobody in period 1
      and still gets a row, of zeroes. A missing-boxscore day counts as started but not
      verified.
    model: int_fantasy__matchup_side_totals
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__matchup_sides')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2, is_home: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1, is_home: false}
      - input: ref('int_fantasy__matchup_periods')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 1, scoring_date: "2026-06-01"}
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 1, scoring_date: "2026-06-02"}
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 2, scoring_date: "2026-06-03"}
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", fantasy_team_id: 1, input_status: played, at_bats: 4, hits: 2, outs_recorded: 0}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-02", fantasy_team_id: 1, input_status: missing_boxscore, at_bats: 3, hits: 1, outs_recorded: 6}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-03", fantasy_team_id: 1, input_status: played, at_bats: 5, hits: 5, outs_recorded: 9}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-03", fantasy_team_id: 2, input_status: played, at_bats: 4, hits: 1, outs_recorded: 3}
    expect:
      rows:
        - {fantasy_team_id: 1, started_player_days: 2, verified_player_days: 1, missing_boxscore_player_days: 1, unresolved_player_days: 0, at_bats: 7, hits: 3, outs_recorded: 6}
        - {fantasy_team_id: 2, started_player_days: 0, verified_player_days: 0, missing_boxscore_player_days: 0, unresolved_player_days: 0, at_bats: 0, hits: 0, outs_recorded: 0}

  - name: matchup_stat_values_follow_the_component_rules
    description: >
      One side's totals through four kinds of rule: a count (HR), a sum (SVHD = saves +
      holds), a scaled rate (ERA = 27 * ER / outs) and a rate with two weighted
      numerator terms (WHIP = (3 * H + 3 * BB) / outs). The second side has no outs, so
      its ERA is null, not zero.
    model: int_fantasy__matchup_stat_values
    given:
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2, is_home: true,
             home_runs: 4, saves: 2, holds: 3, earned_runs: 10, outs_recorded: 54, hits_allowed: 15, pitcher_walks: 6}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1, is_home: false,
             home_runs: 0, saves: 0, holds: 0, earned_runs: 0, outs_recorded: 0, hits_allowed: 0, pitcher_walks: 0}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 5, part: numerator, component: home_runs, weight: 1}
          - {platform: espn, stat_key: 83, part: numerator, component: saves, weight: 1}
          - {platform: espn, stat_key: 83, part: numerator, component: holds, weight: 1}
          - {platform: espn, stat_key: 47, part: numerator, component: earned_runs, weight: 27}
          - {platform: espn, stat_key: 47, part: denominator, component: outs_recorded, weight: 1}
          - {platform: espn, stat_key: 41, part: numerator, component: hits_allowed, weight: 3}
          - {platform: espn, stat_key: 41, part: numerator, component: pitcher_walks, weight: 3}
          - {platform: espn, stat_key: 41, part: denominator, component: outs_recorded, weight: 1}
    expect:
      rows:
        - {fantasy_team_id: 1, stat_key: 5, numerator: 4, denominator: null, stat_value: 4}
