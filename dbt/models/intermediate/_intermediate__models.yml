version: 2

models:
  # ---------------------------------------------------------------------------
  # The platform seam.
  #
  # These carry `contract: enforced`. dbt checks the built relation against
  # the declared columns and types and fails the build on any mismatch, so
  # "a second platform slots in behind this layer" is something CI verifies
  # rather than something the README asserts.
  #
  # Contracts are not supported on ephemeral models, which is why these are
  # views and int_fantasy__player_crosswalk is the ephemeral one.
  # ---------------------------------------------------------------------------

  - name: int_fantasy__teams
    description: One row per fantasy team, in platform-neutral terms.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: fantasy_team_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: team_name
        data_type: varchar
      - name: team_abbrev
        data_type: varchar
      - name: playoff_seed
        data_type: bigint
      - name: wins
        data_type: bigint
      - name: losses
        data_type: bigint
      - name: ties
        data_type: bigint
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, fantasy_team_id]

  - name: int_fantasy__league_seasons
    description: >
      One row per league-season with settings loaded, and whether its rosters are loaded
      (ADR 0026). A model or test that needs rosters applies where has_rosters is true;
      one that describes what the platform reported applies to every league-season.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: has_rosters
        description: >
          True when at least one roster entry is loaded for the league-season. Read from
          the data, never declared.
        data_type: boolean
        constraints: [{type: not_null}]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season]

  - name: int_fantasy__categories
    description: >
      One row per scored category. is_lower_better renames ESPN's is_reverse, because
      "reverse" means nothing outside ESPN; ERA and WHIP are won by the smaller number.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: category_key
        data_type: bigint
        constraints: [{type: not_null}]
        # That a scored category has a rule in int_fantasy__stat_components is the singular
        # test int_fantasy__scored_categories_have_a_component_rule: it holds for
        # league-seasons with rosters, which a relationships test cannot say (ADR 0026).
      - name: category_label
        data_type: varchar
        constraints: [{type: not_null}]
      - name: category_unit
        data_type: varchar
      - name: is_lower_better
        data_type: boolean
        constraints: [{type: not_null}]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, category_key]

  - name: int_fantasy__reported_matchup_margins
    description: >
      One row per (decided two-sided matchup, scored category), for every league-season
      loaded: the margin the league host reported, home minus away, restated for a
      matchup period of usual volume, and whether it counts toward a scale (ADR 0027).
      Playoff matchups and rates with no usable denominator are kept, unmeasured.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: matchup_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: category_key
        data_type: bigint
        constraints: [{type: not_null}]
      - name: is_regular_season
        description: False for a playoff matchup of any tier.
        data_type: boolean
        constraints: [{type: not_null}]
      - name: margin
        description: Home's reported total minus away's, as reported.
        data_type: double
        constraints: [{type: not_null}]
      - name: is_rate
        description: The category has a denominator part in int_fantasy__stat_components.
        data_type: boolean
        constraints: [{type: not_null}]
      - name: home_denominator
        description: >
          For a rate, the home side's reported denominator; null for a count, or when
          the host does not report it.
        data_type: double
      - name: away_denominator
        data_type: double
      - name: relative_volume
        description: >
          How much was played in the matchup period against the league-season's usual
          regular-season period; 1 is usual. Null for a playoff matchup.
        data_type: double
      - name: standard_margin
        description: >
          The margin restated for a period of usual volume: divided by the square root
          of relative_volume for a count, multiplied by it for a rate. Null where there
          is no relative volume above zero.
        data_type: double
      - name: is_measured
        description: >
          Whether the row counts toward a scale: a regular-season matchup, in a period
          with a relative volume above zero, and for a rate both denominators reported
          and above zero.
        data_type: boolean
        constraints: [{type: not_null}]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, matchup_id, category_key]
      - dbt_utils.expression_is_true:
          name: int_fantasy__reported_matchup_margins_measured_rows_have_a_standard_margin
          arguments:
            expression: "not is_measured or standard_margin is not null"

  - name: int_fantasy__reported_category_scales
    description: >
      One row per scored category of every league-season loaded: the scale the league
      host's reported margins give for that season alone, standardised for volume, and
      the number of matchups behind it, zero where there are none. The report of how
      seasons compare and of what was loaded; no value is computed from it.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: category_key
        data_type: bigint
        constraints: [{type: not_null}]
      - name: matchups_measured
        description: Measured rows of int_fantasy__reported_matchup_margins behind the scale.
        data_type: bigint
        constraints: [{type: not_null}]
      - name: margin_scale
        description: Root mean square of those rows' standard margins; null when none.
        data_type: double
      - name: side_denominator
        description: >
          For a rate, the mean over those matchups' sides of the reported denominator
          divided by the period's relative volume; null for a count or when none.
        data_type: double
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, category_key]
      - dbt_utils.expression_is_true:
          name: int_fantasy__reported_category_scales_have_a_scale_where_measured
          arguments:
            expression: "(matchups_measured > 0) = (margin_scale is not null)"

  - name: int_fantasy__category_scales
    description: >
      One row per scored category of a league-season with rosters: the usual gap between
      two teams in it (margin_scale, a root mean square of home-minus-away margins, about
      zero so swapping sides changes nothing) and, for a rate, the typical denominator of
      a side (side_denominator, null for a count). Both value facts divide by these (ADR
      0010). Where the league's earlier seasons hold enough matchups the two are a blend
      of those seasons, counted as fantasy_scale_prior_matchups, and the season's own
      decided matchups (ADR 0027); otherwise they are measured from the season alone.
      scale_source says which. A category with nothing measured keeps a row with a null
      scale.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: category_key
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: matchups_measured
        description: >
          The league-season's own matchups behind the scale: under
          prior_and_current_seasons its decided regular-season matchups as the host
          reported them, under current_season its matchups as we recompute them.
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: margin_scale
        data_type: double
      - name: side_denominator
        data_type: double
      - name: scale_source
        description: >
          prior_and_current_seasons when the league's earlier seasons hold at least
          fantasy_scale_prior_matchups measured matchups in the category and are blended
          with the season's own; current_season when the scale is the season's alone.
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments:
                values: [prior_and_current_seasons, current_season]
      - name: prior_matchups_measured
        description: Measured matchups of the league's earlier seasons in the category, used or not.
        data_type: bigint
        constraints: [{type: not_null}]
      - name: prior_seasons_measured
        description: How many earlier seasons those matchups come from.
        data_type: bigint
        constraints: [{type: not_null}]
      - name: prior_margin_scale
        description: >
          The scale of the earlier seasons alone, pooled over matchups; null under
          current_season. With margin_scale and matchups_measured it explains the blend.
        data_type: double
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, category_key]

  - name: int_fantasy__matchup_periods
    description: >
      One row per (matchup period, calendar date). Periods are not a uniform length --
      12, 14 and 7 days all occur -- so consumers take the span from here.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: matchup_period
        data_type: bigint
        constraints: [{type: not_null}]
      - name: scoring_period
        data_type: bigint
        constraints: [{type: not_null}]
      - name: scoring_date
        data_type: date
        constraints: [{type: not_null}]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, scoring_date]

  - name: int_fantasy__matchup_sides
    description: >
      One row per side of a played head-to-head matchup: each matchup twice, once from
      each team's view. Playoff byes are excluded -- they have no opponent and no result.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: matchup_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: matchup_period
        data_type: bigint
        constraints: [{type: not_null}]
      - name: fantasy_team_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: opponent_team_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: is_home
        data_type: boolean
        constraints: [{type: not_null}]
      - name: playoff_tier
        data_type: varchar
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, matchup_id, fantasy_team_id]
      # A team plays at most one matchup per period.
      - dbt_utils.unique_combination_of_columns:
          name: int_fantasy__matchup_sides_one_matchup_per_team_period
          arguments:
            combination_of_columns: [platform, league_id, season, matchup_period, fantasy_team_id]
      - dbt_utils.expression_is_true:
          name: int_fantasy__matchup_sides_team_is_not_its_own_opponent
          arguments:
            expression: "fantasy_team_id != opponent_team_id"

  - name: int_fantasy__stat_components
    description: >
      How every platform stat is computed from credited components: value =
      sum(weight * component) over numerator rows, divided by the same over denominator
      rows when there are any. The rules behind every score in the marts.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: stat_key
        data_type: bigint
        constraints: [{type: not_null}]
      - name: part
        data_type: varchar
        constraints: [{type: not_null}]
      - name: component
        data_type: varchar
        constraints: [{type: not_null}]
      - name: weight
        data_type: double
        constraints: [{type: not_null}]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, stat_key, part, component]

  - name: int_fantasy__roster_days
    description: >
      One row per (fantasy team, player, date). Every roster day, not just the starts --
      the bench is the point of the lineup marts. mlbam_player_id is nullable by design
      even though nothing is null in 2026: the crosswalk lags for late call-ups, so an
      unresolved player must surface as a gap rather than be dropped.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: scoring_date
        data_type: date
        constraints: [{type: not_null}]
      - name: scoring_period
        data_type: bigint
        constraints: [{type: not_null}]
      - name: fantasy_team_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: platform_player_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: mlbam_player_id
        data_type: bigint
      - name: player_resolution
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ["crosswalk_id", "unambiguous_name", "unresolved"]
      - name: player_name
        data_type: varchar
      - name: roster_slot_id
        data_type: bigint
      - name: roster_slot
        data_type: varchar
        constraints: [{type: not_null}]
      - name: is_started
        data_type: boolean
        constraints: [{type: not_null}]
      - name: slot_role
        description: >
          Which side of the player's game this slot credits: hitter (batting only),
          pitcher (pitching only) or bench (neither).
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests:
          - accepted_values:
              arguments:
                values: [hitter, pitcher, bench]
      - name: default_position
        data_type: varchar
      - name: injury_status
        data_type: varchar
      - name: acquisition_type
        data_type: varchar
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [platform, league_id, season, scoring_date, fantasy_team_id, platform_player_id]

  - name: int_fantasy__transactions
    description: >
      One row per transaction message: a player added or dropped, with the fantasy team
      that acted. The acting team is `to` or `for` depending on the message type, chosen
      by the espn_activity_types seed (ADR 0004). Trades are not here: they have no rule,
      and a type with no rule fails the movement test rather than being guessed. Keyed by
      league and season too (#28): a transaction id is unique only inside one.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: transaction_id
        data_type: varchar
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: topic_id
        data_type: varchar
      - name: transacted_at
        data_type: timestamp with time zone
      - name: transaction_date
        data_type: date
      - name: platform_player_id
        data_type: bigint
      - name: fantasy_team_id
        description: >
          The team that acted. A null means the seed's team_field named a message field
          the message did not carry.
        data_type: bigint
        data_tests:
          # That the team belongs to the SAME league and season is the singular test
          # int_fantasy__transactions_name_a_team_of_their_league_season: a
          # single-column relationships test would pass for a team of another league.
          - not_null
      - name: movement
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [add, drop]
      - name: method
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: [free_agent, waiver, drop]
      - name: dropped_from_slot
        description: >
          For a type-239 drop, the lineup slot the player left (message_from is a slot
          id there, not a team); null for every other row.
        data_type: varchar
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, transaction_id]

  - name: int_fantasy__replacement_levels
    description: >
      The production of a replacement player, per played day: one row per (league, season,
      day kind, component), the kind being batting, start or relief (ADR 0008). The batting pool is
      the top N unrostered hitters by plate appearances. A pitching pool is the top N
      unrostered pitchers with a day of that kind, ranked by how many such days they had,
      then outs recorded; its level counts only days of that kind, so a swingman's starts
      are not in the relief level. N is that league-season's own number of fantasy teams, and
      its free agents are the players on none of that league's rosters (#28). The level is the pool's
      component total over its played days. Every kind has its rows even with an empty
      pool, where pool_players and pool_played_days are 0 and pool_total and
      level_per_played_day are null: an empty pool must not read as a replacement who
      produces nothing.
    columns:
      - name: platform
        data_tests: [not_null]
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: day_kind
        description: batting, start or relief; the kind of day the level is measured over.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [batting, start, relief]
      - name: component
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - games_batted
                  - plate_appearances
                  - at_bats
                  - hits
                  - doubles
                  - triples
                  - home_runs
                  - runs
                  - runs_batted_in
                  - batter_walks
                  - batter_strikeouts
                  - stolen_bases
                  - caught_stealing
                  - hit_by_pitch
                  - sacrifice_flies
                  - total_bases
                  - games_pitched
                  - games_started
                  - outs_recorded
                  - batters_faced
                  - hits_allowed
                  - runs_allowed
                  - earned_runs
                  - home_runs_allowed
                  - pitcher_walks
                  - pitcher_strikeouts
                  - hit_batsmen
                  - wins
                  - losses
                  - saves
                  - holds
                  - blown_saves
      - name: pool_players
        data_tests: [not_null]
      - name: pool_played_days
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, day_kind, component]

  # ---------------------------------------------------------------------------
  # Not part of the seam: MLB facts and the attribution grain.
  # ---------------------------------------------------------------------------

  - name: int_mlb__game_dates
    description: >
      One row per MLB official date with games scheduled: played games, how many of them
      have loaded boxscores, and whether that is all of them. What lets a started player
      with no stats be called a verified day off rather than a missing input (#25).
    columns:
      - name: official_date
        data_tests: [not_null, unique]
      - name: played_games
        data_tests: [not_null]
      - name: loaded_games
        data_tests: [not_null]
      - name: is_complete
        data_tests: [not_null]
    data_tests:
      - dbt_utils.expression_is_true:
          name: int_mlb__game_dates_complete_means_all_loaded
          arguments:
            expression: "is_complete = (loaded_games = played_games)"

  - name: int_mlb__player_game_days
    description: >
      One row per (player, date). Doubleheaders summed; a player who both batted and
      pitched is one row with both sides populated. Components only, never rates.
    columns:
      - name: mlbam_player_id
        data_tests: [not_null]
      - name: game_date
        data_tests: [not_null]
      - name: season
        description: The MLB season of that date's games.
        data_tests: [not_null]
      - name: at_bats
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: true}
      - name: outs_recorded
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: true}
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [mlbam_player_id, game_date]
      - dbt_utils.expression_is_true:
          name: int_mlb__player_game_days_hits_within_at_bats
          arguments:
            expression: "hits <= at_bats"
      - dbt_utils.expression_is_true:
          name: int_mlb__player_game_days_played_at_least_once
          arguments:
            expression: "games_batted + games_pitched >= 1"

  - name: int_fantasy__started_player_days
    description: >
      The attribution grain: one row per started player-day with the MLB production his
      slot credits -- batting from a hitter slot, pitching from a pitcher slot, as ESPN
      scores it (#10). A started player who did not play yields zeroes, not a missing row
      -- "started nobody" and "started someone who did nothing" are different mistakes.
    columns:
      - name: scoring_date
        data_tests: [not_null]
      - name: fantasy_team_id
        data_tests: [not_null]
      - name: platform_player_id
        data_tests: [not_null]
      - name: played
        data_tests: [not_null]
      - name: slot_role
        description: >
          Which side of his day the slot credits. Never bench: a benched player is not
          started.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hitter, pitcher]
      - name: input_status
        description: >
          Whether this row's numbers can be trusted (#25). played and verified_off are
          complete: every game that date is loaded, and he is in one of them or in none.
          missing_boxscore and unresolved_player are unknown, possibly partial, and must
          be reported separately, never scored as complete. The played boolean says
          only whether he appears in what is loaded, so it can be true on a
          missing_boxscore row.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [played, verified_off, missing_boxscore, unresolved_player]
          # A warning, not an error: the CI fixtures load 2 of 24 scheduled games on
          # purpose, so every fixture date is incomplete. On the real warehouse it should
          # be silent; the audit gates missing boxscores to zero before data is trusted.
          - accepted_values:
              name: int_fantasy__started_player_days_inputs_all_verified
              arguments:
                values: [played, verified_off]
              config:
                severity: warn
    data_tests:
      - dbt_utils.expression_is_true:
          name: int_fantasy__started_player_days_hitters_credit_no_pitching
          arguments:
            expression: "games_pitched = 0 and outs_recorded = 0 and pitcher_strikeouts = 0 and earned_runs = 0"
            config:
              where: "slot_role = 'hitter'"
      - dbt_utils.expression_is_true:
          name: int_fantasy__started_player_days_pitchers_credit_no_batting
          arguments:
            expression: "games_batted = 0 and at_bats = 0 and hits = 0 and batter_walks = 0"
            config:
              where: "slot_role = 'pitcher'"
      - dbt_utils.expression_is_true:
          name: int_fantasy__started_player_days_played_matches_input_status
          arguments:
            expression: "played = (input_status = 'played')"
            config:
              where: "input_status in ('played', 'verified_off')"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [platform, league_id, season, scoring_date, fantasy_team_id, platform_player_id]
      - dbt_utils.expression_is_true:
          name: int_fantasy__started_player_days_no_stats_without_a_game
          arguments:
            expression: "at_bats = 0 and outs_recorded = 0"
            config:
              where: "not played"

  # ---------------------------------------------------------------------------
  # Matchup aggregation (#10): credited components per side, then stat values.
  # ---------------------------------------------------------------------------

  - name: int_fantasy__matchup_side_totals
    description: >
      One row per matchup side: every credited component summed over the matchup
      period's days, with counts of started player-days by input status. Every side has
      a row, even one that started nobody.
    columns:
      - name: started_player_days
        data_tests: [not_null]
      - name: verified_player_days
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, matchup_id, fantasy_team_id]
      - dbt_utils.expression_is_true:
          name: int_fantasy__matchup_side_totals_statuses_add_up
          arguments:
            expression: >-
              verified_player_days + missing_boxscore_player_days + unresolved_player_days
              = started_player_days
      # That it holds every side, no more and no fewer, is the singular test
      # int_fantasy__matchup_side_totals_hold_every_side: it compares with the sides of
      # league-seasons with rosters, which a row count against all sides cannot (ADR 0026).

  - name: int_fantasy__matchup_stat_values
    description: >
      One row per (matchup side, stat): numerator, denominator and value, computed from
      the side's totals by int_fantasy__stat_components. A zero denominator gives a null
      value rather than a fake zero.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, matchup_id, fantasy_team_id, stat_key]
      - dbt_utils.expression_is_true:
          name: int_fantasy__matchup_stat_values_numerator_present
          arguments:
            expression: "numerator is not null"

# -----------------------------------------------------------------------------
# Unit tests: int_fantasy__player_crosswalk (review R6).
#
# The crosswalk is ephemeral, so it has no relation to query; unit tests are the only way
# to exercise its rules on their own. Each test states only the columns the model reads.
# Empty inputs are `rows: []`.
# -----------------------------------------------------------------------------

unit_tests:
  - name: league_seasons_are_covered_only_where_rosters_are_loaded
    description: >
      Season 2026 has settings and roster entries; season 2025 has settings only, as a
      past season landed for its matchup totals does. Catches: a season with no rosters
      called covered, and a season dropped because it has none.
    model: int_fantasy__league_seasons
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2026}
          - {league_id: "1", season: 2025}
      - input: ref('stg_espn__roster_entries')
        rows:
          - {league_id: "1", season: 2026, scoring_period: 1}
          - {league_id: "1", season: 2026, scoring_period: 2}
    expect:
      rows:
        - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
        - {platform: espn, league_id: "1", season: 2025, has_rosters: false}

  - name: league_season_coverage_does_not_leak_between_leagues_or_seasons
    description: >
      Two leagues and two seasons; rosters are loaded for league 1 in 2026 and league 2
      in 2025 only. Each of the four league-seasons is one row, covered by its own
      rosters and no other's. Catches: a join on the league alone or the season alone,
      which would cover all four, and rows multiplied by the number of roster entries.
    model: int_fantasy__league_seasons
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2026}
          - {league_id: "1", season: 2025}
          - {league_id: "2", season: 2026}
          - {league_id: "2", season: 2025}
      - input: ref('stg_espn__roster_entries')
        rows:
          - {league_id: "1", season: 2026, scoring_period: 1}
          - {league_id: "1", season: 2026, scoring_period: 2}
          - {league_id: "2", season: 2025, scoring_period: 1}
    expect:
      rows:
        - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
        - {platform: espn, league_id: "1", season: 2025, has_rosters: false}
        - {platform: espn, league_id: "2", season: 2026, has_rosters: false}
        - {platform: espn, league_id: "2", season: 2025, has_rosters: true}

  - name: crosswalk_one_row_per_id_named_by_the_latest_snapshot
    description: >
      One ESPN id spelled two ways in a league-season is one row, named as on the latest
      snapshot; the period decides before fetched_at, because every period in one
      backfill shares a fetched_at. The same id in another season is a row of its own,
      named from that season's snapshots only. Catches: a name taken from another
      season, and a double row for a respelled player.
    model: int_fantasy__player_crosswalk
    given:
      - input: ref('stg_espn__roster_entries')
        rows:
          # id 1: accent added in a later period of the same backfill (tied fetched_at).
          - {league_id: "1", season: 2026, scoring_period: 5, espn_player_id: 1, player_name: "Jose Ramirez", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "1", season: 2026, scoring_period: 6, espn_player_id: 1, player_name: "José Ramírez", fetched_at: "2026-09-26 00:00:00"}
          # id 2: one row per league-season, each named by its own snapshots.
          - {league_id: "1", season: 2026, scoring_period: 180, espn_player_id: 2, player_name: "Old Spelling", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "1", season: 2027, scoring_period: 1, espn_player_id: 2, player_name: "New Spelling", fetched_at: "2026-01-01 00:00:00"}
      - input: ref('stg_idmap__players')
        rows:
          - {espn_player_id: 1, mlbam_player_id: 608070}
          - {espn_player_id: 2, mlbam_player_id: 700002}
      - input: ref('stg_mlb__batting_game_logs')
        rows: []
      - input: ref('stg_mlb__pitching_game_logs')
        rows: []
      - input: ref('stg_mlb__games')
        rows: []
    expect:
      rows:
        - {league_id: "1", season: 2026, platform_player_id: 1, player_name: "José Ramírez", mlbam_player_id: 608070, resolution: crosswalk_id}
        - {league_id: "1", season: 2026, platform_player_id: 2, player_name: "Old Spelling", mlbam_player_id: 700002, resolution: crosswalk_id}
        - {league_id: "1", season: 2027, platform_player_id: 2, player_name: "New Spelling", mlbam_player_id: 700002, resolution: crosswalk_id}

  - name: crosswalk_exact_ties_break_the_same_way_in_either_input_order
    description: >
      Same league-season, period and fetched_at, two names: the name decides. League 2's
      row for the same id is its own resolution. The winner is neither the first nor the
      last row, and the next test gives the rows in reverse; the answer must not change.
    model: int_fantasy__player_crosswalk
    given:
      - input: ref('stg_espn__roster_entries')
        rows:
          - {league_id: "2", season: 2026, scoring_period: 9, espn_player_id: 3, player_name: "Abe Name", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "1", season: 2026, scoring_period: 9, espn_player_id: 3, player_name: "Yves Name", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "1", season: 2026, scoring_period: 9, espn_player_id: 3, player_name: "Zed Name", fetched_at: "2026-09-26 00:00:00"}
      - input: ref('stg_idmap__players')
        rows: []
      - input: ref('stg_mlb__batting_game_logs')
        rows: []
      - input: ref('stg_mlb__pitching_game_logs')
        rows: []
      - input: ref('stg_mlb__games')
        rows: []
    expect:
      rows:
        - {league_id: "1", season: 2026, platform_player_id: 3, player_name: "Yves Name", resolution: unresolved}
        - {league_id: "2", season: 2026, platform_player_id: 3, player_name: "Abe Name", resolution: unresolved}

  - name: crosswalk_exact_ties_break_the_same_way_in_reverse_input_order
    model: int_fantasy__player_crosswalk
    given:
      - input: ref('stg_espn__roster_entries')
        rows:
          - {league_id: "1", season: 2026, scoring_period: 9, espn_player_id: 3, player_name: "Zed Name", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "1", season: 2026, scoring_period: 9, espn_player_id: 3, player_name: "Yves Name", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "2", season: 2026, scoring_period: 9, espn_player_id: 3, player_name: "Abe Name", fetched_at: "2026-09-26 00:00:00"}
      - input: ref('stg_idmap__players')
        rows: []
      - input: ref('stg_mlb__batting_game_logs')
        rows: []
      - input: ref('stg_mlb__pitching_game_logs')
        rows: []
      - input: ref('stg_mlb__games')
        rows: []
    expect:
      rows:
        - {league_id: "1", season: 2026, platform_player_id: 3, player_name: "Yves Name", resolution: unresolved}
        - {league_id: "2", season: 2026, platform_player_id: 3, player_name: "Abe Name", resolution: unresolved}

  - name: crosswalk_resolution_precedence
    description: >
      The id crosswalk beats a name match; an accent-stripped name matches only when one
      MLB player has it; ambiguous and unknown names stay unresolved; and the fallback
      uses the canonical (latest) name only, never an older spelling.
    model: int_fantasy__player_crosswalk
    given:
      - input: ref('stg_espn__roster_entries')
        rows:
          # id over name: the name belongs to a different MLB player.
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 10, player_name: "Will Smith", fetched_at: "2026-09-26 00:00:00"}
          # accent variant: ESPN strips accents, MLB keeps them.
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 11, player_name: "Andres Gimenez", fetched_at: "2026-09-26 00:00:00"}
          # ambiguous: two MLB players share the name.
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 12, player_name: "Max Muncy", fetched_at: "2026-09-26 00:00:00"}
          # unknown everywhere.
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 13, player_name: "Nobody Known", fetched_at: "2026-09-26 00:00:00"}
          # the older spelling would match; the canonical one does not.
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 14, player_name: "Matched Once", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "1", season: 2026, scoring_period: 2, espn_player_id: 14, player_name: "Renamed Since", fetched_at: "2026-09-26 00:00:00"}
      - input: ref('stg_idmap__players')
        rows:
          - {espn_player_id: 10, mlbam_player_id: 669257}
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          - {game_pk: 1, mlbam_player_id: 519299, player_name: "Will Smith"}
          - {game_pk: 1, mlbam_player_id: 641313, player_name: "Andrés Giménez"}
          - {game_pk: 1, mlbam_player_id: 571970, player_name: "Max Muncy"}
          - {game_pk: 1, mlbam_player_id: 691777, player_name: "Max Muncy"}
          - {game_pk: 1, mlbam_player_id: 700014, player_name: "Matched Once"}
      - input: ref('stg_mlb__pitching_game_logs')
        rows: []
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 1, season: 2026}
    expect:
      rows:
        - {league_id: "1", season: 2026, platform_player_id: 10, mlbam_player_id: 669257, resolution: crosswalk_id}
        - {league_id: "1", season: 2026, platform_player_id: 11, mlbam_player_id: 641313, resolution: unambiguous_name}
        - {league_id: "1", season: 2026, platform_player_id: 12, mlbam_player_id: null, resolution: unresolved}
        - {league_id: "1", season: 2026, platform_player_id: 13, mlbam_player_id: null, resolution: unresolved}
        - {league_id: "1", season: 2026, platform_player_id: 14, mlbam_player_id: null, resolution: unresolved}

  - name: crosswalk_another_season_neither_creates_nor_destroys_a_match
    description: >
      Nobody here is in the id map, so the name fallback decides. "Solo Name" is one MLB
      player in 2026 and two in 2027: the player rostered in 2026 resolves by name, the
      one rostered in 2027 is unresolved. "Rookie Name" is unique in 2027 only, and the
      ESPN player of that name rostered in 2026 stays unresolved. Catches: another season
      creating a match (a 2027 name reaching a 2026 player) or destroying one (a second
      2027 player making a 2026 name ambiguous).
    model: int_fantasy__player_crosswalk
    given:
      - input: ref('stg_espn__roster_entries')
        rows:
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 20, player_name: "Solo Name", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "1", season: 2027, scoring_period: 1, espn_player_id: 21, player_name: "Solo Name", fetched_at: "2027-09-26 00:00:00"}
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 22, player_name: "Rookie Name", fetched_at: "2026-09-26 00:00:00"}
      - input: ref('stg_idmap__players')
        rows: []
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          - {game_pk: 1, mlbam_player_id: 800001, player_name: "Solo Name"}
          - {game_pk: 2, mlbam_player_id: 800001, player_name: "Solo Name"}
          - {game_pk: 2, mlbam_player_id: 800002, player_name: "Solo Name"}
          - {game_pk: 2, mlbam_player_id: 800003, player_name: "Rookie Name"}
      - input: ref('stg_mlb__pitching_game_logs')
        rows: []
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 1, season: 2026}
          - {game_pk: 2, season: 2027}
    expect:
      rows:
        - {league_id: "1", season: 2026, platform_player_id: 20, mlbam_player_id: 800001, resolution: unambiguous_name}
        - {league_id: "1", season: 2027, platform_player_id: 21, mlbam_player_id: null, resolution: unresolved}
        - {league_id: "1", season: 2026, platform_player_id: 22, mlbam_player_id: null, resolution: unresolved}

  - name: crosswalk_one_leagues_spelling_does_not_decide_anothers_match
    description: >
      One ESPN id (not in the id map) rostered in two leagues of one season under two
      names that differ after accents are stripped: "Pat Matched" matches an MLB player,
      "Pat Mismatched" matches nobody. League 1 resolves, league 2 is unresolved.
      Catches: one league's spelling deciding another's match (an accent-only difference
      or an id-mapped player could not show this).
    model: int_fantasy__player_crosswalk
    given:
      - input: ref('stg_espn__roster_entries')
        rows:
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 30, player_name: "Pat Matched", fetched_at: "2026-09-26 00:00:00"}
          - {league_id: "2", season: 2026, scoring_period: 1, espn_player_id: 30, player_name: "Pat Mismatched", fetched_at: "2026-09-26 00:00:00"}
      - input: ref('stg_idmap__players')
        rows: []
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          - {game_pk: 1, mlbam_player_id: 810001, player_name: "Pat Matched"}
      - input: ref('stg_mlb__pitching_game_logs')
        rows: []
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 1, season: 2026}
    expect:
      rows:
        - {league_id: "1", season: 2026, platform_player_id: 30, player_name: "Pat Matched", mlbam_player_id: 810001, resolution: unambiguous_name}
        - {league_id: "2", season: 2026, platform_player_id: 30, player_name: "Pat Mismatched", mlbam_player_id: null, resolution: unresolved}

# -----------------------------------------------------------------------------
# Unit tests: MLB day aggregation and per player-day input status (#25).
#
# The CI fixtures have no doubleheader and no two-way player-day, and the real warehouse
# can't be checked in, so these synthetic cases are what prove the rules. Ids in the
# 900000s are made up.
# -----------------------------------------------------------------------------

  - name: player_game_days_sums_a_doubleheader_into_one_day
    description: >
      Two games on one official date are one player-day with both games' production.
      A game on the next date stays its own day.
    model: int_mlb__player_game_days
    given:
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 900001, official_date: "2026-06-01"}
          - {game_pk: 900002, official_date: "2026-06-01"}
          - {game_pk: 900003, official_date: "2026-06-02"}
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          - {game_pk: 900001, mlbam_player_id: 910001, at_bats: 4, hits: 1, home_runs: 0, total_bases: 1, walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, strikeouts: 2}
          - {game_pk: 900002, mlbam_player_id: 910001, at_bats: 3, hits: 2, home_runs: 1, total_bases: 5, walks: 1, runs: 1, runs_batted_in: 2, stolen_bases: 1, strikeouts: 0}
          - {game_pk: 900003, mlbam_player_id: 910001, at_bats: 5, hits: 0, home_runs: 0, total_bases: 0, walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, strikeouts: 1}
      - input: ref('stg_mlb__pitching_game_logs')
        rows: []
    expect:
      rows:
        - {mlbam_player_id: 910001, game_date: "2026-06-01", games_batted: 2, games_pitched: 0, at_bats: 7, hits: 3, home_runs: 1, total_bases: 6, batter_walks: 1, runs: 1, runs_batted_in: 2, stolen_bases: 1, batter_strikeouts: 2, outs_recorded: 0}
        - {mlbam_player_id: 910001, game_date: "2026-06-02", games_batted: 1, games_pitched: 0, at_bats: 5, hits: 0, home_runs: 0, total_bases: 0, batter_walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, batter_strikeouts: 1, outs_recorded: 0}

  - name: player_game_days_batting_and_pitching_on_one_day_are_one_row
    description: >
      A player who bats and pitches on the same day is one row with both sides populated;
      a pitcher who didn't bat still gets a row, with zero batting. Every component a
      scored category reads gets its own value, so a crossed or dropped column (batter
      walks into pitcher walks, say) shows up as a wrong number.
    model: int_mlb__player_game_days
    given:
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 900001, official_date: "2026-06-01"}
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          - {game_pk: 900001, mlbam_player_id: 910001, at_bats: 4, hits: 2, home_runs: 1, total_bases: 5, walks: 1, runs: 1, runs_batted_in: 3, stolen_bases: 1, strikeouts: 1}
      - input: ref('stg_mlb__pitching_game_logs')
        rows:
          - {game_pk: 900001, mlbam_player_id: 910001, outs_recorded: 17, hits_allowed: 4, walks: 2, earned_runs: 3, strikeouts: 9, wins: 1, losses: 0, saves: 0, holds: 0}
          - {game_pk: 900001, mlbam_player_id: 910002, outs_recorded: 3, hits_allowed: 1, walks: 0, earned_runs: 0, strikeouts: 2, wins: 0, losses: 0, saves: 1, holds: 0}
    expect:
      rows:
        - {mlbam_player_id: 910001, game_date: "2026-06-01", games_batted: 1, games_pitched: 1,
           at_bats: 4, hits: 2, home_runs: 1, total_bases: 5, batter_walks: 1, runs: 1, runs_batted_in: 3, stolen_bases: 1, batter_strikeouts: 1,
           outs_recorded: 17, hits_allowed: 4, pitcher_walks: 2, earned_runs: 3, pitcher_strikeouts: 9, wins: 1, losses: 0, saves: 0, holds: 0}
        - {mlbam_player_id: 910002, game_date: "2026-06-01", games_batted: 0, games_pitched: 1,
           at_bats: 0, hits: 0, home_runs: 0, total_bases: 0, batter_walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, batter_strikeouts: 0,
           outs_recorded: 3, hits_allowed: 1, pitcher_walks: 0, earned_runs: 0, pitcher_strikeouts: 2, wins: 0, losses: 0, saves: 1, holds: 0}

  - name: game_dates_counts_only_played_games
    description: >
      A cancelled game with no boxscore doesn't make its date incomplete; a played game
      with no boxscore does. A date whose only game was postponed has nothing to load.
    model: int_mlb__game_dates
    given:
      - input: ref('stg_mlb__games')
        rows:
          - {game_pk: 900001, official_date: "2026-06-01", is_played: true}
          - {game_pk: 900002, official_date: "2026-06-01", is_played: false}
          - {game_pk: 900003, official_date: "2026-06-02", is_played: true}
          - {game_pk: 900004, official_date: "2026-06-02", is_played: true}
          - {game_pk: 900005, official_date: "2026-06-03", is_played: false}
      - input: ref('stg_mlb__batting_game_logs')
        rows:
          # Two batters in one game: loaded counts games, not lines.
          - {game_pk: 900001, mlbam_player_id: 910001}
          - {game_pk: 900001, mlbam_player_id: 910002}
          - {game_pk: 900003, mlbam_player_id: 910001}
    expect:
      rows:
        - {official_date: "2026-06-01", played_games: 1, loaded_games: 1, is_complete: true}
        - {official_date: "2026-06-02", played_games: 2, loaded_games: 1, is_complete: false}
        - {official_date: "2026-06-03", played_games: 0, loaded_games: 0, is_complete: true}

  # One test per input_status. The roster-day rows are trimmed to what the model reads.

  - name: started_player_days_status_played_credits_only_the_slot_role
    description: >
      Two players with the same two-way day: every component a scored category reads
      has its own value. In a hitter slot (UTIL) only the batting side is credited; in a
      pitcher slot (SP) only the pitching side. That is ESPN's rule (#10). Every credited
      component passes through unchanged, including the ratio categories' numerators and
      denominators: H/AB (AVG); ER and outs (ERA); hits allowed, walks and outs (WHIP);
      K and outs (K/9); saves plus holds (SVHD). Both are played: input status is about
      the whole day, not the credited part.
    model: int_fantasy__started_player_days
