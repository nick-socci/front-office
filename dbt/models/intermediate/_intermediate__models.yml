  - name: reported_margins_are_restated_for_a_period_of_usual_volume
    description: >
      Three regular-season periods. Hits average 40 a side in period 1 and 10 in periods
      2 and 3, so the usual period is 10 and period 1 has a relative volume of 4. Its
      count margin of 40 is restated as 20 (over the square root of 4) and its rate
      margin of 0.25 as 0.5 (times it). Category 5 averages 2, 0 and 0: its usual total
      is zero, so it is left out of the volume, and without that rule period 1 would
      have no defined volume or a division by zero. Catches: a long period counted at
      face value; a rate restated the way a count is; one category's empty weeks moving
      or breaking the relative volume.
