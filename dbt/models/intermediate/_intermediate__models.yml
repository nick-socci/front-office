# -----------------------------------------------------------------------------
# Unit tests: the league host's reported margins (spec 0057, R1 and R4.1).
# Category 1 is a count (hits), 2 a rate (hits over at-bats, whose reported total is
# stat 0), 62 a category with no rule.
# -----------------------------------------------------------------------------

  - name: reported_margins_are_one_row_per_decided_matchup_and_scored_category
    description: >
      Matchup 1 is decided and regular season: one row per scored category, the rate
      with both sides' reported at-bats, the category with no rule as a count. Matchup 2
      is in progress and matchup 3 is a bye: no rows. Matchup 4 is a playoff matchup: a
      row, not measured, with no relative volume. Stat 99 is reported and not scored: no
      row. Matchup 4 reports nothing for categories 2 and 62: no rows for them. With
      one regular-season period its relative volume is 1. Catches: a bye, an undecided
      or a playoff matchup measured; a non-scored stat measured; a denominator read
      from the wrong stat.
    model: int_fantasy__reported_matchup_margins
    given:
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 0, part: numerator, component: at_bats, weight: 1}
          - {platform: espn, stat_key: 2, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 2, part: denominator, component: at_bats, weight: 1}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
          - {platform: espn, league_id: "1", season: 2026, category_key: 2}
          - {platform: espn, league_id: "1", season: 2026, category_key: 62}
      - input: ref('stg_espn__matchups')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, matchup_period: 1, home_team_id: 1, away_team_id: 2, winner: HOME, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 2, matchup_period: 1, home_team_id: 3, away_team_id: 4, winner: UNDECIDED, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 3, matchup_period: 1, home_team_id: 5, away_team_id: null, winner: UNDECIDED, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 4, matchup_period: 2, home_team_id: 1, away_team_id: 3, winner: AWAY, playoff_tier: WINNERS_BRACKET}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 1, score: 7}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 2, score: 0.5}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 2, score: 0.25}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 0, score: 40}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 0, score: 36}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 62, score: 1}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 62, score: 0}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 99, score: 5}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 99, score: 3}
          - {league_id: "1", season: 2026, matchup_id: 2, side: home, stat_id: 1, score: 3}
          - {league_id: "1", season: 2026, matchup_id: 2, side: away, stat_id: 1, score: 2}
          - {league_id: "1", season: 2026, matchup_id: 3, side: home, stat_id: 1, score: 6}
          - {league_id: "1", season: 2026, matchup_id: 4, side: home, stat_id: 1, score: 4}
          - {league_id: "1", season: 2026, matchup_id: 4, side: away, stat_id: 1, score: 9}
    expect:
      rows:
        - {matchup_id: 1, category_key: 1, is_regular_season: true, margin: 3, is_rate: false, home_denominator: null, away_denominator: null, relative_volume: 1, standard_margin: 3, is_measured: true}
        - {matchup_id: 1, category_key: 2, is_regular_season: true, margin: 0.25, is_rate: true, home_denominator: 40, away_denominator: 36, relative_volume: 1, standard_margin: 0.25, is_measured: true}
        - {matchup_id: 1, category_key: 62, is_regular_season: true, margin: 1, is_rate: false, home_denominator: null, away_denominator: null, relative_volume: 1, standard_margin: 1, is_measured: true}
        - {matchup_id: 4, category_key: 1, is_regular_season: false, margin: -5, is_rate: false, home_denominator: null, away_denominator: null, relative_volume: null, standard_margin: null, is_measured: false}

  - name: reported_margins_are_restated_for_a_period_of_usual_volume
    description: >
      Three regular-season periods. Hits average 40 a side in period 1 and 10 in periods
      2 and 3, so the usual period is 10 and period 1 has a relative volume of 4. Its
      count margin of 40 is restated as 20 (over the square root of 4) and its rate
      margin of 0.25 as 0.5 (times it). Category 5 averages 2, 0 and 0: its usual total
      is zero, so it is left out of the volume, and without that rule period 1 would
      have no defined volume or a division by zero. Catches: a long period counted at
      face value; a rate restated the way a count is; one category's empty weeks moving
      or breaking the relative volume.
    model: int_fantasy__reported_matchup_margins
    given:
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 0, part: numerator, component: at_bats, weight: 1}
          - {platform: espn, stat_key: 2, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 2, part: denominator, component: at_bats, weight: 1}
          - {platform: espn, stat_key: 5, part: numerator, component: home_runs, weight: 1}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
          - {platform: espn, league_id: "1", season: 2026, category_key: 2}
