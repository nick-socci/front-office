        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, matchup_period: 1, home_team_id: 1, away_team_id: 2, winner: HOME, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 2, matchup_period: 2, home_team_id: 1, away_team_id: 2, winner: HOME, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 3, matchup_period: 3, home_team_id: 1, away_team_id: 2, winner: TIE, playoff_tier: NONE}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 1, score: 60}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 1, score: 20}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 2, score: 0.5}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 2, score: 0.25}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 0, score: 120}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 0, score: 80}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 5, score: 4}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 5, score: 0}
          - {league_id: "1", season: 2026, matchup_id: 2, side: home, stat_id: 1, score: 12}
          - {league_id: "1", season: 2026, matchup_id: 2, side: away, stat_id: 1, score: 8}
          - {league_id: "1", season: 2026, matchup_id: 2, side: home, stat_id: 5, score: 0}
          - {league_id: "1", season: 2026, matchup_id: 2, side: away, stat_id: 5, score: 0}
          - {league_id: "1", season: 2026, matchup_id: 3, side: home, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 3, side: away, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 3, side: home, stat_id: 5, score: 0}
          - {league_id: "1", season: 2026, matchup_id: 3, side: away, stat_id: 5, score: 0}
    expect:
      rows:
        - {matchup_id: 1, category_key: 1, margin: 40, relative_volume: 4, standard_margin: 20, is_measured: true}
        - {matchup_id: 1, category_key: 2, margin: 0.25, relative_volume: 4, standard_margin: 0.5, is_measured: true}
        - {matchup_id: 1, category_key: 5, margin: 4, relative_volume: 4, standard_margin: 2, is_measured: true}
        - {matchup_id: 2, category_key: 1, margin: 4, relative_volume: 1, standard_margin: 4, is_measured: true}
        - {matchup_id: 2, category_key: 5, margin: 0, relative_volume: 1, standard_margin: 0, is_measured: true}
        - {matchup_id: 3, category_key: 1, margin: 0, relative_volume: 1, standard_margin: 0, is_measured: true}
        - {matchup_id: 3, category_key: 5, margin: 0, relative_volume: 1, standard_margin: 0, is_measured: true}

  - name: reported_margins_do_not_measure_a_rate_without_a_usable_denominator
    description: >
      Matchup 1: the away side has zero at-bats, and the host reports its average as 0.
