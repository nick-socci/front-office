# -----------------------------------------------------------------------------
# Unit tests: int_fantasy__category_scales (spec 0055).
#
# Margins are chosen so the root mean square is exact in floating point: +1 and -7 give
# sqrt((1 + 49) / 2) = sqrt(25) = 5, where a deviation about the mean (-3) would give 4.
# -----------------------------------------------------------------------------

  - name: category_scales_are_a_root_mean_square_about_zero
    description: >
      Two matchups with home-minus-away margins +1 and -7. The scale is sqrt(25) = 5. A standard deviation about the mean (-3) would give 4, so this catches a deviation about the mean.
    model: int_fantasy__category_scales
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows: []
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 0}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 0, denominator: null, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 0, denominator: null, stat_value: 9}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, is_home: true, stat_key: 0, denominator: null, stat_value: 3}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, is_home: false, stat_key: 0, denominator: null, stat_value: 10}
    expect:
      rows:
        - {category_key: 0, matchups_measured: 2, margin_scale: 5, side_denominator: null}

  - name: category_scales_leave_out_a_league_season_with_no_rosters
    description: >
      Season 2025 scores a category and has no rosters, so no values of ours; season 2026
      has both. 2026 keeps its row and 2025 has none. Catches: a row with
      matchups_measured 0 and a null scale for a season that was never measured, which
      says its matchups were looked at and found unmeasurable (ADR 0026).
    model: int_fantasy__category_scales
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
          - {platform: espn, league_id: "1", season: 2025, has_rosters: false}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows: []
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 0}
          - {platform: espn, league_id: "1", season: 2025, category_key: 0}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 0, denominator: null, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 0, denominator: null, stat_value: 6}
    expect:
      rows:
        - {season: 2026, category_key: 0, matchups_measured: 1, margin_scale: 4, side_denominator: null}

  - name: category_scales_do_not_change_when_home_and_away_are_swapped
    description: >
      The same two matchups as the previous test with the home and away sides swapped (margins -1 and +7). The scale is still 5. Catches a result that depends on which side is home.
    model: int_fantasy__category_scales
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows: []
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 0}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 0, denominator: null, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 0, denominator: null, stat_value: 9}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, is_home: false, stat_key: 0, denominator: null, stat_value: 3}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, is_home: true, stat_key: 0, denominator: null, stat_value: 10}
    expect:
      rows:
        - {category_key: 0, matchups_measured: 2, margin_scale: 5, side_denominator: null}

  - name: category_scales_do_not_count_a_matchup_with_a_null_side
    description: >
      Matchup 2 has a null value on one side, so it contributes no margin and matchups_measured is 1; the scale is the one margin, 4. Catches a null read as zero, which would count two matchups and give sqrt((16 + 25) / 2).
    model: int_fantasy__category_scales
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows: []
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 0}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 0, denominator: null, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 0, denominator: null, stat_value: 6}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, is_home: true, stat_key: 0, denominator: null, stat_value: 5}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, is_home: false, stat_key: 0, denominator: null, stat_value: null}
    expect:
      rows:
        - {category_key: 0, matchups_measured: 1, margin_scale: 4, side_denominator: null}

  - name: category_scales_give_a_rate_a_side_denominator_and_a_count_none
    description: >
      A rate (stat 47, with denominators 150 and 210 on its two sides) has the mean, 180; a count (stat 0, null denominators) has a null side_denominator. Catches a count given a denominator.
    model: int_fantasy__category_scales
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows: []
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 0}
          - {platform: espn, league_id: "1", season: 2026, category_key: 47}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 0, denominator: null, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 0, denominator: null, stat_value: 8}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 47, denominator: 150, stat_value: 4}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 47, denominator: 210, stat_value: 3}
    expect:
      rows:
        - {category_key: 0, matchups_measured: 1, margin_scale: 2, side_denominator: null}
        - {category_key: 47, matchups_measured: 1, margin_scale: 1, side_denominator: 180}

  - name: category_scales_take_a_side_denominator_in_matchup_order
    description: >
      A rate (stat 47) with non-integer denominators on six sides, listed from matchup 3
      down to matchup 1: 295.48, 336.62, 128.16, 108.5, 350.73 and 229.83 in matchup order.
      No earlier season, so the plain average is the side denominator, expected to the
      last digit of the mean taken in matchup order, 241.5533333333333; taken in the order
      listed it is 241.55333333333337. Catches the order by removed from avg, or put on
      columns that do not order the rows (ADR 0046).
    model: int_fantasy__category_scales
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows: []
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 47}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 3, is_home: true, stat_key: 47, denominator: 229.83, stat_value: 7}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 3, is_home: false, stat_key: 47, denominator: 350.73, stat_value: 6}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, is_home: true, stat_key: 47, denominator: 108.5, stat_value: 6}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, is_home: false, stat_key: 47, denominator: 128.16, stat_value: 5}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 47, denominator: 336.62, stat_value: 5}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 47, denominator: 295.48, stat_value: 4}
    expect:
      rows:
        - {category_key: 47, side_denominator: 241.5533333333333}

  - name: category_scales_leave_a_zero_denominator_side_out
    description: >
      A rate with sides of 180 and 0 outs; the zero-out side has a null value. The mean denominator is 180, not 90, and the matchup contributes no margin. Catches an undefined rate halving the divisor and inflating every player's rate value.
    model: int_fantasy__category_scales
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows: []
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 47}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 47, denominator: 180, stat_value: 3}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 47, denominator: 0, stat_value: null}
    expect:
      rows:
        - {category_key: 47, matchups_measured: 0, margin_scale: null, side_denominator: 180}

  - name: category_scales_keep_a_scored_category_with_no_matchup_rows
    description: >
      A scored category (stat 5) with no matchup rows still has a row: matchups_measured 0 and a null scale. Catches a category vanishing from the facts through an inner join.
    model: int_fantasy__category_scales
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows: []
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 0}
          - {platform: espn, league_id: "1", season: 2026, category_key: 5}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 0, denominator: null, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 0, denominator: null, stat_value: 8}
    expect:
      rows:
        - {category_key: 0, matchups_measured: 1, margin_scale: 2, side_denominator: null}
        - {category_key: 5, matchups_measured: 0, margin_scale: null, side_denominator: null}

# -----------------------------------------------------------------------------
# Unit tests: the league host's reported margins (spec 0057, R1 and R4.1).
# Category 1 is a count (hits), 2 a rate (hits over at-bats, whose reported total is
# stat 0), 62 a category with no rule.
# -----------------------------------------------------------------------------

  - name: reported_margins_are_one_row_per_decided_matchup_and_scored_category
    description: >
      Matchup 1 is decided and regular season: one row per scored category, the rate
      with both sides' reported at-bats, the category with no rule as a count. Matchup 2
      is in progress and matchup 3 is a bye: no rows. Matchup 4 is a playoff matchup: a
      row, not measured, with no relative volume. Stat 99 is reported and not scored: no
      row. Matchup 4 reports nothing for categories 2 and 62: no rows for them. With
      one regular-season period its relative volume is 1. Catches: a bye, an undecided
      or a playoff matchup measured; a non-scored stat measured; a denominator read
      from the wrong stat.
    model: int_fantasy__reported_matchup_margins
    given:
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 0, part: numerator, component: at_bats, weight: 1}
          - {platform: espn, stat_key: 2, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 2, part: denominator, component: at_bats, weight: 1}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
          - {platform: espn, league_id: "1", season: 2026, category_key: 2}
          - {platform: espn, league_id: "1", season: 2026, category_key: 62}
      - input: ref('stg_espn__matchups')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, matchup_period: 1, home_team_id: 1, away_team_id: 2, winner: HOME, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 2, matchup_period: 1, home_team_id: 3, away_team_id: 4, winner: UNDECIDED, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 3, matchup_period: 1, home_team_id: 5, away_team_id: null, winner: UNDECIDED, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 4, matchup_period: 2, home_team_id: 1, away_team_id: 3, winner: AWAY, playoff_tier: WINNERS_BRACKET}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 1, score: 7}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 2, score: 0.5}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 2, score: 0.25}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 0, score: 40}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 0, score: 36}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 62, score: 1}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 62, score: 0}
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 99, score: 5}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 99, score: 3}
          - {league_id: "1", season: 2026, matchup_id: 2, side: home, stat_id: 1, score: 3}
          - {league_id: "1", season: 2026, matchup_id: 2, side: away, stat_id: 1, score: 2}
          - {league_id: "1", season: 2026, matchup_id: 3, side: home, stat_id: 1, score: 6}
