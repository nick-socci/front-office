  - name: lineup_category_totals_a_count_and_a_rate_under_both_lineups
    description: >
      One side, two days. Player 1 started at UTIL: day 1 1 hit in 1 at-bat and 1 home run,
      day 2 1 hit in 3 at-bats. The optimal lineup puts bench player 2 at UTIL: day 1 0 hits
      in 2 at-bats and 2 home runs, day 2 3 hits in 3 at-bats. The rate is recomputed from the
      period's summed components (actual 2 over 4, optimal 3 over 5), the count is the summed
      count. Catches a rate summed or averaged as a rate (1.333 or 0.667 for the actual
      average), a lineup read from the other's players, and an optimal total taken from the
      actual lineup.
    model: int_fantasy__lineup_category_totals
    given:
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
