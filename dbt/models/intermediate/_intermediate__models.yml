           outs_recorded: 0, hits_allowed: 0, pitcher_walks: 0, earned_runs: 0, pitcher_strikeouts: 0, wins: 0, losses: 0, saves: 0, holds: 0}
        - {platform_player_id: 2, input_status: played, played: true, slot_role: pitcher, games_batted: 0, games_pitched: 1,
           at_bats: 0, hits: 0, home_runs: 0, total_bases: 0, batter_walks: 0, runs: 0, runs_batted_in: 0, stolen_bases: 0, batter_strikeouts: 0,
           outs_recorded: 21, hits_allowed: 22, pitcher_walks: 23, earned_runs: 24, pitcher_strikeouts: 25, wins: 26, losses: 27, saves: 28, holds: 29}

  - name: started_player_days_status_verified_off_on_a_complete_date
    description: >
      Every game that date is loaded and he is in none of them: a real zero. A benched
      roster-day is not a started player-day and has no row at all.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: 910001, is_started: true, slot_role: hitter}
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 2, mlbam_player_id: 910002, is_started: false, slot_role: bench}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {mlbam_player_id: 910002, game_date: "2026-06-01", at_bats: 4}
      - input: ref('int_mlb__game_dates')
        rows:
          - {official_date: "2026-06-01", is_complete: true}
    expect:
      rows:
        - {platform_player_id: 1, input_status: verified_off, played: false, at_bats: 0, outs_recorded: 0}

  - name: started_player_days_status_verified_off_on_a_date_with_no_games
    description: >
      No MLB games that date (the All-Star break, say) means nothing could be missing.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-07-14", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: 910001, is_started: true, slot_role: hitter}
      - input: ref('int_mlb__player_game_days')
        rows: []
      - input: ref('int_mlb__game_dates')
        rows: []
    expect:
      rows:
        - {platform_player_id: 1, input_status: verified_off, played: false}

  - name: started_player_days_status_missing_boxscore_on_an_incomplete_date
    description: >
      A doubleheader with game 2's boxscore missing. A player with no stats might be in
      game 2. A player with game 1's stats might be too, so his totals may be partial:
      he is missing_boxscore as well, with played still true and his game 1 stats kept.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: 910001, is_started: true, slot_role: hitter}
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 2, mlbam_player_id: 910002, is_started: true, slot_role: hitter}
