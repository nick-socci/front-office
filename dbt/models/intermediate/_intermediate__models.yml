        rows:
          - {mlbam_player_id: 910002, game_date: "2026-06-01", at_bats: 4}
      - input: ref('int_mlb__game_dates')
        rows:
          - {official_date: "2026-06-01", is_complete: false}
    expect:
      rows:
        - {platform_player_id: 1, input_status: missing_boxscore, played: false, at_bats: 0}
        - {platform_player_id: 2, input_status: missing_boxscore, played: true, at_bats: 4}

  - name: started_player_days_status_unresolved_player_wins_over_missing_boxscore
    description: >
      With no MLBAM id his stats can't be looked up at all, on any date. That is the
      more basic failure, so it outranks an incomplete date.
    model: int_fantasy__started_player_days
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: null, is_started: true, slot_role: hitter}
          - {scoring_date: "2026-06-02", fantasy_team_id: 1, platform_player_id: 1, mlbam_player_id: null, is_started: true, slot_role: hitter}
      - input: ref('int_mlb__player_game_days')
        rows: []
      - input: ref('int_mlb__game_dates')
        rows:
          - {official_date: "2026-06-01", is_complete: false}
          - {official_date: "2026-06-02", is_complete: true}
    expect:
      rows:
        - {scoring_date: "2026-06-01", platform_player_id: 1, input_status: unresolved_player, played: false}
        - {scoring_date: "2026-06-02", platform_player_id: 1, input_status: unresolved_player, played: false}

# -----------------------------------------------------------------------------
# Unit tests: matchup aggregation (#10).
# -----------------------------------------------------------------------------

  - name: matchup_side_totals_leave_out_a_league_season_with_no_rosters
    description: >
      Season 2025 has a matchup and no rosters, as a past season loaded for its matchup
      totals has; season 2026 has both. Only 2026's sides get a row, team 2's of zeroes
      because it started nobody. Catches: a row of zeroes for a side of a season whose
      rosters were never loaded, which reads as a team that produced nothing (ADR 0026).
    model: int_fantasy__matchup_side_totals
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
          - {platform: espn, league_id: "1", season: 2025, has_rosters: false}
      - input: ref('int_fantasy__matchup_sides')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2, is_home: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1, is_home: false}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2, is_home: true}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1, is_home: false}
      - input: ref('int_fantasy__matchup_periods')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 1, scoring_date: "2026-06-01"}
          - {platform: espn, league_id: "1", season: 2025, matchup_period: 1, scoring_date: "2025-06-01"}
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", fantasy_team_id: 1, input_status: played, at_bats: 4, hits: 2, outs_recorded: 0}
    expect:
      rows:
        - {season: 2026, fantasy_team_id: 1, started_player_days: 1, at_bats: 4, hits: 2}
        - {season: 2026, fantasy_team_id: 2, started_player_days: 0, at_bats: 0, hits: 0}

  - name: matchup_side_totals_sum_only_the_matchup_days_for_the_team
    description: >
      Matchup period 1 covers two dates. Team 1's two started days in it are summed; its
      day in period 2 and the opponent's day are not. Team 2 started nobody in period 1
      and still gets a row, of zeroes. A missing-boxscore day counts as started but not
      verified.
    model: int_fantasy__matchup_side_totals
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__matchup_sides')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2, is_home: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1, is_home: false}
      - input: ref('int_fantasy__matchup_periods')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 1, scoring_date: "2026-06-01"}
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 1, scoring_date: "2026-06-02"}
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 2, scoring_date: "2026-06-03"}
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", fantasy_team_id: 1, input_status: played, at_bats: 4, hits: 2, outs_recorded: 0}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-02", fantasy_team_id: 1, input_status: missing_boxscore, at_bats: 3, hits: 1, outs_recorded: 6}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-03", fantasy_team_id: 1, input_status: played, at_bats: 5, hits: 5, outs_recorded: 9}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-03", fantasy_team_id: 2, input_status: played, at_bats: 4, hits: 1, outs_recorded: 3}
    expect:
      rows:
        - {fantasy_team_id: 1, started_player_days: 2, verified_player_days: 1, missing_boxscore_player_days: 1, unresolved_player_days: 0, at_bats: 7, hits: 3, outs_recorded: 6}
        - {fantasy_team_id: 2, started_player_days: 0, verified_player_days: 0, missing_boxscore_player_days: 0, unresolved_player_days: 0, at_bats: 0, hits: 0, outs_recorded: 0}

  - name: matchup_stat_values_follow_the_component_rules
    description: >
      One side's totals through four kinds of rule: a count (HR), a sum (SVHD = saves +
      holds), a scaled rate (ERA = 27 * ER / outs) and a rate with two weighted
      numerator terms (WHIP = (3 * H + 3 * BB) / outs). The second side has no outs, so
      its ERA is null, not zero.
    model: int_fantasy__matchup_stat_values
    given:
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2, is_home: true,
             home_runs: 4, saves: 2, holds: 3, earned_runs: 10, outs_recorded: 54, hits_allowed: 15, pitcher_walks: 6}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1, is_home: false,
             home_runs: 0, saves: 0, holds: 0, earned_runs: 0, outs_recorded: 0, hits_allowed: 0, pitcher_walks: 0}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 5, part: numerator, component: home_runs, weight: 1}
          - {platform: espn, stat_key: 83, part: numerator, component: saves, weight: 1}
          - {platform: espn, stat_key: 83, part: numerator, component: holds, weight: 1}
          - {platform: espn, stat_key: 47, part: numerator, component: earned_runs, weight: 27}
          - {platform: espn, stat_key: 47, part: denominator, component: outs_recorded, weight: 1}
          - {platform: espn, stat_key: 41, part: numerator, component: hits_allowed, weight: 3}
          - {platform: espn, stat_key: 41, part: numerator, component: pitcher_walks, weight: 3}
          - {platform: espn, stat_key: 41, part: denominator, component: outs_recorded, weight: 1}
    expect:
      rows:
        - {fantasy_team_id: 1, stat_key: 5, numerator: 4, denominator: null, stat_value: 4}
        - {fantasy_team_id: 1, stat_key: 83, numerator: 5, denominator: null, stat_value: 5}
        - {fantasy_team_id: 1, stat_key: 47, numerator: 270, denominator: 54, stat_value: 5}
        - {fantasy_team_id: 1, stat_key: 41, numerator: 63, denominator: 54, stat_value: 1.1666666666666667}
        - {fantasy_team_id: 2, stat_key: 5, numerator: 0, denominator: null, stat_value: 0}
        - {fantasy_team_id: 2, stat_key: 83, numerator: 0, denominator: null, stat_value: 0}
        - {fantasy_team_id: 2, stat_key: 47, numerator: 0, denominator: 0, stat_value: null}
        - {fantasy_team_id: 2, stat_key: 41, numerator: 0, denominator: 0, stat_value: null}

# -----------------------------------------------------------------------------
# Unit tests: int_fantasy__replacement_levels (#11).
#
# Each overrides fo_batting_columns and fo_pitching_columns to short lists, so `expect`
# can list every row of the model rather than 48. The model builds its rows from those
# two macros, so the rules under test are the same.
# -----------------------------------------------------------------------------

  - name: replacement_levels_pool_ties_break_on_the_lower_mlbam_id
    description: >
      Two free-agent hitters with equal plate appearances and one fantasy team (N = 1):
      the pool is the lower mlbam id, whichever order the rows arrive in. A rostered
      hitter with more plate appearances is not eligible. The key is day_kind batting
      (was hitter); no value changed, and no pitching pool exists.
    model: int_fantasy__replacement_levels
    overrides:
      macros:
        fo_batting_columns: [games_batted, plate_appearances, hits]
        fo_pitching_columns: [games_pitched, games_started, outs_recorded, batters_faced]
    given:
      - input: ref('int_fantasy__teams')
        rows:
          - {platform: espn, league_id: "1", season: 2026, fantasy_team_id: 1}
      - input: ref('int_fantasy__roster_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", mlbam_player_id: 900003}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {season: 2026, mlbam_player_id: 900002, game_date: "2026-06-01", games_batted: 1, plate_appearances: 4, hits: 2}
          - {season: 2026, mlbam_player_id: 900001, game_date: "2026-06-01", games_batted: 1, plate_appearances: 4, hits: 1}
          - {season: 2026, mlbam_player_id: 900003, game_date: "2026-06-01", games_batted: 1, plate_appearances: 5, hits: 5}
    expect:
      rows:
        - {day_kind: batting, component: games_batted, pool_players: 1, pool_played_days: 1, pool_total: 1, level_per_played_day: 1}
        - {day_kind: batting, component: plate_appearances, pool_players: 1, pool_played_days: 1, pool_total: 4, level_per_played_day: 4}
        - {day_kind: batting, component: hits, pool_players: 1, pool_played_days: 1, pool_total: 1, level_per_played_day: 1}
        - {day_kind: start, component: games_pitched, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: start, component: games_started, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: start, component: outs_recorded, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: start, component: batters_faced, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: relief, component: games_pitched, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: relief, component: games_started, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: relief, component: outs_recorded, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: relief, component: batters_faced, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}

  - name: replacement_levels_a_played_day_is_one_sided
    description: >
      A free-agent hitter has one day batting and one day only pitching a mop-up inning (3 outs
      against 1 batter faced, so with 4 plate appearances he is still a hitter). The batting
      pool is unchanged: the pitching-only day is not a played day for batting, so
      pool_played_days is 1, not 2, and the level is per batting day. What changed with the
      pitching rule: the mop-up day is a relief outing, so he is also the relief pool's one
      member, with that one day and no batting component in it. Before, a hitter was never
      in a pitching pool.
    model: int_fantasy__replacement_levels
    overrides:
      macros:
        fo_batting_columns: [games_batted, plate_appearances, hits]
        fo_pitching_columns: [games_pitched, games_started, outs_recorded, batters_faced]
    given:
      - input: ref('int_fantasy__teams')
        rows:
          - {platform: espn, league_id: "1", season: 2026, fantasy_team_id: 1}
      - input: ref('int_fantasy__roster_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", mlbam_player_id: 900009}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-02", mlbam_player_id: 900009}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {season: 2026, mlbam_player_id: 900001, game_date: "2026-06-01", games_batted: 1, plate_appearances: 4, hits: 2}
          - {season: 2026, mlbam_player_id: 900001, game_date: "2026-06-02", games_batted: 0, games_pitched: 1, outs_recorded: 3, batters_faced: 1}
    expect:
      rows:
        - {day_kind: batting, component: games_batted, pool_players: 1, pool_played_days: 1, pool_total: 1, level_per_played_day: 1}
        - {day_kind: batting, component: plate_appearances, pool_players: 1, pool_played_days: 1, pool_total: 4, level_per_played_day: 4}
        - {day_kind: batting, component: hits, pool_players: 1, pool_played_days: 1, pool_total: 2, level_per_played_day: 2}
        - {day_kind: start, component: games_pitched, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: start, component: games_started, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: start, component: outs_recorded, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: start, component: batters_faced, pool_players: 0, pool_played_days: 0, pool_total: null, level_per_played_day: null}
        - {day_kind: relief, component: games_pitched, pool_players: 1, pool_played_days: 1, pool_total: 1, level_per_played_day: 1}
        - {day_kind: relief, component: games_started, pool_players: 1, pool_played_days: 1, pool_total: 0, level_per_played_day: 0}
        - {day_kind: relief, component: outs_recorded, pool_players: 1, pool_played_days: 1, pool_total: 3, level_per_played_day: 3}
        - {day_kind: relief, component: batters_faced, pool_players: 1, pool_played_days: 1, pool_total: 1, level_per_played_day: 1}

  - name: replacement_levels_an_empty_pool_still_has_rows_with_a_null_level
    description: >
      Free-agent days for a hitter and for a pitcher starting after one relief outing, and
      no free-agent reliever (the outing is on 05-31, before any scoring date, so it is
      history and not a free-agent day). The relief pool still gets a row per pitching
      component, with pool_players 0, pool_played_days 0 and a null level: an inner join
      would drop the kind, and a coalesce to 0 would say replacement relievers produce
      nothing. So does the start pool: a start by a pitcher who had relieved is not a
      starter's yet (ADR 0029, 0031), so the pool is empty. It is a relief outing and not a
      debut that makes it empty: since #92 a first start of the season is in the pool.
    model: int_fantasy__replacement_levels
    overrides:
      macros:
        fo_batting_columns: [games_batted, plate_appearances, hits]
        fo_pitching_columns: [games_pitched, games_started, outs_recorded, batters_faced]
    given:
      - input: ref('int_fantasy__teams')
        rows:
          - {platform: espn, league_id: "1", season: 2026, fantasy_team_id: 1}
      - input: ref('int_fantasy__roster_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", mlbam_player_id: 900009}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {season: 2026, mlbam_player_id: 900001, game_date: "2026-06-01", games_batted: 1, plate_appearances: 4, hits: 2}
          - {season: 2026, mlbam_player_id: 900002, game_date: "2026-05-31", games_pitched: 1, outs_recorded: 3, batters_faced: 4}
          - {season: 2026, mlbam_player_id: 900002, game_date: "2026-06-01", games_pitched: 1, games_started: 1, outs_recorded: 18, batters_faced: 24}
    expect:
      rows:
        - {day_kind: batting, component: games_batted, pool_players: 1, pool_played_days: 1, pool_total: 1, level_per_played_day: 1}
        - {day_kind: batting, component: plate_appearances, pool_players: 1, pool_played_days: 1, pool_total: 4, level_per_played_day: 4}
