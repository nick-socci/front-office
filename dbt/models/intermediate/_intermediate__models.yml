      relative volume of 0: its row is kept, with no standard margin, and is not
      measured (spec 0057, amendment of 2026-10-08). Catches: a division by zero, or an
      empty week measured as a matchup.
    model: int_fantasy__reported_matchup_margins
    given:
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 0, part: numerator, component: at_bats, weight: 1}
          - {platform: espn, stat_key: 2, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 2, part: denominator, component: at_bats, weight: 1}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
      - input: ref('stg_espn__matchups')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, matchup_period: 1, home_team_id: 1, away_team_id: 2, winner: TIE, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 2, matchup_period: 2, home_team_id: 1, away_team_id: 2, winner: HOME, playoff_tier: NONE}
          - {league_id: "1", season: 2026, matchup_id: 3, matchup_period: 3, home_team_id: 1, away_team_id: 2, winner: TIE, playoff_tier: NONE}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, side: home, stat_id: 1, score: 0}
          - {league_id: "1", season: 2026, matchup_id: 1, side: away, stat_id: 1, score: 0}
          - {league_id: "1", season: 2026, matchup_id: 2, side: home, stat_id: 1, score: 12}
          - {league_id: "1", season: 2026, matchup_id: 2, side: away, stat_id: 1, score: 8}
          - {league_id: "1", season: 2026, matchup_id: 3, side: home, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 3, side: away, stat_id: 1, score: 10}
    expect:
      rows:
        - {matchup_id: 1, category_key: 1, margin: 0, relative_volume: 0, standard_margin: null, is_measured: false}
        - {matchup_id: 2, category_key: 1, margin: 4, relative_volume: 1, standard_margin: 4, is_measured: true}
        - {matchup_id: 3, category_key: 1, margin: 0, relative_volume: 1, standard_margin: 0, is_measured: true}

# -----------------------------------------------------------------------------
# Unit tests: reported scales per league-season (spec 0057, R2 and R4.2).
# -----------------------------------------------------------------------------

  - name: reported_scales_keep_a_league_season_with_nothing_measured
    description: >
      Season 2026 has two measured margins of a count, 7 and -1, a root mean square of
      sqrt((49 + 1) / 2) = 5; season 2020 scores the same category and has no matchup. 2020 is a row with zero measured and no scale.
      Catches: an unplayed season vanishing from the report.
    model: int_fantasy__reported_category_scales
    given:
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
          - {platform: espn, league_id: "1", season: 2020, category_key: 1}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, category_key: 1, standard_margin: 7, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, category_key: 1, standard_margin: -1, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
    expect:
      rows:
        - {season: 2026, category_key: 1, matchups_measured: 2, margin_scale: 5, side_denominator: null}
        - {season: 2020, category_key: 1, matchups_measured: 0, margin_scale: null, side_denominator: null}

  - name: reported_scales_measure_a_rate_and_its_denominator_from_the_same_matchups
    description: >
      Three matchups of a rate. Matchup 3 is not measured (no usable denominator) and
      has a large margin; matchup 4 is a playoff matchup, not measured. The scale is
      from matchups 1 and 2 only: standard margins 4 and -4 give 4. The side denominator
      is from the same two: matchup 1 has 100 and 60 in a period of relative volume 2
      (50 and 30 in a usual period), matchup 2 has 40 and 40, so (50 + 30 + 40 + 40) / 4
      = 40. Catches: a scale measured from matchups its denominator cannot be; a long
      period's denominator taken at face value.
    model: int_fantasy__reported_category_scales
    given:
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 2}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, category_key: 2, standard_margin: 4, home_denominator: 100, away_denominator: 60, relative_volume: 2, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, category_key: 2, standard_margin: -4, home_denominator: 40, away_denominator: 40, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 3, category_key: 2, standard_margin: 50, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 4, category_key: 2, standard_margin: null, home_denominator: 40, away_denominator: 40, relative_volume: null, is_measured: false}
    expect:
      rows:
        - {category_key: 2, matchups_measured: 2, margin_scale: 4, side_denominator: 40}

  - name: reported_scales_do_not_change_when_home_and_away_are_swapped
    description: >
      The first test's margins with their signs reversed, as if every home side had been
      the away side. The scale is still 5. Catches: a spread about the mean in place of
      a root mean square about zero.
    model: int_fantasy__reported_category_scales
    given:
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, category_key: 1, standard_margin: -7, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, category_key: 1, standard_margin: 1, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
    expect:
      rows:
        - {category_key: 1, matchups_measured: 2, margin_scale: 5, side_denominator: null}

# -----------------------------------------------------------------------------
# Unit tests: the scale in use (spec 0057, R3 and R4.3). fantasy_scale_prior_matchups is
# lowered to 2 for each test with `overrides: vars`, which sets a variable for one unit
# test only; the build keeps 100.
# -----------------------------------------------------------------------------

  - name: category_scales_blend_earlier_seasons_with_the_seasons_decided_matchups
    description: >
      2025 has two measured margins, 4 and -4: the history's scale p is 4, and with a
      threshold of 2 it is used, counted as 2 matchups. 2026 has two measured margins of
      its own, 8 and 2 (sum of squares 68). The blend is sqrt((68 + 2 * 16) / (2 + 2)) =
      5. Not used: 2026's own playoff margin of 500 and 2025's unmeasured 300; a 2027
      margin of 1000; league 2's 2025 margin of 1000; and our own recomputed totals for
      2026, whose margin is 100. Catches: a later season or another league in the blend;
      an unmeasured row in it; history weighted by its size and not by the variable; our
      totals used where the host's are.
    model: int_fantasy__category_scales
    overrides:
      vars:
        fantasy_scale_prior_matchups: 2
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 1, category_key: 1, standard_margin: 4, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 2, category_key: 1, standard_margin: -4, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 3, category_key: 1, standard_margin: 300, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, category_key: 1, standard_margin: 8, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, category_key: 1, standard_margin: 2, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 3, category_key: 1, standard_margin: 500, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
          - {platform: espn, league_id: "1", season: 2027, matchup_id: 1, category_key: 1, standard_margin: 1000, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "2", season: 2025, matchup_id: 1, category_key: 1, standard_margin: 1000, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 1, denominator: null, stat_value: 100}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 1, denominator: null, stat_value: 0}
    expect:
      rows:
        - {category_key: 1, matchups_measured: 2, margin_scale: 5, side_denominator: null, scale_source: prior_and_current_seasons, prior_matchups_measured: 2, prior_seasons_measured: 1, prior_margin_scale: 4}

  - name: category_scales_fall_back_one_matchup_below_the_threshold
    description: >
      The same league with one measured 2025 margin and a threshold of 2: history is not
      used. The scale is the season's own, from our totals (10 against 6: 4), and the
      row still says how much history there was. Catches: the threshold off by one, and
      a thin history blended in.
    model: int_fantasy__category_scales
    overrides:
      vars:
        fantasy_scale_prior_matchups: 2
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 1, category_key: 1, standard_margin: 40, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, category_key: 1, standard_margin: 8, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 1, denominator: null, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 1, denominator: null, stat_value: 6}
    expect:
      rows:
        - {category_key: 1, matchups_measured: 1, margin_scale: 4, side_denominator: null, scale_source: current_season, prior_matchups_measured: 1, prior_seasons_measured: 1, prior_margin_scale: null}

  - name: category_scales_pool_earlier_seasons_over_matchups_and_stand_alone_before_any_is_decided
    description: >
      2024 has one measured margin of 11 and 2025 three of 5. Pooled over matchups the
      history's scale is sqrt((121 + 75) / 4) = 7; the mean of the two seasons' scales
      would be 8. 2026 has no decided matchup, so its scale is exactly the history's.
      Catches: an average of season scales in place of a pooled one, and a season with
      nothing decided left without a scale.
    model: int_fantasy__category_scales
    overrides:
      vars:
        fantasy_scale_prior_matchups: 2
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2024, matchup_id: 1, category_key: 1, standard_margin: 11, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 1, category_key: 1, standard_margin: 5, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 2, category_key: 1, standard_margin: -5, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 3, category_key: 1, standard_margin: 5, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: true}
      - input: ref('int_fantasy__matchup_stat_values')
        rows: []
    expect:
      rows:
        - {category_key: 1, matchups_measured: 0, margin_scale: 7, side_denominator: null, scale_source: prior_and_current_seasons, prior_matchups_measured: 4, prior_seasons_measured: 2, prior_margin_scale: 7}

  - name: category_scales_blend_a_rates_denominator_with_its_scale
    description: >
      A rate. 2025: standard margins 4 and -4 (p = 4), with sides of 100 and 60 in a
      period of relative volume 2 (50 and 30 in a usual one) and of 40 and 40: a mean
      side denominator q of 40. 2026: standard margins 8 and 2, with sides of 30 and 30,
      and of 60 and 60 at relative volume 2 (30 and 30): D = 120. The scale is 5 as in
      the first test, and the denominator (120 + 2 * 2 * 40) / (2 * 2 + 2 * 2) = 35.
      Our own totals for 2026, a denominator of 1000, are not used. Catches: a blended
      scale paired with the season's own denominator, or the reverse; a long period's
      denominator taken at face value; sides weighted differently from matchups.
    model: int_fantasy__category_scales
    overrides:
      vars:
        fantasy_scale_prior_matchups: 2
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 2}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 1, category_key: 2, standard_margin: 4, home_denominator: 100, away_denominator: 60, relative_volume: 2, is_measured: true}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 2, category_key: 2, standard_margin: -4, home_denominator: 40, away_denominator: 40, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, category_key: 2, standard_margin: 8, home_denominator: 30, away_denominator: 30, relative_volume: 1, is_measured: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 2, category_key: 2, standard_margin: 2, home_denominator: 60, away_denominator: 60, relative_volume: 2, is_measured: true}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 2, denominator: 1000, stat_value: 100}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 2, denominator: 1000, stat_value: 0}
    expect:
      rows:
        - {category_key: 2, matchups_measured: 2, margin_scale: 5, side_denominator: 35, scale_source: prior_and_current_seasons, prior_matchups_measured: 2, prior_seasons_measured: 1, prior_margin_scale: 4}

  - name: category_scales_fall_back_whole_for_a_rate_whose_denominator_was_never_reported
    description: >
      A rate whose earlier seasons report margins and no denominators, so none of their
      rows is measured. However many there are, the category takes the season's own
      scale and denominator together, from our totals: 10 against 6 on sides of 100 and
      60 gives a scale of 4 and a denominator of 80. Catches: a blended scale with
      nothing to convert it by, or with the season's own denominator.
    model: int_fantasy__category_scales
    overrides:
      vars:
        fantasy_scale_prior_matchups: 2
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 2}
      - input: ref('int_fantasy__reported_matchup_margins')
        rows:
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 1, category_key: 2, standard_margin: 4, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 2, category_key: 2, standard_margin: -4, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 3, category_key: 2, standard_margin: 4, home_denominator: null, away_denominator: null, relative_volume: 1, is_measured: false}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: true, stat_key: 2, denominator: 100, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, is_home: false, stat_key: 2, denominator: 60, stat_value: 6}
    expect:
      rows:
        - {category_key: 2, matchups_measured: 1, margin_scale: 4, side_denominator: 80, scale_source: current_season, prior_matchups_measured: 0, prior_seasons_measured: 0, prior_margin_scale: null}
