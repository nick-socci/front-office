version: 2

models:
  - name: rec_espn__matchup_stat_differences
    description: >
      Our recomputed value against ESPN's scoreByStat for every (matchup side, stat) on
      either end, with a status saying whether a difference is accounted for. The
      reconciliation itself (#10); fct_matchup_scores_match_espn fails on any status
      that isn't. See the model header for the status rules.
    columns:
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bye, missing_ours, missing_espn, unverified, formula_mismatch,
                         match, registered, explained_by_component, unexplained]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_id, fantasy_team_id, stat_key]

  - name: rec_espn__category_result_differences
    description: >
      Our category result against ESPN's for every (matchup side, scored category). A
      difference is 'explained' only when the category's values differ by residuals
      already accounted for on either side.
    columns:
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [missing_ours, missing_espn, match, unverified, explained, unexplained]

  - name: rec_espn__player_day_differences
    description: >
      Started player-days where our credited number for a stat differs from ESPN's own
      per-game lines summed for the day. The evidence behind each registered
      official_scoring_change residual. A row is kept only where the two numbers differ,
      and says what its inputs were. status is difference when the player-day is played
      or verified_off (every game that date is loaded), which includes a verified_off day
      for which ESPN has a line; it is unverified when the boxscore is not loaded or the
      player is not resolved, and such a row is kept so the comparison is visible and is
      evidence of nothing. Filter on status = 'difference'. An unverified day whose
      numbers agree has no row, so an empty table does not prove agreement. See ADR 0032.
    columns:
      - name: input_status
        description: input_status of the started player-day, from int_fantasy__started_player_days.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [played, verified_off, missing_boxscore, unresolved_player]
      - name: status
        description: difference when input_status is played or verified_off, else unverified.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [difference, unverified]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period, fantasy_team_id, platform_player_id, stat_id]

  - name: rec_espn__player_day_residuals
    description: >
      One row per league-season, matchup, side and stat that has at least one player-day
      row with status difference: the sum of those rows' differences, how many there are,
      the difference the espn_reconciliation_residuals register expects for that matchup,
      side and stat (null if none), and a problem column that is null when the key is
      accounted for. unverified rows are not counted. A view, so that the singular test
      rec_espn__player_day_differences_are_registered judges the table as it is now. The
      register names a matchup and no season, so problem is ambiguous_register on every
      key while difference rows exist in more than one league-season (#99 removes this).
      See the model header.
    columns:
      - name: difference_sum
        data_tests: [not_null]
      - name: difference_rows
        data_tests: [not_null]
      - name: problem
        description: >
          ambiguous_register, unregistered, wrong_size, or null when the key is accounted
          for, checked in that order.
        data_tests:
          # Null is allowed: accepted_values passes a null, which is a key that is
          # accounted for.
          - accepted_values:
              arguments:
                values: [ambiguous_register, unregistered, wrong_size]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_id, fantasy_team_id, stat_id]

unit_tests:
  - name: player_day_differences_label_their_inputs
    description: >
      Eight started player-days of team 1, one case each, on one date in matchup 7. H is
      hits (stat 1) and ER is earned_runs (stat 45); a hitter slot credits hits and a
      pitcher slot earned runs. Player 101 is played and equal to ESPN: no row. 102 is
      played and differs (3 against 2): a difference. 103 is played with no ESPN line,
      compared against zero: a difference. 104 is verified_off and ESPN has a hit for
      him: a difference of minus one, because we say he did not play and every game is
      loaded. 105 is verified_off and ESPN has no line: no row. 106 is missing_boxscore
      and 107 unresolved_player, each with an ESPN line: rows kept, both numbers, but
      unverified. 106 has one credited hit against ESPN's two, to show a non-zero
      credited number is kept on an unverified day; 107 has none to credit, as an
      unresolved player has no MLB stats. 108 is a pitcher slot with 5 hits that are not his to score and earned
      runs equal to ESPN's: no row. Catches a status decided from the wrong column; a
      verified_off line dropped; an unverified row labelled a difference; a table that
      keeps rows where the numbers agree; a batting line compared for a pitcher slot; a credited number zeroed on an
      unverified day.
    model: rec_espn__player_day_differences
    overrides:
      macros:
        fo_batting_columns: [hits]
        fo_pitching_columns: [earned_runs]
    given:
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 45, part: numerator, component: earned_runs, weight: 1}
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", scoring_period: 1, fantasy_team_id: 1, platform_player_id: 101, slot_role: hitter, input_status: played, hits: 2}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", scoring_period: 1, fantasy_team_id: 1, platform_player_id: 102, slot_role: hitter, input_status: played, hits: 3}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", scoring_period: 1, fantasy_team_id: 1, platform_player_id: 103, slot_role: hitter, input_status: played, hits: 1}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", scoring_period: 1, fantasy_team_id: 1, platform_player_id: 104, slot_role: hitter, input_status: verified_off, hits: 0}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", scoring_period: 1, fantasy_team_id: 1, platform_player_id: 105, slot_role: hitter, input_status: verified_off, hits: 0}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", scoring_period: 1, fantasy_team_id: 1, platform_player_id: 106, slot_role: hitter, input_status: missing_boxscore, hits: 1}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", scoring_period: 1, fantasy_team_id: 1, platform_player_id: 107, slot_role: hitter, input_status: unresolved_player, hits: 0}
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", scoring_period: 1, fantasy_team_id: 1, platform_player_id: 108, slot_role: pitcher, input_status: played, hits: 5, earned_runs: 2}
      - input: ref('stg_espn__player_game_stats')
        rows:
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 101, espn_game_id: 9001, stat_id: 1, stat_value: 2}
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 102, espn_game_id: 9001, stat_id: 1, stat_value: 2}
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 104, espn_game_id: 9001, stat_id: 1, stat_value: 1}
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 106, espn_game_id: 9001, stat_id: 1, stat_value: 2}
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 107, espn_game_id: 9001, stat_id: 1, stat_value: 1}
          - {league_id: "1", season: 2026, scoring_period: 1, espn_player_id: 108, espn_game_id: 9001, stat_id: 45, stat_value: 2}
      - input: ref('int_fantasy__matchup_periods')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 1, scoring_period: 1, scoring_date: "2026-06-01"}
      - input: ref('int_fantasy__matchup_sides')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1}
    expect:
      rows:
        - {matchup_id: 7, platform_player_id: 102, stat_id: 1, our_value: 3, espn_value: 2, difference: 1, input_status: played, status: difference}
        - {matchup_id: 7, platform_player_id: 103, stat_id: 1, our_value: 1, espn_value: 0, difference: 1, input_status: played, status: difference}
        - {matchup_id: 7, platform_player_id: 104, stat_id: 1, our_value: 0, espn_value: 1, difference: -1, input_status: verified_off, status: difference}
        - {matchup_id: 7, platform_player_id: 106, stat_id: 1, our_value: 1, espn_value: 2, difference: -1, input_status: missing_boxscore, status: unverified}
        - {matchup_id: 7, platform_player_id: 107, stat_id: 1, our_value: 0, espn_value: 1, difference: -1, input_status: unresolved_player, status: unverified}

  - name: matchup_stat_differences_assign_every_status
    description: >
      One case per status. Rules: H = hits, AB = at_bats, AVG = H / AB.
      Matchup 7 (played, verified): team 1 matches on H and AVG, but carries a register
      row for AB, which matches -- a stale register row, so 'unexplained'. Team 2 is
      off by a registered +1 H, which explains its AVG; its HR exists only at ESPN.
      Matchup 10: team 5's H is off with no register row, and ESPN's AVG can't be
      rebuilt from ESPN's own H and AB. Matchup 8 rests on a missing boxscore. Matchup 9
      is a bye, present at ESPN only. Matchup 7 team 1's SB exists only on our side.
      Matchup 11 (PR #46 review): team 6 carries the same registered +1 H as matchup 7
      team 2, so the register implies AVG = 11 / 40 = 0.275; ours is 0.9, so the rate is
      unexplained even though a component is registered.
    model: rec_espn__matchup_stat_differences
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
          # A past season loaded for its matchup totals alone: ESPN's rows for it are not compared.
          - {platform: espn, league_id: "1", season: 2025, has_rosters: false}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 0, part: numerator, component: at_bats, weight: 1}
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 2, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 2, part: denominator, component: at_bats, weight: 1}
          - {platform: espn, stat_key: 23, part: numerator, component: stolen_bases, weight: 1}
      - input: ref('stg_espn__matchups')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7}
          - {league_id: "1", season: 2026, matchup_id: 8}
          - {league_id: "1", season: 2026, matchup_id: 10}
          - {league_id: "1", season: 2026, matchup_id: 11}
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, started_player_days: 10, verified_player_days: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, started_player_days: 10, verified_player_days: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 8, fantasy_team_id: 3, started_player_days: 10, verified_player_days: 9}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 10, fantasy_team_id: 5, started_player_days: 10, verified_player_days: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 11, fantasy_team_id: 6, started_player_days: 10, verified_player_days: 10}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, stat_key: 0, stat_value: 40}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, stat_key: 1, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, stat_key: 2, stat_value: 0.25}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, stat_key: 23, stat_value: 2}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 0, stat_value: 40}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 1, stat_value: 11}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, stat_value: 0.275}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 8, fantasy_team_id: 3, stat_key: 1, stat_value: 1}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 10, fantasy_team_id: 5, stat_key: 0, stat_value: 20}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 10, fantasy_team_id: 5, stat_key: 1, stat_value: 5}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 10, fantasy_team_id: 5, stat_key: 2, stat_value: 0.25}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 11, fantasy_team_id: 6, stat_key: 0, stat_value: 40}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 11, fantasy_team_id: 6, stat_key: 1, stat_value: 11}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 11, fantasy_team_id: 6, stat_key: 2, stat_value: 0.9}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          # Season 2025 has no rosters: ESPN's total is there and is no missing_ours row (ADR 0026).
          - {league_id: "1", season: 2025, matchup_id: 7, team_id: 1, stat_id: 0, score: 40}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 0, score: 40}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 2, score: 0.25}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 0, score: 40}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 2, score: 0.25}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 5, score: 3}
          - {league_id: "1", season: 2026, matchup_id: 8, team_id: 3, stat_id: 1, score: 9}
          - {league_id: "1", season: 2026, matchup_id: 9, team_id: 4, stat_id: 1, score: 3}
          - {league_id: "1", season: 2026, matchup_id: 10, team_id: 5, stat_id: 0, score: 20}
          - {league_id: "1", season: 2026, matchup_id: 10, team_id: 5, stat_id: 1, score: 6}
          - {league_id: "1", season: 2026, matchup_id: 10, team_id: 5, stat_id: 2, score: 0.5}
          - {league_id: "1", season: 2026, matchup_id: 11, team_id: 6, stat_id: 0, score: 40}
          - {league_id: "1", season: 2026, matchup_id: 11, team_id: 6, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 11, team_id: 6, stat_id: 2, score: 0.25}
      - input: ref('espn_reconciliation_residuals')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 1, expected_difference: 1, cause: official_scoring_change, evidence: x}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 0, expected_difference: 1, cause: official_scoring_change, evidence: stale}
          - {league_id: "1", season: 2026, matchup_id: 11, team_id: 6, stat_id: 1, expected_difference: 1, cause: official_scoring_change, evidence: x}
    expect:
      rows:
        - {matchup_id: 7, fantasy_team_id: 1, stat_key: 0, status: unexplained}
        - {matchup_id: 7, fantasy_team_id: 1, stat_key: 1, status: match}
        - {matchup_id: 7, fantasy_team_id: 1, stat_key: 2, status: match}
        - {matchup_id: 7, fantasy_team_id: 1, stat_key: 23, status: missing_espn}
        - {matchup_id: 7, fantasy_team_id: 2, stat_key: 0, status: match}
        - {matchup_id: 7, fantasy_team_id: 2, stat_key: 1, status: registered}
        - {matchup_id: 7, fantasy_team_id: 2, stat_key: 2, status: explained_by_component}
        - {matchup_id: 7, fantasy_team_id: 2, stat_key: 5, status: missing_ours}
        - {matchup_id: 8, fantasy_team_id: 3, stat_key: 1, status: unverified}
        - {matchup_id: 9, fantasy_team_id: 4, stat_key: 1, status: bye}
        - {matchup_id: 10, fantasy_team_id: 5, stat_key: 0, status: match}
        - {matchup_id: 10, fantasy_team_id: 5, stat_key: 1, status: unexplained}
        - {matchup_id: 10, fantasy_team_id: 5, stat_key: 2, status: formula_mismatch}
        - {matchup_id: 11, fantasy_team_id: 6, stat_key: 0, status: match}
        - {matchup_id: 11, fantasy_team_id: 6, stat_key: 1, status: registered}
        - {matchup_id: 11, fantasy_team_id: 6, stat_key: 2, status: unexplained}

  - name: matchup_stat_differences_keep_each_league_seasons_register_apart
    description: >
      Three league-seasons -- 1 / 2026, 1 / 2027 and 2 / 2026 -- share matchup 7, team 2.
      Rules: H = hits, AB = at_bats, AVG = H / AB. ESPN scores AB 40, H 10, AVG 0.25 in
      all three. Ours is H 11 in 1 / 2026 and 1 / 2027 and H 12 in 2 / 2026. The register
      has +1 H for 1 / 2026 and +2 H for 2 / 2026, and nothing for 1 / 2027. So 1 / 2026
      is registered, and the register implies AVG = 11 / 40 = 0.275, which is ours:
      explained_by_component. 2 / 2026 is registered the same way, and the register
      implies AVG = 12 / 40 = 0.3, which is ours. In 1 / 2027 nothing is registered, so
      the implied AVG is ESPN's 0.25 and ours, 0.275, is unexplained, as is H. Catches a
      join missing the season (1 / 2027 would be registered); a join missing the league
      (each 2026 side would get two register rows); and, through the AVG rows, either
      mistake in the rate (espn_formula) join alone.
    model: rec_espn__matchup_stat_differences
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
          - {platform: espn, league_id: "1", season: 2027, has_rosters: true}
          - {platform: espn, league_id: "2", season: 2026, has_rosters: true}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 0, part: numerator, component: at_bats, weight: 1}
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 2, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 2, part: denominator, component: at_bats, weight: 1}
      - input: ref('stg_espn__matchups')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7}
          - {league_id: "1", season: 2027, matchup_id: 7}
          - {league_id: "2", season: 2026, matchup_id: 7}
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, started_player_days: 10, verified_player_days: 10}
          - {platform: espn, league_id: "1", season: 2027, matchup_id: 7, fantasy_team_id: 2, started_player_days: 10, verified_player_days: 10}
          - {platform: espn, league_id: "2", season: 2026, matchup_id: 7, fantasy_team_id: 2, started_player_days: 10, verified_player_days: 10}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 0, stat_value: 40}
          - {platform: espn, league_id: "1", season: 2027, matchup_id: 7, fantasy_team_id: 2, stat_key: 0, stat_value: 40}
          - {platform: espn, league_id: "2", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 0, stat_value: 40}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 1, stat_value: 11}
          - {platform: espn, league_id: "1", season: 2027, matchup_id: 7, fantasy_team_id: 2, stat_key: 1, stat_value: 11}
          - {platform: espn, league_id: "2", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 1, stat_value: 12}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, stat_value: 0.275}
          - {platform: espn, league_id: "1", season: 2027, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, stat_value: 0.275}
          - {platform: espn, league_id: "2", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, stat_value: 0.3}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 0, score: 40}
          - {league_id: "1", season: 2027, matchup_id: 7, team_id: 2, stat_id: 0, score: 40}
          - {league_id: "2", season: 2026, matchup_id: 7, team_id: 2, stat_id: 0, score: 40}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 1, score: 10}
          - {league_id: "1", season: 2027, matchup_id: 7, team_id: 2, stat_id: 1, score: 10}
          - {league_id: "2", season: 2026, matchup_id: 7, team_id: 2, stat_id: 1, score: 10}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 2, score: 0.25}
          - {league_id: "1", season: 2027, matchup_id: 7, team_id: 2, stat_id: 2, score: 0.25}
          - {league_id: "2", season: 2026, matchup_id: 7, team_id: 2, stat_id: 2, score: 0.25}
      - input: ref('espn_reconciliation_residuals')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 1, expected_difference: 1, cause: official_scoring_change, evidence: x}
          - {league_id: "2", season: 2026, matchup_id: 7, team_id: 2, stat_id: 1, expected_difference: 2, cause: official_scoring_change, evidence: x}
    expect:
      rows:
        - {league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 0, status: match}
        - {league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 1, status: registered}
        - {league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, status: explained_by_component}
        - {league_id: "1", season: 2027, matchup_id: 7, fantasy_team_id: 2, stat_key: 0, status: match}
        - {league_id: "1", season: 2027, matchup_id: 7, fantasy_team_id: 2, stat_key: 1, status: unexplained}
        - {league_id: "1", season: 2027, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, status: unexplained}
        - {league_id: "2", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 0, status: match}
        - {league_id: "2", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 1, status: registered}
        - {league_id: "2", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, status: explained_by_component}

  - name: category_result_differences_compare_both_directions
    description: >
      Matchup 7, teams 1 and 2. HR matches. AVG flips, but team 2's AVG difference is
      accounted for upstream, so the flip is explained -- for both sides. R flips with
      nothing accounted for: unexplained. ERA is scored at ESPN but missing from our
      marts (say, absent from int_fantasy__categories); SB is in our marts but not
      scored at ESPN (PR #46 review). Both fail rather than vanish.
    model: rec_espn__category_result_differences
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
          # A past season loaded for its matchup totals alone: ESPN's rows for it are not compared.
          - {platform: espn, league_id: "1", season: 2025, has_rosters: false}
      - input: ref('fct_matchup_category_scores')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, category_key: 5, result: WIN, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, category_key: 5, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, category_key: 2, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, category_key: 2, result: WIN, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, category_key: 20, result: WIN, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, category_key: 20, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, category_key: 23, result: TIE, has_unverified_inputs: false}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 5, result: WIN, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 5, result: LOSS, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 2, result: WIN, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 2, result: LOSS, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 20, result: LOSS, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 2, stat_id: 20, result: WIN, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 47, result: WIN, is_scored_category: true}
          # Season 2025 has no rosters: scored at ESPN, and no missing_ours row (ADR 0026).
          - {league_id: "1", season: 2025, matchup_id: 7, team_id: 1, stat_id: 5, result: WIN, is_scored_category: true}
          # Component-only stat: never a category, at either end.
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 0, result: null, is_scored_category: false}
      - input: ref('rec_espn__matchup_stat_differences')
        rows:
          - {matchup_id: 7, fantasy_team_id: 2, stat_key: 2, status: explained_by_component}
          - {matchup_id: 7, fantasy_team_id: 1, stat_key: 20, status: unexplained}
    expect:
      rows:
        - {fantasy_team_id: 1, category_key: 2, status: explained}
        - {fantasy_team_id: 2, category_key: 2, status: explained}
        - {fantasy_team_id: 1, category_key: 5, status: match}
        - {fantasy_team_id: 2, category_key: 5, status: match}
        - {fantasy_team_id: 1, category_key: 20, status: unexplained}
        - {fantasy_team_id: 2, category_key: 20, status: unexplained}
        - {fantasy_team_id: 1, category_key: 23, status: missing_espn}
        - {fantasy_team_id: 1, category_key: 47, status: missing_ours}

  - name: player_day_residuals_judge_each_key_against_the_register
    description: >
      One league-season, five keys, all of team 1 and stat 1, one matchup each. Matchup 1:
      two difference rows of 1 and 1 against a register row of 2, plus an unverified row
      of 5 that is not counted: the sum is 2 and no problem. Matchup 2: a difference of 1
      and no register row: unregistered. Matchup 3: a difference of 1 against a register
      row of 2: wrong_size. Matchup 4: differences of 1 and minus 1 that cancel, and no
      register row: unregistered, with a sum of 0. Matchup 5: only an unverified row, and
      no register row: no row at all. Catches a key checked for existence but not size; a
      cancelling pair passing; unverified rows judged or summed.
    model: rec_espn__player_day_residuals
    given:
      - input: ref('rec_espn__player_day_differences')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 5, status: unverified}
          - {league_id: "1", season: 2026, matchup_id: 2, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 3, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 4, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 4, fantasy_team_id: 1, stat_id: 1, difference: -1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 5, fantasy_team_id: 1, stat_id: 1, difference: 3, status: unverified}
      - input: ref('espn_reconciliation_residuals')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, team_id: 1, stat_id: 1, expected_difference: 2}
          - {league_id: "1", season: 2026, matchup_id: 3, team_id: 1, stat_id: 1, expected_difference: 2}
    expect:
      rows:
        - {matchup_id: 1, difference_sum: 2, difference_rows: 2, expected_difference: 2, problem: null}
        - {matchup_id: 2, difference_sum: 1, difference_rows: 1, expected_difference: null, problem: unregistered}
        - {matchup_id: 3, difference_sum: 1, difference_rows: 1, expected_difference: 2, problem: wrong_size}
        - {matchup_id: 4, difference_sum: 0, difference_rows: 2, expected_difference: null, problem: unregistered}

  - name: player_day_residuals_keep_each_league_seasons_register_apart
    description: >
      Three league-seasons -- 1 / 2026, 1 / 2027 and 2 / 2026 -- share one matchup, side
      and stat, each with a difference of 1. The register has a row of 1 for 1 / 2026 and
      a row of 2 for 2 / 2026, and none for 1 / 2027. Each is judged against its own row:
      1 / 2026 matches, 1 / 2027 is unregistered, 2 / 2026 is wrong_size. Catches a join
      without the season (2027 would pass against 2026's row) and a join without the
      league (league 2 would be judged against league 1's row, or fan out).
    model: rec_espn__player_day_residuals
    given:
      - input: ref('rec_espn__player_day_differences')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2027, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "2", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
      - input: ref('espn_reconciliation_residuals')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, team_id: 1, stat_id: 1, expected_difference: 1}
          - {league_id: "2", season: 2026, matchup_id: 1, team_id: 1, stat_id: 1, expected_difference: 2}
    expect:
      rows:
        - {league_id: "1", season: 2026, matchup_id: 1, difference_sum: 1, expected_difference: 1, problem: null}
        - {league_id: "1", season: 2027, matchup_id: 1, difference_sum: 1, expected_difference: null, problem: unregistered}
        - {league_id: "2", season: 2026, matchup_id: 1, difference_sum: 1, expected_difference: 2, problem: wrong_size}
