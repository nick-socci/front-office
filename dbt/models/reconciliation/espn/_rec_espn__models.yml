      ours less ESPN's: explained_by_component. Team 4: H 10, AVG 0.26: 10 / 0.26 is 38.46,
      not whole: nothing recovered (recovered_value null), and ours (0.25) is unexplained.
      Team 5: H 0 and AVG 0: a zero rate cannot be recovered; ours AVG 0 matches. Team 6
      (a weighted numerator): OUTS 90, ERA 3.0: ER recovered as 3.0 * 90 / 27 = 10; ours
