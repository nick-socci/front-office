      rates, never AB or ER. Team 1: H 10, AVG 0.25: AB recovered as 40, ours AB 40:
      AVG matches, recovered_value 40, formula_checked false. Team 2: ours AB 41 (AVG
      10 / 41) with a game-line difference of 1 on AB: ours less gl is the recovered 40, so
      the shift is the gl, and AVG is explained_by_component. Team 3: ours AB 41, no gl, and
