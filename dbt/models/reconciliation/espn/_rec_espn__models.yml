  - name: category_result_differences_explain_a_flip_only_from_its_own_season
    description: >
      Catches a value explained in one season excusing a flipped category in another.
      Matchup ids restart every season, so matchup 7 of 2025 and of 2026 share an id. AVG
      (2) flips in both; only 2026's side has an explained AVG. 2026's flip is explained,
      2025's is not. The same holds across leagues, which share matchup ids too.
    model: rec_espn__category_result_differences
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2025, has_rosters: true}
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
          - {platform: espn, league_id: "2", season: 2026, has_rosters: true}
      - input: ref('fct_matchup_category_scores')
        rows:
          - {platform: espn, league_id: "1", season: 2025, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, category_key: 2, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, category_key: 2, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "2", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, category_key: 2, result: LOSS, has_unverified_inputs: false}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          - {league_id: "1", season: 2025, matchup_id: 7, team_id: 1, stat_id: 2, result: WIN, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 2, result: WIN, is_scored_category: true}
          - {league_id: "2", season: 2026, matchup_id: 7, team_id: 1, stat_id: 2, result: WIN, is_scored_category: true}
      - input: ref('stg_espn__matchups')
        rows:
          - {league_id: "1", season: 2025, matchup_id: 7}
          - {league_id: "1", season: 2026, matchup_id: 7}
          - {league_id: "2", season: 2026, matchup_id: 7}
      - input: ref('rec_espn__matchup_stat_differences')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, status: explained_by_component}
    expect:
      rows:
        - {league_id: "1", season: 2025, fantasy_team_id: 1, category_key: 2, status: unexplained}
        - {league_id: "1", season: 2026, fantasy_team_id: 1, category_key: 2, status: explained}
        - {league_id: "2", season: 2026, fantasy_team_id: 1, category_key: 2, status: unexplained}

  - name: winner_differences_explain_a_flip_only_through_explained_results
    description: >
      R4.2, R4.3 (ADR 0078). League 1 / 2026, six matchups whose winner can differ. 1:
      ours HOME, ESPN AWAY, and two category results differ, both explained: problem null.
      2: the same, but one of the two differing results is unexplained:
      category_unexplained. 3: winners differ and every category result matches (level
      categories, #159's tie): no_category_differs. 4: the winners agree and a category
      differs: no row. 5: winners differ on unverified inputs: no row. 6: ESPN has the
      matchup and ours does not: no_category_differs. League 2 shares matchup id 1, its
      winner differs, and its only differing result is unexplained: category_unexplained,
      without making league 1's matchup 1 unexplained. Catches an unexplained flip passing,
      a winner that differs with no category behind it passing, a matchup judged by another
      league's results, and a winner that agrees being returned.
    model: rec_espn__winner_differences
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
          - {platform: espn, league_id: "2", season: 2026, has_rosters: true}
      - input: ref('stg_espn__matchups')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, winner: AWAY}
          - {league_id: "1", season: 2026, matchup_id: 2, winner: AWAY}
          - {league_id: "1", season: 2026, matchup_id: 3, winner: HOME}
          - {league_id: "1", season: 2026, matchup_id: 4, winner: HOME}
          - {league_id: "1", season: 2026, matchup_id: 5, winner: HOME}
          - {league_id: "1", season: 2026, matchup_id: 6, winner: HOME}
          - {league_id: "2", season: 2026, matchup_id: 1, winner: AWAY}
      - input: ref('fct_matchup_results')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, winner: HOME, has_unverified_inputs: false}
          - {league_id: "1", season: 2026, matchup_id: 2, winner: HOME, has_unverified_inputs: false}
          - {league_id: "1", season: 2026, matchup_id: 3, winner: TIE, has_unverified_inputs: false}
          - {league_id: "1", season: 2026, matchup_id: 4, winner: HOME, has_unverified_inputs: false}
          - {league_id: "1", season: 2026, matchup_id: 5, winner: AWAY, has_unverified_inputs: true}
          - {league_id: "2", season: 2026, matchup_id: 1, winner: HOME, has_unverified_inputs: false}
      - input: ref('rec_espn__category_result_differences')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, category_key: 5, status: explained}
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 2, category_key: 5, status: explained}
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, category_key: 20, status: match}
          - {league_id: "1", season: 2026, matchup_id: 2, fantasy_team_id: 3, category_key: 5, status: explained}
          - {league_id: "1", season: 2026, matchup_id: 2, fantasy_team_id: 4, category_key: 9, status: unexplained}
          - {league_id: "1", season: 2026, matchup_id: 3, fantasy_team_id: 5, category_key: 5, status: match}
          - {league_id: "1", season: 2026, matchup_id: 4, fantasy_team_id: 7, category_key: 5, status: explained}
          - {league_id: "2", season: 2026, matchup_id: 1, fantasy_team_id: 1, category_key: 5, status: unexplained}
    expect:
      rows:
        - {league_id: "1", season: 2026, matchup_id: 1, our_winner: HOME, espn_winner: AWAY, differing_categories: 2, explained_categories: 2, problem: null}
        - {league_id: "1", season: 2026, matchup_id: 2, our_winner: HOME, espn_winner: AWAY, differing_categories: 2, explained_categories: 1, problem: category_unexplained}
        - {league_id: "1", season: 2026, matchup_id: 3, our_winner: TIE, espn_winner: HOME, differing_categories: 0, explained_categories: 0, problem: no_category_differs}
        - {league_id: "1", season: 2026, matchup_id: 6, our_winner: null, espn_winner: HOME, differing_categories: 0, explained_categories: 0, problem: no_category_differs}
        - {league_id: "2", season: 2026, matchup_id: 1, our_winner: HOME, espn_winner: AWAY, differing_categories: 1, explained_categories: 0, problem: category_unexplained}

  - name: category_result_differences_leave_out_byes_and_follow_the_matchup_lines
    description: >
      R4.1, R2.1 (ADR 0074). League 1 / 2026. Matchup 9 is a bye: it is not in
      stg_espn__matchups, and ESPN reports a TIE for team 4 in category 5 (2018 m126 and
      m129 shape), with nothing of ours: bye, not missing_ours. Matchup 7 is played: team 1
      is missing ESPN's category 47 result, which stays missing_ours; AVG (2) flips for
      team 1 and its H is explained_by_matchup_lines on team 2, the opponent: explained.
      Catches ESPN's bye results failing the test, a bye rule that swallows a played
      matchup's missing_ours, and a flip behind an explained_by_matchup_lines count left
      unexplained.
    model: rec_espn__category_result_differences
    given:
      - input: ref('int_fantasy__league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, has_rosters: true}
      - input: ref('fct_matchup_category_scores')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, category_key: 2, result: LOSS, has_unverified_inputs: false}
      - input: ref('stg_espn__matchup_category_results')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 2, result: WIN, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 47, result: WIN, is_scored_category: true}
          - {league_id: "1", season: 2026, matchup_id: 9, team_id: 4, stat_id: 5, result: TIE, is_scored_category: true}
      - input: ref('stg_espn__matchups')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7}
      - input: ref('rec_espn__matchup_stat_differences')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, stat_key: 2, status: explained_by_matchup_lines}
    expect:
      rows:
        - {matchup_id: 7, fantasy_team_id: 1, category_key: 2, status: explained}
        - {matchup_id: 7, fantasy_team_id: 1, category_key: 47, status: missing_ours}
        - {matchup_id: 9, fantasy_team_id: 4, category_key: 5, status: bye}

  - name: player_day_residuals_judge_each_key_against_the_register
    description: >
      One league-season, five keys, all of team 1 and stat 1, one matchup each. Matchup 1:
      two difference rows of 1 and 1 against a register row of 2, plus an unverified row
      of 5 that is not counted: the sum is 2 and no problem. Matchup 2: a difference of 1
      and no register row: unregistered. Matchup 3: a difference of 1 against a register
      row of 2: wrong_size. Matchup 4: differences of 1 and minus 1 that cancel, and no
      register row: unregistered, with a sum of 0. Matchup 5: only an unverified row, and
      no register row: no row at all. Catches a key checked for existence but not size; a
      cancelling pair passing; unverified rows judged or summed.
    model: rec_espn__player_day_residuals
    given:
      - input: ref('rec_espn__player_day_differences')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 5, status: unverified}
          - {league_id: "1", season: 2026, matchup_id: 2, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 3, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 4, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 4, fantasy_team_id: 1, stat_id: 1, difference: -1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 5, fantasy_team_id: 1, stat_id: 1, difference: 3, status: unverified}
      - input: ref('espn_reconciliation_residuals')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, team_id: 1, stat_id: 1, expected_difference: 2}
          - {league_id: "1", season: 2026, matchup_id: 3, team_id: 1, stat_id: 1, expected_difference: 2}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
      # Nothing of ours or of ESPN's matchup lines: no key is carried.
      - input: ref('int_fantasy__matchup_side_totals')
        rows: []
      - input: ref('rec_espn__matchup_line_totals')
        format: sql
        rows: |
          {% raw %}select
              cast(null as {{ fo_type_text() }}) as league_id, cast(null as integer) as season,
              cast(null as bigint) as matchup_id, cast(null as bigint) as fantasy_team_id,
              cast(null as bigint) as stat_key, cast(null as {{ fo_type_float() }}) as matchup_line_value
          limit 0{% endraw %}
    expect:
      rows:
        - {matchup_id: 1, difference_sum: 2, difference_rows: 2, expected_difference: 2, problem: null}
        - {matchup_id: 2, difference_sum: 1, difference_rows: 1, expected_difference: null, problem: unregistered}
        - {matchup_id: 3, difference_sum: 1, difference_rows: 1, expected_difference: 2, problem: wrong_size}
        - {matchup_id: 4, difference_sum: 0, difference_rows: 2, expected_difference: null, problem: unregistered}

  - name: player_day_residuals_keep_each_league_seasons_register_apart
    description: >
      Three league-seasons -- 1 / 2026, 1 / 2027 and 2 / 2026 -- share one matchup, side
      and stat, each with a difference of 1. The register has a row of 1 for 1 / 2026 and
      a row of 2 for 2 / 2026, and none for 1 / 2027. Each is judged against its own row:
      1 / 2026 matches, 1 / 2027 is unregistered, 2 / 2026 is wrong_size. Catches a join
      without the season (2027 would pass against 2026's row) and a join without the
      league (league 2 would be judged against league 1's row, or fan out).
    model: rec_espn__player_day_residuals
    given:
      - input: ref('rec_espn__player_day_differences')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2027, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "2", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
      - input: ref('espn_reconciliation_residuals')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, team_id: 1, stat_id: 1, expected_difference: 1}
          - {league_id: "2", season: 2026, matchup_id: 1, team_id: 1, stat_id: 1, expected_difference: 2}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
      # Nothing of ours or of ESPN's matchup lines: no key is carried.
      - input: ref('int_fantasy__matchup_side_totals')
        rows: []
      - input: ref('rec_espn__matchup_line_totals')
        format: sql
        rows: |
          {% raw %}select
              cast(null as {{ fo_type_text() }}) as league_id, cast(null as integer) as season,
              cast(null as bigint) as matchup_id, cast(null as bigint) as fantasy_team_id,
              cast(null as bigint) as stat_key, cast(null as {{ fo_type_float() }}) as matchup_line_value
          limit 0{% endraw %}
    expect:
      rows:
        - {league_id: "1", season: 2026, matchup_id: 1, difference_sum: 1, expected_difference: 1, problem: null}
        - {league_id: "1", season: 2027, matchup_id: 1, difference_sum: 1, expected_difference: null, problem: unregistered}
        - {league_id: "2", season: 2026, matchup_id: 1, difference_sum: 1, expected_difference: 2, problem: wrong_size}

  - name: player_day_residuals_account_for_a_key_the_matchup_lines_carry
    description: >
      R5.1 to R5.3 (ADR 0077). League 1 / 2026, team 1, no register row except where
      said. A key is carried when our side value of the key's component less the key's
      difference sum equals ESPN's matchup-line sum for the side and stat. Matchup 1: H,
      ours 10, a difference of 1 (ESPN's daily lines say 9), lines 9: carried. Matchup 2
      (#152's shape): ER, ours 44, a difference of -1 (ESPN's daily lines say 45, with a
      start we left out and the matchup lines leave out too), lines 42: 44 + 1 is 45, not
      42: unregistered. Matchup 3: differences of 1 and -1 that cancel, ours 10, lines 10:
      carried. Matchup 4: ours 1, a difference of 1, and the side has no lines at all: not
      carried, though 1 less 1 is the 0 a missing line might be read as: unregistered.
      Matchup 5: lines of league 2 equal the carried value and league 1's do not:
      unregistered. Matchup 6: HLD (stat 60, a stat no scored category is built from), ours
      3, a difference of 1, lines 2: carried (R5.3). Matchup 7: a register row of 2 and a
      difference sum of 1, lines carrying it: wrong_size, since a register row is still
      judged by its size. Catches an uncredited day accounted for by the lines it is
      absent from, a carried key failing, a cancelling pair failing, a missing line read
      as zero, another league's lines used, and a stat outside the scored list judged
      differently.
    model: rec_espn__player_day_residuals
    given:
      - input: ref('rec_espn__player_day_differences')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 2, fantasy_team_id: 1, stat_id: 45, difference: -1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 3, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 3, fantasy_team_id: 1, stat_id: 1, difference: -1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 4, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 5, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 6, fantasy_team_id: 1, stat_id: 60, difference: 1, status: difference}
          - {league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, stat_id: 1, difference: 1, status: difference}
      - input: ref('espn_reconciliation_residuals')
        rows:
          - {league_id: "1", season: 2026, matchup_id: 7, team_id: 1, stat_id: 1, expected_difference: 2}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 45, part: numerator, component: earned_runs, weight: 1}
          - {platform: espn, stat_key: 60, part: numerator, component: holds, weight: 1}
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 1, fantasy_team_id: 1, hits: 10, earned_runs: 0, holds: 0}
