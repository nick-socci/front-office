version: 2

models:
  - name: rec_fantasy__category_wins_added
    description: >
      One row per (player, fantasy team) with a started day in a matchup that can be scored
      again: the category results, and the matchups, that went the team's way because of
      him, found by swapping his production for replacement production and scoring the
      matchup again. A check on the value facts, not a valuation; read in aggregate
      through rec_fantasy__category_wins_by_group. See the model header.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
        constraints: [{type: not_null}]
      - name: league_id
        data_type: varchar
        constraints: [{type: not_null}]
      - name: season
        data_type: bigint
        constraints: [{type: not_null}]
      - name: platform_player_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: fantasy_team_id
        data_type: bigint
        constraints: [{type: not_null}]
      - name: matchups_rescored
        description: >
          Matchups with a winner and no unverified inputs in which the pair had a started
          day.
        data_type: bigint
        constraints: [{type: not_null}]
      - name: category_wins_added
        description: >
          Actual category results minus the results with replacement in his place, over
          those matchups and every scored category: a win 1, a tie one half, averaged
          over twenty whole-number draws of replacement. Null when a kind of day he
          played has no replacement level.
        data_type: double
      - name: matchup_wins_added
        description: The same for the matchup, won by more categories won than lost.
        data_type: double
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, platform_player_id, fantasy_team_id]

  - name: rec_fantasy__category_wins_by_group
    description: >
      One row per league-season and replacement group: the slope through the origin of
      real category wins added on total_value, their correlation, and whether the group
      is judged by values_track_rescored_category_wins. Every group is a row, judged or
      not. A view: a contract's not_null constraints do not apply to one, so the
      columns that are never null are tested for it.
    config:
      contract:
        enforced: true
    columns:
      - name: platform
        data_type: varchar
      - name: league_id
        data_type: varchar
      - name: season
        data_type: bigint
      - name: replacement_group
        data_type: varchar
      - name: matchups_rescored
        description: Matchups of the league-season with a winner and no unverified inputs.
        data_type: bigint
        data_tests: [not_null]
      - name: pairs
        data_type: bigint
        data_tests: [not_null]
      - name: pairs_unmeasured
        description: Pairs with a null total_value or null category_wins_added.
        data_type: bigint
        data_tests: [not_null]
      - name: slope
        description: sum(wins * value) / sum(value squared) over the measured pairs; theory gives 0.40.
        data_type: double
      - name: correlation
        data_type: double
      - name: is_judged
        description: >
          At least 100 matchups scored again, at least 100 pairs, and a correlation of
          0.75 or more.
        data_type: boolean
        data_tests: [not_null]
      - name: problem
        description: >
          Why values_track_rescored_category_wins fails the group, or null: a group of
          100 or more pairs with an unmeasured pair is not checkable; a judged group's
          slope must lie in 0.34 to 0.47.
        data_type: varchar
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, replacement_group]

unit_tests:
  - name: category_wins_added_counts_the_results_that_change_without_the_player
    description: >
      Three categories: hits (stat 1), ERA (47, lower is better) and strikeouts (48).
      Matchup 7: team 1 has 10 hits, a 3.00 ERA and 20 strikeouts against team 2's 8, 4.00
      and 25, so it wins hits and ERA, loses strikeouts and takes the matchup 2 to 1.
      Replacement is 1 hit a batting day and, in a start, 9 outs, 6 earned runs and 5
      strikeouts: whole numbers, so no draw matters. Player 11 had 5 hits in 2 days;
      with 2 in their place the side has 7, loses hits and the matchup: 1 category win
      and 1 matchup win added. Player 12 had 2 hits in 2 days, exactly replacement:
      nothing added. Player 13 started once for 9 outs, no earned runs and 5 strikeouts;
      with replacement the side's ERA is 9.00 and it loses ERA and the matchup: 1 and 1,
      and the right way round for a category won by the smaller number. Matchup 10 is
      level in all three; player 31's 3 hits in 1 day become 1, the tie in hits becomes
      a loss and the tied matchup a lost one: one half and one half. Player 11 also
      played in matchup 8, which has no winner, and matchup 9, whose inputs are
      unverified; player 14 played only in matchup 8. Neither is scored again: player 11
      has 1 matchup and player 14 no row. Catches: a tie counted as a win or as nothing;
      a lower-is-better category judged the wrong way; an unfinished or unverified
      matchup scored again; replacement charged for days not played.
    model: rec_fantasy__category_wins_added
    overrides:
      macros:
        fo_batting_columns: [games_batted, hits]
        fo_pitching_columns: [games_pitched, games_started, outs_recorded, earned_runs, pitcher_strikeouts]
    given:
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
          - {platform: espn, stat_key: 47, part: numerator, component: earned_runs, weight: 27}
          - {platform: espn, stat_key: 47, part: denominator, component: outs_recorded, weight: 1}
          - {platform: espn, stat_key: 48, part: numerator, component: pitcher_strikeouts, weight: 1}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1, is_lower_better: false}
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, is_lower_better: true}
