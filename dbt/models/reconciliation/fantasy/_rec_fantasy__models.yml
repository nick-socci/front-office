          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, games_batted: 10, hits: 8, games_pitched: 3, games_started: 3, outs_recorded: 27, earned_runs: 4, pitcher_strikeouts: 25}
