          - {platform: espn, league_id: "1", season: 2026, matchup_id: 8, matchup_period: 2, fantasy_team_id: 2, opponent_team_id: 1}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 9, matchup_period: 3, fantasy_team_id: 1, opponent_team_id: 2}
