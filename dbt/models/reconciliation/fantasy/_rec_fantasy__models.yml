  - name: category_wins_added_draw_a_fraction_of_replacement_as_a_whole_number
    description: >
      One category, hits, and a matchup level at 6 hits each. Player 11 batted one day
      for no hits; replacement is a quarter of a hit a day. Used as a fraction, the
      swapped side would have 6.25 hits and win the tied category in every draw: half a
      category win lost, and half a matchup. Drawn as a whole number it has 7 hits in
      the draws that round up and 6 in the rest. The draw is a fixed function of the
      pair, the matchup, the component and the draw's number, and for these keys it
      rounds up in 4 of the 20 (draws 8, 13, 17 and 19), so both measures are -0.5 * 4 /
      20 = -0.1. Catches the fraction used directly (-0.5), a change in the number of
      draws, and a draw that is not the same on every build.
    model: rec_fantasy__category_wins_added
    overrides:
      macros:
        fo_batting_columns: [games_batted, hits]
        fo_pitching_columns: [games_pitched, games_started, outs_recorded]
    given:
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 1, part: numerator, component: hits, weight: 1}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 1, is_lower_better: false}
      - input: ref('fct_matchup_results')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, winner: TIE, has_unverified_inputs: false}
      - input: ref('int_fantasy__matchup_sides')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 1, opponent_team_id: 2}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, matchup_period: 1, fantasy_team_id: 2, opponent_team_id: 1}
      - input: ref('int_fantasy__matchup_periods')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_period: 1, scoring_date: "2026-06-01"}
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, scoring_date: "2026-06-01", fantasy_team_id: 1, platform_player_id: 11, slot_role: hitter, games_batted: 1, hits: 0, games_pitched: 0, games_started: 0, outs_recorded: 0}
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
