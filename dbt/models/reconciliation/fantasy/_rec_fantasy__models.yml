          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, games_batted: 9, hits: 6, games_pitched: 0, games_started: 0, outs_recorded: 0}
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, stat_key: 1, stat_value: 6}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, stat_key: 1, stat_value: 6}
      - input: ref('int_fantasy__replacement_levels')
        rows:
          - {platform: espn, league_id: "1", season: 2026, day_kind: batting, component: games_batted, level_per_played_day: 1}
          - {platform: espn, league_id: "1", season: 2026, day_kind: batting, component: hits, level_per_played_day: 0.25}
    expect:
      rows:
        - {platform_player_id: 11, fantasy_team_id: 1, matchups_rescored: 1, category_wins_added: -0.1, matchup_wins_added: -0.1}

  - name: category_wins_added_are_null_where_a_kind_of_day_has_no_level
    description: >
