version: 2

models:
  - name: fct_matchup_category_scores
    description: >
      One row per (matchup, team, scored category): the team's value, its opponent's,
      and the result. Values are recomputed from MLB boxscores through the slots each
      team started, by the rules in int_fantasy__stat_components; nothing about the
      league's categories is hardcoded. has_unverified_inputs marks a category resting on
      a missing boxscore or an unresolved player on either side -- reported, never
      silently scored as zero.
    columns:
      - name: result
        description: >
          WIN, LOSS or TIE for this team, applying is_lower_better, compared at 9
          decimals. Null only for a rate over a zero denominator. That is expected with
          unverified inputs and fails the build otherwise: how ESPN scores a verified
          zero-out or zero-at-bat side is unobserved.
        data_tests:
          - not_null:
              config:
                where: "not has_unverified_inputs"
          - accepted_values:
              arguments:
                values: [WIN, LOSS, TIE]
      - name: has_unverified_inputs
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, matchup_id, fantasy_team_id, category_key]
      # Both sides of every category have a value; a missing one would be a dropped side.
      - dbt_utils.expression_is_true:
          name: fct_matchup_category_scores_values_have_a_side
          arguments:
            expression: "team_value is not null and opponent_value is not null"
            config:
              where: "not has_unverified_inputs"

  - name: fct_matchup_results
    description: >
      One row per head-to-head matchup: category wins for each side, ties, and the
      winner (HOME, AWAY or TIE) by more categories won.
    columns:
      - name: matchup_id
        data_tests: [not_null]
      - name: winner
        description: Null when any category is undecided, which needs unverified inputs.
        data_tests:
          - not_null:
              config:
                where: "not has_unverified_inputs"
          - accepted_values:
              arguments:
                values: [HOME, AWAY, TIE]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform, league_id, season, matchup_id]
      - dbt_utils.expression_is_true:
          name: fct_matchup_results_every_category_decided
          arguments:
            expression: >-
              home_category_wins + away_category_wins + category_ties + categories_undecided
              = scored_categories
      - dbt_utils.expression_is_true:
          name: fct_matchup_results_scored_categories_present
          arguments:
            expression: "scored_categories > 0"

  - name: dim_players
    description: >
      One row per platform player id the league touched: everyone on a roster day plus
      anyone only in the transaction log. A dim_ model describes a thing, here a player,
      with one row per thing, and facts join to it for his attributes. Name, default
      position and resolution come from his latest roster day; a transaction-only player
      has no roster name or position, so he is resolved through the id map by id alone
      and carries nulls there. replacement_group is SP or RP from the default position,
      hitter for any other position, and for a player with no position the group his MLB
      appearances over the whole season give by the shared replacement-group rule. It is
      null only for a player with no MLBAM id. There is deliberately no MLB team column:
      a player changes team within a season, so it is not an attribute of the player.
    columns:
      - name: platform
        data_tests: [not_null]
      - name: platform_player_id
        data_tests: [unique, not_null]
      - name: mlbam_player_id
        description: Null only for an unresolved player.
      - name: player_resolution
        description: How the MLBAM id was found (crosswalk_id, unambiguous_name) or unresolved.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [crosswalk_id, unambiguous_name, unresolved]
      - name: default_position
        description: From his latest roster day; null for a transaction-only player.
      - name: replacement_group
        data_tests:
          - accepted_values:
              arguments:
                values: [hitter, SP, RP]
      - name: pitcher_slot_replacement_group
        description: >
          The group his days in a pitcher slot are measured against: his
          replacement_group if he is a pitcher, otherwise SP or RP from his pitching
          alone (SP if at least half his games pitched were starts). RP for a player who
          never recorded an out. Null only for a player with no MLBAM id.
        data_tests:
          - accepted_values:
              arguments:
                values: [SP, RP]
      - name: first_rostered_date
        description: First roster day; null for a transaction-only player.
      - name: last_rostered_date
        description: Last roster day; null for a transaction-only player.
      - name: is_transaction_only
        data_tests: [not_null]

  - name: fct_player_category_value
    description: >
      One row per (player, fantasy team, scored category) for every pair with at least one
      started day. A fct_ model records measurements at a grain; this one is long, so
      nothing in it knows how many categories the league scores. Holds the numerator and
      denominator over all the pair's started days, the contribution, the value over
      replacement (positive is better, whichever way the category runs) and the value in
      standard deviations. played_days counts days on the category's side only.
    columns:
      - name: platform
        data_tests: [not_null]
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: platform_player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: platform_player_id
      - name: fantasy_team_id
        data_tests: [not_null]
      - name: category_key
        data_tests: [not_null]
      - name: replacement_group
        description: The group the category's side is measured against (hitter, SP or RP).
      - name: contribution
        description: The count, or the rate computed from numerator and denominator. Null for a rate over a zero denominator.
      - name: value_over_replacement
        description: Null only when the needed replacement level is null and the pair played on this side.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform_player_id, fantasy_team_id, category_key]

  - name: fct_player_season_value
    description: >
      One row per (player, fantasy team): how many days he started, played, started outside
      any matchup and started on unverified inputs, and his total value. Counted from the
      started-day grain, not from the category fact. total_value is the sum of his
      standardised values over every scored category and is null if any of them is null.
    columns:
      - name: platform
        data_tests: [not_null]
      - name: platform_player_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_players')
                field: platform_player_id
      - name: fantasy_team_id
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [platform_player_id, fantasy_team_id]

  - name: fct_transaction_impact
    description: >
      One row per transaction (an add or a drop) with the window of days it opens and what
      the player produced in it, valued on the scale of fct_player_category_value. An add
      is measured over the days the adding team started him until that team's next drop of
      him; a drop over the rest of the season, whoever had him. Components are summed over
      the window on the credited side. total_value is null for a dropped player with no
      MLBAM id, and where a replacement pool is empty.
    columns:
      - name: transaction_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('int_fantasy__transactions')
                field: transaction_id
      - name: movement
        data_tests: [not_null]
      - name: window_start
        data_tests: [not_null]
      - name: window_end
        data_tests: [not_null]

# -----------------------------------------------------------------------------
# Unit tests (#10). Each gives only the columns the model reads.
# -----------------------------------------------------------------------------

unit_tests:
  - name: category_scores_apply_direction_and_tie_rules
    description: >
      HR: more wins. ERA: fewer wins (is_lower_better). R: equal is a tie. AVG: values
      that differ only by float noise (0.1 + 0.2 vs 0.3) tie rather than hand one side a
      win. Team 1 has a missing boxscore, which marks both sides' categories unverified.
    model: fct_matchup_category_scores
    given:
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, stat_key: 5, stat_value: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, stat_key: 5, stat_value: 8}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, stat_key: 47, stat_value: 4.5}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, stat_key: 47, stat_value: 3.25}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, stat_key: 20, stat_value: 30}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, stat_key: 20, stat_value: 30}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, stat_key: 2, stat_value: 0.30000000000000004}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, stat_key: 2, stat_value: 0.3}
          # Not a scored category: never reaches the mart.
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, stat_key: 0, stat_value: 100}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, stat_key: 0, stat_value: 90}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 2, category_label: AVG, is_lower_better: false}
          - {platform: espn, league_id: "1", season: 2026, category_key: 5, category_label: HR, is_lower_better: false}
          - {platform: espn, league_id: "1", season: 2026, category_key: 20, category_label: R, is_lower_better: false}
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, category_label: ERA, is_lower_better: true}
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, started_player_days: 10, verified_player_days: 9}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, started_player_days: 10, verified_player_days: 10}
    expect:
      rows:
        - {fantasy_team_id: 1, category_key: 2, result: TIE, has_unverified_inputs: true}
        - {fantasy_team_id: 2, category_key: 2, result: TIE, has_unverified_inputs: true}
        - {fantasy_team_id: 1, category_key: 5, result: WIN, has_unverified_inputs: true}
        - {fantasy_team_id: 2, category_key: 5, result: LOSS, has_unverified_inputs: true}
        - {fantasy_team_id: 1, category_key: 20, result: TIE, has_unverified_inputs: true}
        - {fantasy_team_id: 2, category_key: 20, result: TIE, has_unverified_inputs: true}
        - {fantasy_team_id: 1, category_key: 47, result: LOSS, has_unverified_inputs: true}
        - {fantasy_team_id: 2, category_key: 47, result: WIN, has_unverified_inputs: true}

  - name: category_scores_leave_a_zero_denominator_undecided
    description: >
      A side with no outs has no ERA. Its value is null and the result is null -- which
      the not_null test then stops -- rather than a guessed win or loss.
    model: fct_matchup_category_scores
    given:
      - input: ref('int_fantasy__matchup_stat_values')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, stat_key: 47, stat_value: null}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, stat_key: 47, stat_value: 3.25}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, category_label: ERA, is_lower_better: true}
      - input: ref('int_fantasy__matchup_side_totals')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, started_player_days: 10, verified_player_days: 10}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, started_player_days: 10, verified_player_days: 10}
    expect:
      rows:
        - {fantasy_team_id: 1, category_key: 47, result: null}
        - {fantasy_team_id: 2, category_key: 47, result: null}

  - name: matchup_results_winner_is_more_categories_won
    description: >
      Matchup 7: home wins 2, loses 1, ties 1 -> HOME. Matchup 8: 1 win each and 2 ties
      -> TIE. Matchup 9: home leads but one category is undecided -> no winner. One row
      per matchup, from the home side's view.
    model: fct_matchup_results
    given:
      - input: ref('fct_matchup_category_scores')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, is_home: true, result: WIN, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, is_home: true, result: WIN, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, is_home: true, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, opponent_team_id: 2, is_home: true, result: TIE, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, is_home: false, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, is_home: false, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, is_home: false, result: WIN, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 2, opponent_team_id: 1, is_home: false, result: TIE, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 8, fantasy_team_id: 3, opponent_team_id: 4, is_home: true, result: WIN, has_unverified_inputs: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 8, fantasy_team_id: 3, opponent_team_id: 4, is_home: true, result: LOSS, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 8, fantasy_team_id: 3, opponent_team_id: 4, is_home: true, result: TIE, has_unverified_inputs: false}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 8, fantasy_team_id: 3, opponent_team_id: 4, is_home: true, result: TIE, has_unverified_inputs: false}
          # A null rate on an unverified side: undecided, so no winner even though home leads.
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 9, fantasy_team_id: 5, opponent_team_id: 6, is_home: true, result: WIN, has_unverified_inputs: true}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 9, fantasy_team_id: 5, opponent_team_id: 6, is_home: true, result: null, has_unverified_inputs: true}
      - input: ref('int_fantasy__matchup_sides')
        rows:
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 7, fantasy_team_id: 1, playoff_tier: NONE}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 8, fantasy_team_id: 3, playoff_tier: WINNERS_BRACKET}
          - {platform: espn, league_id: "1", season: 2026, matchup_id: 9, fantasy_team_id: 5, playoff_tier: NONE}
    expect:
      rows:
        - {matchup_id: 7, home_team_id: 1, away_team_id: 2, scored_categories: 4, home_category_wins: 2, away_category_wins: 1, category_ties: 1, categories_undecided: 0, winner: HOME, has_unverified_inputs: false, playoff_tier: NONE}
        - {matchup_id: 8, home_team_id: 3, away_team_id: 4, scored_categories: 4, home_category_wins: 1, away_category_wins: 1, category_ties: 2, categories_undecided: 0, winner: TIE, has_unverified_inputs: true, playoff_tier: WINNERS_BRACKET}
        - {matchup_id: 9, home_team_id: 5, away_team_id: 6, scored_categories: 2, home_category_wins: 1, away_category_wins: 0, category_ties: 0, categories_undecided: 1, winner: null, has_unverified_inputs: true, playoff_tier: NONE}

# -----------------------------------------------------------------------------
# dim_players unit tests (#11).
# -----------------------------------------------------------------------------

  - name: dim_players_takes_attributes_from_the_latest_roster_day
    description: >
      Id 10 moved from a 2B on team 1 to an SS on team 2 and takes the later row's name and
      position, and is a hitter. Id 11 has two rows on his last date, and the lower team id
      wins. Catches taking the first row, or letting input order decide a tie. Both are
      rostered, so neither is transaction-only, whatever the log says about id 10.
    model: dim_players
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {platform: espn, scoring_date: "2026-04-01", fantasy_team_id: 1, platform_player_id: 10, mlbam_player_id: 1000, player_resolution: crosswalk_id, player_name: "Old Name", default_position: "2B"}
          - {platform: espn, scoring_date: "2026-04-05", fantasy_team_id: 2, platform_player_id: 10, mlbam_player_id: 1000, player_resolution: crosswalk_id, player_name: "Latest Name", default_position: "SS"}
          - {platform: espn, scoring_date: "2026-04-05", fantasy_team_id: 3, platform_player_id: 11, mlbam_player_id: 1100, player_resolution: unambiguous_name, player_name: "Team Three", default_position: "OF"}
          - {platform: espn, scoring_date: "2026-04-05", fantasy_team_id: 2, platform_player_id: 11, mlbam_player_id: 1100, player_resolution: unambiguous_name, player_name: "Team Two", default_position: "1B"}
      - input: ref('int_fantasy__transactions')
        rows:
          - {platform: espn, platform_player_id: 10}
      - input: ref('stg_idmap__players')
        rows: []
      - input: ref('int_mlb__player_game_days')
        rows: []
    expect:
      rows:
        - {platform_player_id: 10, mlbam_player_id: 1000, player_name: "Latest Name", player_resolution: crosswalk_id, default_position: SS, replacement_group: hitter, pitcher_slot_replacement_group: RP, first_rostered_date: "2026-04-01", last_rostered_date: "2026-04-05", is_transaction_only: false}
        - {platform_player_id: 11, mlbam_player_id: 1100, player_name: "Team Two", player_resolution: unambiguous_name, default_position: "1B", replacement_group: hitter, pitcher_slot_replacement_group: RP, first_rostered_date: "2026-04-05", last_rostered_date: "2026-04-05", is_transaction_only: false}

  - name: dim_players_transaction_only_group_comes_from_mlb_appearances
    description: >
      Transaction-only players have no position, so the group is derived from MLB days over
      the whole season. Id 20 only relieved (RP), id 21 only started (SP). Both resolve
      through the id map by id alone, with a null name. Catches every transaction-only
      player falling through to hitter, the failure the design review found.
    model: dim_players
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {platform: espn, scoring_date: "2026-04-01", fantasy_team_id: 1, platform_player_id: 10, mlbam_player_id: 1000, player_resolution: crosswalk_id, player_name: "Somebody", default_position: "SS"}
      - input: ref('int_fantasy__transactions')
        rows:
          - {platform: espn, platform_player_id: 20}
          - {platform: espn, platform_player_id: 20}
          - {platform: espn, platform_player_id: 21}
      - input: ref('stg_idmap__players')
        rows:
          - {espn_player_id: 20, mlbam_player_id: 2000}
          - {espn_player_id: 21, mlbam_player_id: 2100}
      - input: ref('int_mlb__player_game_days')
        rows:
          - {mlbam_player_id: 2000, game_date: "2026-04-02", plate_appearances: 0, batters_faced: 4, outs_recorded: 3, games_pitched: 1, games_started: 0}
          - {mlbam_player_id: 2000, game_date: "2026-04-03", plate_appearances: 0, batters_faced: 5, outs_recorded: 3, games_pitched: 1, games_started: 0}
          - {mlbam_player_id: 2100, game_date: "2026-04-02", plate_appearances: 0, batters_faced: 25, outs_recorded: 18, games_pitched: 1, games_started: 1}
    expect:
      rows:
        - {platform_player_id: 10, mlbam_player_id: 1000, player_name: "Somebody", player_resolution: crosswalk_id, default_position: SS, replacement_group: hitter, pitcher_slot_replacement_group: RP, first_rostered_date: "2026-04-01", last_rostered_date: "2026-04-01", is_transaction_only: false}
        - {platform_player_id: 20, mlbam_player_id: 2000, player_name: null, player_resolution: crosswalk_id, default_position: null, replacement_group: RP, pitcher_slot_replacement_group: RP, first_rostered_date: null, last_rostered_date: null, is_transaction_only: true}
        - {platform_player_id: 21, mlbam_player_id: 2100, player_name: null, player_resolution: crosswalk_id, default_position: null, replacement_group: SP, pitcher_slot_replacement_group: SP, first_rostered_date: null, last_rostered_date: null, is_transaction_only: true}

  - name: dim_players_keeps_a_transaction_only_player_the_id_map_lacks
    description: >
      A transaction-only player absent from the id map is kept, unresolved, with a null
      MLBAM id and a null group. Catches an inner join dropping him (R1.3).
    model: dim_players
    given:
      - input: ref('int_fantasy__roster_days')
        rows: []
      - input: ref('int_fantasy__transactions')
        rows:
          - {platform: espn, platform_player_id: 22}
      - input: ref('stg_idmap__players')
        rows: []
      - input: ref('int_mlb__player_game_days')
        rows: []
    expect:
      rows:
        - {platform_player_id: 22, mlbam_player_id: null, player_name: null, player_resolution: unresolved, default_position: null, replacement_group: null, pitcher_slot_replacement_group: null, is_transaction_only: true}

  - name: dim_players_a_two_way_player_is_measured_as_a_starter_in_a_pitcher_slot
    description: >
      Id 30 is a DH by default position who also starts on the mound; id 31 is a shortstop
      who threw one mop-up inning; id 32 is a shortstop who never pitched. All three are
      hitters by replacement_group. In a pitcher slot the two-way player is measured as an
      SP, from his pitching alone, and the other two as RP. Catches a starter's innings
      being valued against a reliever's day, and plate appearances deciding the pitching
      group.
    model: dim_players
    given:
      - input: ref('int_fantasy__roster_days')
        rows:
          - {platform: espn, scoring_date: "2026-04-01", fantasy_team_id: 1, platform_player_id: 30, mlbam_player_id: 3000, player_resolution: crosswalk_id, player_name: "Two Way", default_position: "DH"}
          - {platform: espn, scoring_date: "2026-04-01", fantasy_team_id: 1, platform_player_id: 31, mlbam_player_id: 3100, player_resolution: crosswalk_id, player_name: "Mop Up", default_position: "SS"}
