# -----------------------------------------------------------------------------
# fct_transaction_impact unit tests (#11). Days are 2026-04-01 (the first scoring date) to
# 2026-04-10 (the last). Macros are overridden to short lists, as for the category fact;
# the HR and ERA categories, one hitter pool level and the SP and RP levels are given in
# every test, and the standard deviations come from the given fct_player_category_value.
# -----------------------------------------------------------------------------

  - name: transaction_impact_add_window_ends_at_the_same_teams_drop_and_counts_only_its_started_days
    description: >
      Team 1 adds player 1 on day 3 and drops him on day 7: the add's window is days 3-7 and
      counts only team 1's started days in it (days 3, 5, 7); its day 8 and team 2's day 5 are
      excluded. Team 2 also adds him on day 4 and never drops him (window 4-10, only team 2's
      day 5). The drop's window is days 8-10 and takes his MLB days there; team 2's earlier add
      is no re-add after the drop. Catches an add window running past its drop, a window
      counting another team's started days, and a re-add before the drop being taken as next.
    model: fct_transaction_impact
    overrides:
      macros:
        fo_batting_columns: [games_batted, home_runs]
        fo_pitching_columns: [games_pitched, outs_recorded, earned_runs]
    given:
      - input: ref('int_fantasy__transactions')
        rows:
