# -----------------------------------------------------------------------------
# fct_player_category_value unit tests (#11): the per-category arithmetic, which lives in
# the fo_category_value macros shared with fct_transaction_impact.
#
# Each overrides the two column-list macros to short lists so the rows stay readable; the
# model builds everything from those lists, so the rules under test are the same.
# -----------------------------------------------------------------------------

  - name: player_category_value_signs_lower_is_better_categories_so_positive_is_better
    description: >
      Pitcher 1 has a 1.00 ERA over 9 innings against a replacement 4.50, so his ERA value
      is +94.5 earned-run units (27 - 4.5 * 27 = -94.5, flipped). Hitter 2 strikes out 3
      times in a played day against a replacement 1, so his batter-strikeout value, a
      lower-is-better count, is -2. Each has no played day on the other side: 0, and a
      count's contribution is its numerator. Catches a missing sign flip, or a flip
      applied to the wrong kind of category. Scaled (ADR 0010): the batter-strikeout
      margin scale is 2, so -2 / 2 = -1; ERA is a rate with margin scale 0.5 and side
      denominator 27 outs, so 94.5 / 27 / 0.5 = 7, which also covers a rate in a real
      category. Without a played day the scaled value is 0. Player 1 is resolved (MLB id
      1001) and player 2 is not, so the id is carried and null is carried (#60).
    model: fct_player_category_value
    overrides:
      macros:
        fo_batting_columns: [games_batted, batter_strikeouts]
        fo_pitching_columns: [games_pitched, outs_recorded, earned_runs]
    given:
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 1, fantasy_team_id: 1, slot_role: pitcher, games_pitched: 1, games_started: 1, outs_recorded: 27, earned_runs: 1}
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 2, fantasy_team_id: 1, slot_role: hitter, games_batted: 1, batter_strikeouts: 3}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 27, category_label: B_SO, is_lower_better: true}
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, category_label: ERA, is_lower_better: true}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 27, part: numerator, component: batter_strikeouts, weight: 1}
          - {platform: espn, stat_key: 47, part: numerator, component: earned_runs, weight: 27}
          - {platform: espn, stat_key: 47, part: denominator, component: outs_recorded, weight: 1}
      - input: ref('int_fantasy__replacement_levels')
        rows:
          - {platform: espn, league_id: "1", season: 2026, day_kind: batting, component: games_batted, level_per_played_day: 1}
          - {platform: espn, league_id: "1", season: 2026, day_kind: batting, component: batter_strikeouts, level_per_played_day: 1}
          - {platform: espn, league_id: "1", season: 2026, day_kind: start, component: games_pitched, level_per_played_day: 1}
          - {platform: espn, league_id: "1", season: 2026, day_kind: start, component: outs_recorded, level_per_played_day: 18}
          - {platform: espn, league_id: "1", season: 2026, day_kind: start, component: earned_runs, level_per_played_day: 3}
      - input: ref('dim_player_league_seasons')
        rows:
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 1, mlbam_player_id: 1001}
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 2, mlbam_player_id: null}
      - input: ref('int_fantasy__category_scales')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 27, margin_scale: 2}
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, margin_scale: 0.5, side_denominator: 27}
    expect:
      rows:
        - {platform_player_id: 1, category_key: 27, played_days: 0, numerator: 0, denominator: null, contribution: 0, value_over_replacement: 0, scaled_value: 0, mlbam_player_id: 1001}
        - {platform_player_id: 1, category_key: 47, played_days: 1, numerator: 27, denominator: 27, contribution: 1, value_over_replacement: 94.5, scaled_value: 7, mlbam_player_id: 1001}
        - {platform_player_id: 2, category_key: 27, played_days: 1, numerator: 3, denominator: null, contribution: 3, value_over_replacement: -2, scaled_value: -1, mlbam_player_id: null}
        - {platform_player_id: 2, category_key: 47, played_days: 0, numerator: 0, denominator: 0, contribution: null, value_over_replacement: 0, scaled_value: 0, mlbam_player_id: null}

  - name: player_category_value_a_rate_over_zero_outs_has_no_contribution_and_loses_its_numerator
    description: >
      A pitcher pitched but recorded no outs and allowed 2 earned runs: ERA numerator 54,
      denominator 0. His contribution is null (no ERA exists), and his value over
      replacement is -54, the whole numerator, because replacement would have recorded
      nothing over zero outs either. Catches a division error, or a zero denominator
      reading as a perfect ERA. Scaled: -54 / 27 / 0.5 = -4 (side denominator 27, margin
      scale 0.5), so the null contribution does not null the scaled value.
    model: fct_player_category_value
    overrides:
      macros:
        fo_batting_columns: [games_batted, batter_strikeouts]
        fo_pitching_columns: [games_pitched, outs_recorded, earned_runs]
    given:
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 1, fantasy_team_id: 1, slot_role: pitcher, games_pitched: 1, games_started: 1, outs_recorded: 0, earned_runs: 2}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, category_label: ERA, is_lower_better: true}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 47, part: numerator, component: earned_runs, weight: 27}
          - {platform: espn, stat_key: 47, part: denominator, component: outs_recorded, weight: 1}
      - input: ref('int_fantasy__replacement_levels')
        rows:
          - {platform: espn, league_id: "1", season: 2026, day_kind: start, component: games_pitched, level_per_played_day: 1}
          - {platform: espn, league_id: "1", season: 2026, day_kind: start, component: outs_recorded, level_per_played_day: 18}
          - {platform: espn, league_id: "1", season: 2026, day_kind: start, component: earned_runs, level_per_played_day: 3}
      - input: ref('int_fantasy__category_scales')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 47, margin_scale: 0.5, side_denominator: 27}
      - input: ref('dim_player_league_seasons')
        rows: []
    expect:
      rows:
        - {platform_player_id: 1, category_key: 47, played_days: 1, numerator: 54, denominator: 0, contribution: null, value_over_replacement: -54, scaled_value: -4}

  - name: player_category_value_a_pair_with_no_played_day_on_a_side_is_worth_zero_not_null
    description: >
      Hitters 1 and 2 strike out 3 and 5 times against a replacement 1 per day: values -2
      and -4 (lower is better). The batter-strikeout margin scale is 2, so scaled -1 and
      -2. (Under ADR 0003 the expected values were -2 and -4, from a player standard
      deviation of 1; they changed because the divisor is now the mock scale 2.) Pitcher 3
      never batted: 0 and 0, not null, although the category has a scale. Catches a null
      for a pair that neither helped nor hurt, and a played-days-0 row being divided.
      Covers case (c), no played day gives 0.
    model: fct_player_category_value
    overrides:
      macros:
        fo_batting_columns: [games_batted, batter_strikeouts]
        fo_pitching_columns: [games_pitched, outs_recorded, earned_runs]
    given:
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 1, fantasy_team_id: 1, slot_role: hitter, games_batted: 1, batter_strikeouts: 3}
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 2, fantasy_team_id: 1, slot_role: hitter, games_batted: 1, batter_strikeouts: 5}
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 3, fantasy_team_id: 1, slot_role: pitcher, games_pitched: 1, games_started: 1, outs_recorded: 3}
      - input: ref('int_fantasy__categories')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 27, category_label: B_SO, is_lower_better: true}
      - input: ref('int_fantasy__stat_components')
        rows:
          - {platform: espn, stat_key: 27, part: numerator, component: batter_strikeouts, weight: 1}
      - input: ref('int_fantasy__replacement_levels')
        rows:
          - {platform: espn, league_id: "1", season: 2026, day_kind: batting, component: games_batted, level_per_played_day: 1}
          - {platform: espn, league_id: "1", season: 2026, day_kind: batting, component: batter_strikeouts, level_per_played_day: 1}
      - input: ref('int_fantasy__category_scales')
        rows:
          - {platform: espn, league_id: "1", season: 2026, category_key: 27, margin_scale: 2}
      - input: ref('dim_player_league_seasons')
        rows: []
    expect:
      rows:
        - {platform_player_id: 1, category_key: 27, played_days: 1, value_over_replacement: -2, scaled_value: -1}
        - {platform_player_id: 2, category_key: 27, played_days: 1, value_over_replacement: -4, scaled_value: -2}
        - {platform_player_id: 3, category_key: 27, played_days: 0, value_over_replacement: 0, scaled_value: 0}

  - name: player_category_value_a_batting_only_day_in_a_pitcher_slot_charges_no_replacement
    description: >
      A pitcher-slot day with one game batted and none pitched, as slot-role crediting
      leaves it (the batting columns are already 0). Neither side has a played day:
      pitcher slot batting does not count, and he did not pitch. So there are 0 played
      days on both sides and no replacement is charged, though a starter's level of 18
      outs is on hand. Catches the two-way-player defect (R4.7): a pitching day
      charged because he appeared on the other side.
    model: fct_player_category_value
    overrides:
      macros:
        fo_batting_columns: [games_batted, batter_strikeouts]
        fo_pitching_columns: [games_pitched, outs_recorded, earned_runs]
    given:
      - input: ref('int_fantasy__started_player_days')
        rows:
          - {platform: espn, league_id: "1", season: 2026, platform_player_id: 1, fantasy_team_id: 1, slot_role: pitcher, games_batted: 0, batter_strikeouts: 0, games_pitched: 0, outs_recorded: 0, earned_runs: 0}
