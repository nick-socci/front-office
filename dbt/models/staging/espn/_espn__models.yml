  - name: transactions_keep_each_league_seasons_newest_run
    description: >
      Catches a global newest run. League A's newest run (fetched 09-01) is older than
      league B's (09-15), so a single max(fetched_at) over every league would keep B's
      pages and drop A's. Each keeps its own newest run, and A's older run (08-01, message
      m-old) is not used.
    model: stg_espn__transactions
    given:
      - input: ref('stg_raw__espn_transactions')
        format: dict
        rows:
          - {source: espn, endpoint: transactions, request_path: /a, request_key: view=x, fetched_at: "20260801T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": [{"id": "t0", "date": 1700000000000, "messages": [{"id": "m-old", "date": 1700000000000, "messageTypeId": 178, "targetId": 1, "to": 1}]}]}'}
          - {source: espn, endpoint: transactions, request_path: /a, request_key: view=x, fetched_at: "20260901T000000Z", file_path: a2, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": [{"id": "t1", "date": 1700000000000, "messages": [{"id": "m1", "date": 1700000000000, "messageTypeId": 178, "targetId": 2, "to": 1}]}]}'}
          - {source: espn, endpoint: transactions, request_path: /b, request_key: view=x, fetched_at: "20260915T000000Z", file_path: b1, partitions: '{"season": 2026, "league_id": "B"}', payload: '{"topics": [{"id": "t2", "date": 1700000000000, "messages": [{"id": "m1", "date": 1700000000000, "messageTypeId": 178, "targetId": 3, "to": 1}]}]}'}
      - input: ref('espn_activity_types')
        rows:
          - {message_type_id: 178, activity: "FA ADDED", is_transaction: true}
    expect:
      rows:
        - {league_id: "A", season: 2026, transaction_id: "m1", espn_player_id: 2}
        - {league_id: "B", season: 2026, transaction_id: "m1", espn_player_id: 3}

  - name: transactions_a_message_on_two_pages_is_taken_from_the_first_page
    description: >
      Catches a missing or changed tie-break. Activity landing between two page requests
      can put one message on both pages of a run, and every page of a run shares one
      fetched_at, so recency cannot choose. The copy on the page with the lower
      request_key is kept (offset=0 before offset=2000), whichever order the rows arrive
      in: here the later page is listed first and carries a different target, so a
      dedupe with no tie-break, or one that prefers the last page, returns player 9.
    model: stg_espn__transactions
    given:
      - input: ref('stg_raw__espn_transactions')
        format: dict
        rows:
          - {source: espn, endpoint: transactions, request_path: /a, request_key: "limit=2000&offset=2000&view=x", fetched_at: "20260901T000000Z", file_path: a2, partitions: '{"season": 2026, "league_id": "A", "offset": 2000}', payload: '{"topics": [{"id": "t1", "date": 1700000000000, "messages": [{"id": "m1", "date": 1700000000000, "messageTypeId": 178, "targetId": 9, "to": 1}]}]}'}
          - {source: espn, endpoint: transactions, request_path: /a, request_key: "limit=2000&offset=0&view=x", fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": [{"id": "t1", "date": 1700000000000, "messages": [{"id": "m1", "date": 1700000000000, "messageTypeId": 178, "targetId": 2, "to": 1}]}]}'}
      - input: ref('espn_activity_types')
        rows:
          - {message_type_id: 178, activity: "FA ADDED", is_transaction: true}
    expect:
      rows:
        - {league_id: "A", season: 2026, transaction_id: "m1", espn_player_id: 2}

  - name: transaction_logs_one_row_per_league_season_at_its_newest_capture
    description: >
      R4.1. League A, 2026 has two pages of one run (09-01, offsets 0 and 2000) and an
      older run (08-01). Catches a row per page or per run, which would give three, and
      a fetched_at taken from the older run.
    model: stg_espn__transaction_logs
    given:
      - input: ref('stg_raw__espn_transactions')
        format: dict
        rows:
          - {source: espn, endpoint: transactions, request_path: /a, request_key: "limit=2000&offset=0&view=x", fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": []}'}
          - {source: espn, endpoint: transactions, request_path: /a, request_key: "limit=2000&offset=2000&view=x", fetched_at: "20260901T000000Z", file_path: a2, partitions: '{"season": 2026, "league_id": "A", "offset": 2000}', payload: '{"topics": []}'}
          - {source: espn, endpoint: transactions, request_path: /a, request_key: "limit=2000&offset=0&view=x", fetched_at: "20260801T000000Z", file_path: a0, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": []}'}
    expect:
      rows:
        - {league_id: "A", season: 2026, fetched_at: "2026-09-01 00:00:00"}

  - name: transaction_logs_an_empty_landed_log_still_has_its_row
    description: >
      R4.2. The log ESPN answered for league A, 2026 has an empty list of topics. Catches
      a model that unnests topics and so loses the league-season, which would read as "no
      log landed".
    model: stg_espn__transaction_logs
    given:
      - input: ref('stg_raw__espn_transactions')
        format: dict
        rows:
          - {source: espn, endpoint: transactions, request_path: /a, request_key: "limit=2000&offset=0&view=x", fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": []}'}
    expect:
      rows:
        - {league_id: "A", season: 2026, fetched_at: "2026-09-01 00:00:00"}

  - name: transaction_logs_leagues_and_seasons_stay_apart
    description: >
      Two leagues and two seasons, each with its own capture time. Catches a grouping on
      the league alone or the season alone, which would merge them, and a global newest
      run.
    model: stg_espn__transaction_logs
    given:
      - input: ref('stg_raw__espn_transactions')
        format: dict
        rows:
          - {source: espn, endpoint: transactions, request_path: /a, request_key: x, fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": []}'}
          - {source: espn, endpoint: transactions, request_path: /a, request_key: x, fetched_at: "20260902T000000Z", file_path: a2, partitions: '{"season": 2025, "league_id": "A"}', payload: '{"topics": []}'}
          - {source: espn, endpoint: transactions, request_path: /b, request_key: x, fetched_at: "20260903T000000Z", file_path: b1, partitions: '{"season": 2026, "league_id": "B"}', payload: '{"topics": []}'}
    expect:
      rows:
        - {league_id: "A", season: 2026, fetched_at: "2026-09-01 00:00:00"}
        - {league_id: "A", season: 2025, fetched_at: "2026-09-02 00:00:00"}
        - {league_id: "B", season: 2026, fetched_at: "2026-09-03 00:00:00"}

  - name: roster_entries_keep_only_the_newer_capture_of_a_scoring_period
    description: >
      Catches a superseded capture's rows surviving. Two captures of one league, season
      and scoring period: the older lists player 11, whom the newer does not, and player
      10 in the starting catcher slot, where the newer has him on the bench. The result
      holds the newer capture's rows only: player 10 on the bench, and no player 11.
    model: stg_espn__roster_entries
    given:
      - input: ref('stg_raw__espn_roster')
        format: sql
        rows: |
          select
              'espn' as source, 'roster' as endpoint, '/r' as request_path,
              'scoringPeriodId=5&view=x' as request_key, '20260601T000000Z' as fetched_at,
              '{"season": 2026, "league_id": "1"}'::JSON as partitions,
              'r1' as file_path, '1' as id, 2026::BIGINT as "seasonId",
              from_json('[{"id": 1, "roster": {"entries": [{"playerId": 10, "lineupSlotId": 0, "playerPoolEntry": {"player": {"fullName": "Ten", "defaultPositionId": 2, "proTeamId": 5}}}, {"playerId": 11, "lineupSlotId": 0, "playerPoolEntry": {"player": {"fullName": "Eleven", "defaultPositionId": 2, "proTeamId": 5}}}]}}]', '[{"id": "BIGINT", "roster": {"entries": [{"playerId": "BIGINT", "lineupSlotId": "BIGINT", "injuryStatus": "VARCHAR", "acquisitionType": "VARCHAR", "playerPoolEntry": {"player": {"fullName": "VARCHAR", "defaultPositionId": "BIGINT", "proTeamId": "BIGINT", "eligibleSlots": ["BIGINT"], "stats": [{"scoringPeriodId": "BIGINT", "statSourceId": "BIGINT", "statSplitTypeId": "BIGINT", "externalId": "VARCHAR", "stats": "JSON"}]}}}]}}]') as teams
          union all
          select
              'espn', 'roster', '/r',
              'scoringPeriodId=5&view=x', '20260602T000000Z',
              '{"season": 2026, "league_id": "1"}'::JSON,
              'r2', '1', 2026::BIGINT,
              from_json('[{"id": 1, "roster": {"entries": [{"playerId": 10, "lineupSlotId": 16, "playerPoolEntry": {"player": {"fullName": "Ten", "defaultPositionId": 2, "proTeamId": 5}}}]}}]', '[{"id": "BIGINT", "roster": {"entries": [{"playerId": "BIGINT", "lineupSlotId": "BIGINT", "injuryStatus": "VARCHAR", "acquisitionType": "VARCHAR", "playerPoolEntry": {"player": {"fullName": "VARCHAR", "defaultPositionId": "BIGINT", "proTeamId": "BIGINT", "eligibleSlots": ["BIGINT"], "stats": [{"scoringPeriodId": "BIGINT", "statSourceId": "BIGINT", "statSplitTypeId": "BIGINT", "externalId": "VARCHAR", "stats": "JSON"}]}}}]}}]')
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: roster, request_path: /r, request_key: "scoringPeriodId=5&view=x", fetched_at: "20260601T000000Z", partitions: '{"season": 2026, "league_id": "1"}', file_path: r1}
          - {source: espn, endpoint: roster, request_path: /r, request_key: "scoringPeriodId=5&view=x", fetched_at: "20260602T000000Z", partitions: '{"season": 2026, "league_id": "1"}', file_path: r2}
      - input: ref('espn_lineup_slots')
        rows:
          - {lineup_slot_id: 0, slot_abbrev: C}
          - {lineup_slot_id: 16, slot_abbrev: BE}
      - input: ref('espn_player_positions')
        rows:
          - {position_id: 2, position_abbrev: C}
    expect:
      rows:
        - {league_id: "1", season: 2026, scoring_period: 5, team_id: 1, espn_player_id: 10, lineup_slot_id: 16, lineup_slot: BE}

  - name: scoring_periods_run_to_each_leagues_own_final_period
    description: >
      Catches one series generated to the longest league's final period. Two league-seasons
      with final periods 2 and 5 must produce 2 and 5 rows; a global maximum would give
      both 5.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "A", season: 2026, latest_scoring_period: 1, final_scoring_period: 2, fetched_at: "2026-04-01 12:00:00"}
          - {league_id: "B", season: 2026, latest_scoring_period: 1, final_scoring_period: 5, fetched_at: "2026-04-01 12:00:00"}
      - input: ref('stg_espn__pro_games')
        rows:
          - {season: 2026, scoring_period: 1, game_date: "2026-04-01"}
    expect:
      rows:
        - {league_id: "A", season: 2026, scoring_period: 1}
        - {league_id: "A", season: 2026, scoring_period: 2}
        - {league_id: "B", season: 2026, scoring_period: 1}
        - {league_id: "B", season: 2026, scoring_period: 2}
        - {league_id: "B", season: 2026, scoring_period: 3}
        - {league_id: "B", season: 2026, scoring_period: 4}
        - {league_id: "B", season: 2026, scoring_period: 5}

  - name: latest_response_is_chosen_per_league_and_season
    description: >
      Catches a global "latest". League 1 was captured earlier than league 2, so selecting
      the single newest response would return league 2 alone and silently drop league 1.
      Each league-season must keep its own newest capture: league 1 has two, and only the
      later (final period 180) may be used, not the earlier one (final period 100).
    model: stg_espn__league_settings
    given:
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", partitions: '{"season": 2026, "league_id": "1"}', file_path: a1}
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260902T000000Z", partitions: '{"season": 2026, "league_id": "1"}', file_path: a2}
          - {source: espn, endpoint: settings, request_path: /b, request_key: view=mSettings, fetched_at: "20260915T000000Z", partitions: '{"season": 2026, "league_id": "2"}', file_path: b1}
      - input: ref('stg_raw__espn_settings')
        format: dict
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "1"}', payload: '{"id": 1, "seasonId": 2026, "status": {"finalScoringPeriod": 100}}'}
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260902T000000Z", file_path: a2, partitions: '{"season": 2026, "league_id": "1"}', payload: '{"id": 1, "seasonId": 2026, "settings": {"scoringSettings": {"playoffMatchupTieRule": "SOMETHING_ELSE", "matchupTieRule": "NONE", "statQualificationMinimum": {"statId": 34, "limitValue": 30.0}}}, "status": {"finalScoringPeriod": 180}}'}
          - {source: espn, endpoint: settings, request_path: /b, request_key: view=mSettings, fetched_at: "20260915T000000Z", file_path: b1, partitions: '{"season": 2026, "league_id": "2"}', payload: '{"id": 2, "seasonId": 2026, "settings": {"scoringSettings": {"playoffMatchupTieRule": "NONE", "matchupTieRule": "NONE"}}, "status": {"finalScoringPeriod": 150}}'}
    expect:
      rows:
        - {league_id: "1", season: 2026, final_scoring_period: 180, playoff_matchup_tie_rule: SOMETHING_ELSE, matchup_tie_rule: "NONE", qualification_stat_id: 34, qualification_minimum: 30.0}
        - {league_id: "2", season: 2026, final_scoring_period: 150, playoff_matchup_tie_rule: "NONE", matchup_tie_rule: "NONE", qualification_stat_id: null, qualification_minimum: null}

  - name: scoring_period_dates_do_not_depend_on_the_settings_capture
    description: >
      Catches the bug of #70: dating periods from the settings capture. ESPN's period
      counter stops after the season, so a capture fetched on 2026-10-07 says the current
      period is 188 while the league's final period is 3 here; counting back from that
      moves period 1 off its date. Whatever the counter and the fetch time say, the dates
      must come from the pro schedule: period 1 is the date its games imply, 2026-03-25.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - league_id: "1"
            season: 2026
            latest_scoring_period: 188
            final_scoring_period: 3
            fetched_at: "2026-10-07 17:16:57"
      - input: ref('stg_espn__pro_games')
        rows:
          - {season: 2026, scoring_period: 1, game_date: "2026-03-25"}
          - {season: 2026, scoring_period: 2, game_date: "2026-03-26"}
    expect:
      rows:
        - scoring_period: 1
          scoring_date: "2026-03-25"
        - scoring_period: 2
          scoring_date: "2026-03-26"
        - scoring_period: 3
          scoring_date: "2026-03-27"

  - name: scoring_periods_with_no_game_are_still_dated
    description: >
      Catches dating a period only when a game falls in it. Games exist only in periods 1
      and 5 here (2026-03-25 and 2026-03-29); periods 2, 3 and 4 have none and must still
      be dated by counting from period 1, as 03-26, 03-27 and 03-28.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2026, latest_scoring_period: 5, final_scoring_period: 5, fetched_at: "2026-04-01 12:00:00"}
      - input: ref('stg_espn__pro_games')
        rows:
          - {season: 2026, scoring_period: 1, game_date: "2026-03-25"}
          - {season: 2026, scoring_period: 5, game_date: "2026-03-29"}
    expect:
      rows:
        - {league_id: "1", season: 2026, scoring_period: 1, scoring_date: "2026-03-25"}
        - {league_id: "1", season: 2026, scoring_period: 2, scoring_date: "2026-03-26"}
        - {league_id: "1", season: 2026, scoring_period: 3, scoring_date: "2026-03-27"}
        - {league_id: "1", season: 2026, scoring_period: 4, scoring_date: "2026-03-28"}
        - {league_id: "1", season: 2026, scoring_period: 5, scoring_date: "2026-03-29"}

  - name: scoring_period_one_is_the_date_a_later_period_implies
    description: >
      Catches taking the earliest game date as period 1. The only game is in period 3, on
      2026-03-27, so period 1 is two days earlier, 2026-03-25, not the date of that game.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2026, latest_scoring_period: 3, final_scoring_period: 3, fetched_at: "2026-04-01 12:00:00"}
      - input: ref('stg_espn__pro_games')
        rows:
          - {season: 2026, scoring_period: 3, game_date: "2026-03-27"}
    expect:
      rows:
        - {league_id: "1", season: 2026, scoring_period: 1, scoring_date: "2026-03-25"}
        - {league_id: "1", season: 2026, scoring_period: 2, scoring_date: "2026-03-26"}
        - {league_id: "1", season: 2026, scoring_period: 3, scoring_date: "2026-03-27"}

  - name: scoring_periods_are_dated_from_their_own_seasons_schedule
    description: >
      Catches one schedule for every season. With 2026 and 2027 both loaded, a global
      minimum would date the 2027 league from 2026's period 1. Each league-season must be
      dated from the pro schedule of its own season. A second 2026 league shares that
      season's schedule and gets the same dates (R3.5).
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2026, latest_scoring_period: 2, final_scoring_period: 2, fetched_at: "2026-04-01 12:00:00"}
          - {league_id: "2", season: 2026, latest_scoring_period: 2, final_scoring_period: 2, fetched_at: "2026-04-01 12:00:00"}
          - {league_id: "1", season: 2027, latest_scoring_period: 2, final_scoring_period: 2, fetched_at: "2027-04-01 12:00:00"}
      - input: ref('stg_espn__pro_games')
        rows:
          - {season: 2026, scoring_period: 1, game_date: "2026-03-25"}
          - {season: 2027, scoring_period: 1, game_date: "2027-03-30"}
    expect:
      rows:
        - {league_id: "1", season: 2026, scoring_period: 1, scoring_date: "2026-03-25"}
        - {league_id: "1", season: 2026, scoring_period: 2, scoring_date: "2026-03-26"}
        - {league_id: "2", season: 2026, scoring_period: 1, scoring_date: "2026-03-25"}
        - {league_id: "2", season: 2026, scoring_period: 2, scoring_date: "2026-03-26"}
        - {league_id: "1", season: 2027, scoring_period: 1, scoring_date: "2027-03-30"}
        - {league_id: "1", season: 2027, scoring_period: 2, scoring_date: "2027-03-31"}

  - name: scoring_periods_keep_their_rows_when_no_pro_schedule_is_loaded
    description: >
      Catches an inner join silently dropping a league-season whose pro schedule is not
      loaded. The periods must still exist, with a null scoring_date, so the not_null test
      on scoring_date fails the build instead of downstream models building empty.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2027, latest_scoring_period: 1, final_scoring_period: 2, fetched_at: "2027-04-01 12:00:00"}
      - input: ref('stg_espn__pro_games')
        rows:
          - {season: 2026, scoring_period: 1, game_date: "2026-03-25"}
    expect:
      rows:
        - {league_id: "1", season: 2027, scoring_period: 1, scoring_date: null}
        - {league_id: "1", season: 2027, scoring_period: 2, scoring_date: null}

  - name: pro_games_a_game_listed_under_both_teams_is_one_row
    description: >
      Catches counting a game once per listing. ESPN lists every game under its home team
      and again, identically, under its away team, so unnesting without collapsing gives
      two rows per game and breaks the (season, game) uniqueness. Game 100 is listed
      under teams 12 and 5 and must be one row; game 101 is listed once each way and
      stays a row of its own.
    model: stg_espn__pro_games
    given:
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", partitions: '{"season": 2026}', file_path: p1}
      - input: ref('stg_raw__espn_pro_schedule')
        format: dict
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", file_path: p1, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 0, "abbrev": "FA"}, {"id": 12, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}], "3": [{"id": 101, "date": 1775171100000, "scoringPeriodId": 3, "homeProTeamId": 5, "awayProTeamId": 12}]}}, {"id": 5, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}], "3": [{"id": 101, "date": 1775171100000, "scoringPeriodId": 3, "homeProTeamId": 5, "awayProTeamId": 12}]}}]}}'}
    expect:
      rows:
        - {season: 2026, espn_game_id: "100", scoring_period: 2, game_start_at_utc: "2026-04-01 17:05:00", game_date: "2026-04-01", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-30 00:00:00"}
        - {season: 2026, espn_game_id: "101", scoring_period: 3, game_start_at_utc: "2026-04-02 23:05:00", game_date: "2026-04-02", home_pro_team_id: 5, away_pro_team_id: 12, fetched_at: "2026-09-30 00:00:00"}

  - name: pro_games_late_utc_starts_belong_to_the_previous_eastern_date
    description: >
      Catches dating a game by its UTC date, or by a conversion that depends on the
      session time zone. A start at 02:05 UTC on 2026-04-01 is 22:05 on 2026-03-31
      Eastern, and ESPN scores it on the 31st; the UTC date would put it a period late.
    model: stg_espn__pro_games
    given:
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", partitions: '{"season": 2026}', file_path: p1}
      - input: ref('stg_raw__espn_pro_schedule')
        format: dict
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", file_path: p1, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"1": [{"id": 100, "date": 1775009100000, "scoringPeriodId": 1, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
    expect:
      rows:
        - {season: 2026, espn_game_id: "100", scoring_period: 1, game_start_at_utc: "2026-04-01 02:05:00", game_date: "2026-03-31", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-30 00:00:00"}

  - name: pro_games_read_only_the_newest_capture_of_a_season
    description: >
      Catches merging captures of one season. A schedule is a statement about the season
      at one moment, so a game the newer capture no longer lists (101) must drop out, not
      linger from the older one. Only game 100, in the newer capture, may appear.
    model: stg_espn__pro_games
    given:
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260901T000000Z", partitions: '{"season": 2026}', file_path: p1}
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", partitions: '{"season": 2026}', file_path: p2}
      - input: ref('stg_raw__espn_pro_schedule')
        format: dict
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260901T000000Z", file_path: p1, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}, {"id": 101, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", file_path: p2, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
    expect:
      rows:
        - {season: 2026, espn_game_id: "100", scoring_period: 2, game_start_at_utc: "2026-04-01 17:05:00", game_date: "2026-04-01", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-30 00:00:00"}

  - name: pro_games_keep_seasons_apart
    description: >
      Catches a global "latest" or a season taken from the wrong place. A 2026 capture
      and a 2027 capture each keep their own games, filed under their own season, even
      though the 2026 one was fetched later in the same run.
    model: stg_espn__pro_games
    given:
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", partitions: '{"season": 2026}', file_path: p1}
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260929T000000Z", partitions: '{"season": 2027}', file_path: p2}
      - input: ref('stg_raw__espn_pro_schedule')
        format: dict
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", file_path: p1, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260929T000000Z", file_path: p2, partitions: '{"season": 2027}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"1": [{"id": 200, "date": 1806620700000, "scoringPeriodId": 1, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
    expect:
      rows:
        - {season: 2026, espn_game_id: "100", scoring_period: 2, game_start_at_utc: "2026-04-01 17:05:00", game_date: "2026-04-01", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-30 00:00:00"}
        - {season: 2027, espn_game_id: "200", scoring_period: 1, game_start_at_utc: "2027-04-01 23:05:00", game_date: "2027-04-01", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-29 00:00:00"}

  - name: lineup_slot_stat_limits_keep_one_entry
    description: >
      A settings capture with one limit entry, slot 22 on stat 33 at 1.857... a day. Catches
      an entry dropped, or a field read from the wrong place (stat_id and limit_value are
      the entry's statId and limitValue, lineup_slot_id its key).
    model: stg_espn__lineup_slot_stat_limits
    given:
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", partitions: '{"season": 2026, "league_id": "1"}', file_path: a1}
      - input: ref('stg_raw__espn_settings')
        format: dict
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "1"}', payload: '{"id": 1, "seasonId": 2026, "settings": {"rosterSettings": {"lineupSlotStatLimits": {"22": {"statId": 33, "limitValue": 1.8571428571428572}}}}}'}
    expect:
      rows:
        - {league_id: "1", season: 2026, lineup_slot_id: 22, stat_id: 33, limit_value: 1.8571428571428572, fetched_at: "2026-09-01 00:00:00"}

  - name: lineup_slot_stat_limits_pair_each_key_with_its_own_value
    description: >
      A rotisserie-shaped capture with two entries, slot 21 on stat 81 at 545.0 and slot 22
      on stat 33 at 78.0. Catches keys and values unnested apart (a cross product of four
      rows, or slot 21 carrying stat 33), and an entry dropped.
    model: stg_espn__lineup_slot_stat_limits
    given:
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", partitions: '{"season": 2020, "league_id": "1"}', file_path: a1}
      - input: ref('stg_raw__espn_settings')
        format: dict
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2020, "league_id": "1"}', payload: '{"id": 1, "seasonId": 2020, "settings": {"rosterSettings": {"lineupSlotStatLimits": {"21": {"statId": 81, "limitValue": 545.0}, "22": {"statId": 33, "limitValue": 78.0}}}}}'}
    expect:
      rows:
        - {league_id: "1", season: 2020, lineup_slot_id: 21, stat_id: 81, limit_value: 545.0, fetched_at: "2026-09-01 00:00:00"}
        - {league_id: "1", season: 2020, lineup_slot_id: 22, stat_id: 33, limit_value: 78.0, fetched_at: "2026-09-01 00:00:00"}

  - name: lineup_slot_stat_limits_have_no_row_for_an_empty_object
    description: >
      A settings capture whose lineupSlotStatLimits is {} (2021's), beside one with an
      entry. Catches a row of nulls for the empty object, and the league-season without
      limits taking the other one's.
    model: stg_espn__lineup_slot_stat_limits
    given:
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", partitions: '{"season": 2021, "league_id": "1"}', file_path: a1}
          - {source: espn, endpoint: settings, request_path: /b, request_key: view=mSettings, fetched_at: "20260901T000000Z", partitions: '{"season": 2022, "league_id": "1"}', file_path: b1}
      - input: ref('stg_raw__espn_settings')
        format: dict
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2021, "league_id": "1"}', payload: '{"id": 1, "seasonId": 2021, "settings": {"rosterSettings": {"lineupSlotStatLimits": {}}}}'}
          - {source: espn, endpoint: settings, request_path: /b, request_key: view=mSettings, fetched_at: "20260901T000000Z", file_path: b1, partitions: '{"season": 2022, "league_id": "1"}', payload: '{"id": 1, "seasonId": 2022, "settings": {"rosterSettings": {"lineupSlotStatLimits": {"22": {"statId": 33, "limitValue": 1.8571428571428572}}}}}'}
    expect:
      rows:
        - {league_id: "1", season: 2022, lineup_slot_id: 22, stat_id: 33, limit_value: 1.8571428571428572, fetched_at: "2026-09-01 00:00:00"}

seeds:
  - name: espn_stat_ids
    description: >
      ESPN statId -> name, generated from espn-api's STATS_MAP (MIT) by
      scripts/make_espn_seeds.py. Regenerate rather than edit by hand.
    columns:
      - name: stat_id
        data_tests: [not_null, unique]
      - name: display_label
        data_tests: [not_null]
  - name: espn_activity_types
    description: >
      ESPN messageTypeId -> activity (FA ADDED, DROPPED, TRADED...). is_transaction is
      false for lineup moves (188), which the unfiltered activity log also carries (#26):
      they rearrange a roster but move no player between teams. movement, method and
      team_field say how each transaction type moves a player and which message field
      names the acting team (#11, ADR 0004); they are empty for types with no rule
      (a trade, a lineup move), so int_fantasy__transactions fails on a type nobody has
      ruled on rather than guessing.
    columns:
      - name: message_type_id
        data_tests: [not_null, unique]
      - name: is_transaction
        data_tests: [not_null]
      - name: movement
        description: "add (player joins a roster) or drop (player leaves one); empty when the type has no rule."
        data_tests:
          - accepted_values:
              arguments:
                values: [add, drop]
      - name: method
        description: "How the player moved: free_agent, waiver or drop; empty when the type has no rule."
        data_tests:
          - accepted_values:
              arguments:
                values: [free_agent, waiver, drop]
      - name: team_field
        description: "Which message field names the acting team: to (adds, drops 179 and 181) or for (drop 239); empty when the type has no rule."
        data_tests:
          - accepted_values:
              arguments:
                values: [to, for]
  - name: espn_lineup_slots
    description: >
      ESPN lineupSlotId -> slot abbreviation (C, 1B, BE, IL...). is_starting_slot is
      false for exactly bench and injured list: a benched player's real game still
      happens, it is just not credited to the fantasy team. slot_role says which side of a
      started player's game ESPN credits (#10): batting from hitter slots only, pitching
      from P/SP/RP only. Measured, not assumed: summing everything a started player did
      leaves up to 18 of 286 matchup sides off ESPN per stat, crediting by role leaves
      only official-scoring differences. is_injured_list_slot is true for the IL slot
      only: a player cannot be started from it without a roster move, so lineup
      decisions (#12) do not treat it as a candidate (bench stays usable).
    columns:
      - name: lineup_slot_id
        data_tests: [not_null, unique]
      - name: is_starting_slot
        data_tests: [not_null]
      - name: is_injured_list_slot
        data_tests: [not_null]
      - name: slot_role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hitter, pitcher, bench]
    data_tests:
      - dbt_utils.expression_is_true:
          name: espn_lineup_slots_bench_is_exactly_the_non_starting_slots
          arguments:
            expression: "is_starting_slot = (slot_role != 'bench')"
  - name: espn_stat_components
    description: >
      How each stat ESPN reports for a matchup side is computed from credited components
      (#10): value = sum(weight * component) over numerator rows, divided by the same
      over denominator rows when there are any. Rates carry their scale in the weights
      (ERA's 27, WHIP's 3, since outs stand in for innings). Covers all 24 stats in
      scoreByStat, including the 7 that are only components of the 17 scored categories.
    config:
      column_types:
        stat_id: int64
        part: string
        component: string
        weight: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
    columns:
      - name: stat_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('espn_stat_ids')
                field: stat_id
      - name: part
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [numerator, denominator]
      - name: component
        description: >
          A column of int_fantasy__started_player_days (and so of the matchup side
          totals). Listed exhaustively, because a misspelt component would join to
          nothing and score a silent zero.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [games_batted, plate_appearances, at_bats, hits, doubles, triples, home_runs, runs, runs_batted_in, batter_walks, batter_strikeouts, stolen_bases, caught_stealing, hit_by_pitch, sacrifice_flies, total_bases, games_pitched, games_started, outs_recorded, batters_faced, hits_allowed, runs_allowed, earned_runs, home_runs_allowed, pitcher_walks, pitcher_strikeouts, hit_batsmen, wins, losses, saves, holds, blown_saves, complete_games]
      - name: weight
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [stat_id, part, component]
  - name: espn_reconciliation_residuals
    description: >
      Every known difference between our recomputed matchup totals and ESPN's
      scoreByStat, with its cause and evidence (#10). expected_difference is ours minus
      ESPN's, for count stats only; a rate's residual follows from its components.
      fct_matchup_scores_match_espn fails on any residual not listed here AND on any
      row here that no longer matches a live residual, so the register can't grow into
      a tolerance. Causes: official_scoring_change (MLB's later boxscore differs from
      ESPN's own game line for that player-day; ESPN never applied the change) and
      espn_total_inconsistent (ESPN's side total differs from the sum of ESPN's own
      per-player lines for the matchup, which equals ours).

      The key is league_id, season, matchup_id, team_id, stat_id. A row applies to
      one league-season and no other. The file is kept by hand, each row with its
      evidence; it is not generated by scripts/make_espn_seeds.py.
    config:
      column_types:
        league_id: string
        season: int64
        matchup_id: int64
        team_id: int64
        stat_id: int64
        expected_difference: "{{ 'float64' if target.type == 'bigquery' else 'double' }}"
    columns:
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: expected_difference
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "!= 0"
      - name: cause
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [official_scoring_change, espn_total_inconsistent]
      - name: evidence
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_id, team_id, stat_id]
  - name: espn_player_positions
    description: ESPN defaultPositionId -> position abbreviation.
    columns:
      - name: position_id
        data_tests: [not_null, unique]
