version: 2

models:
  - name: stg_espn__league_settings
    description: One row per (league, season) with the settings snapshot that was newest at build time.
    columns:
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: scoring_type
        data_tests:
          - not_null
      - name: playoff_matchup_tie_rule
        description: >
          How ESPN settles a level playoff matchup. "NONE" is ESPN's default, under which
          the higher seed advances. Nothing else has been seen; the singular test
          stg_espn__league_settings_tie_rules_are_understood fails on any other value
          (ADR 0082).
      - name: matchup_tie_rule
        description: >
          How ESPN settles a level regular-season matchup. "NONE" is ESPN's default, under
          which the matchup stays a tie. Null means the capture lacks the setting, and is
          not read as "NONE" (ADR 0082).
      - name: qualification_stat_id
        description: >
          The stat of ESPN's statQualificationMinimum, the least a side must record in a
          matchup not to lose its pitching rate and lower-is-better categories (ADR 0083).
          Stat 34 is outs. Null when the settings have no minimum. The singular test
          stg_espn__league_settings_qualification_is_understood fails the build on a
          minimum the models cannot read (ADR 0085).
      - name: qualification_minimum
        description: >
          The limitValue of ESPN's statQualificationMinimum, in the unit of its stat: 30
          outs per matchup in this league from 2021. Null when the settings have no minimum
          (ADR 0085).
      - name: team_count
        data_tests: [not_null]
      - name: latest_scoring_period
        description: >
          ESPN's own game-wide period counter at the time of the settings capture. It
          stops moving after the season ends, so it is not a date and nothing derives a
          date from it.
      - name: final_scoring_period
        description: The league-season's last scoring period; sets how many periods exist.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season]

  - name: stg_espn__scoring_categories
    description: >
      One row per scored category. is_reverse marks lower-is-better categories such as
      ERA and WHIP. display_label is what ESPN shows a human; stat_abbrev names the unit
      actually stored (stat 34 displays as IP but holds outs).
    columns:
      - name: stat_id
        data_tests: [not_null]
      - name: display_label
        data_tests: [not_null]
      - name: is_reverse
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, stat_id]

  - name: stg_espn__teams
    description: >
      One row per fantasy team. Deliberately excludes members, owners and primaryOwner:
      those identify real people who did not opt into a public repo.
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: wins
        data_tests: [not_null]
      - name: playoff_seed
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, team_id]

  - name: stg_espn__roster_entries
    description: One row per (league, season, scoring period, team, player).
    columns:
      - name: scoring_period
        data_tests: [not_null]
      - name: espn_player_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: lineup_slot_id
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period, team_id, espn_player_id]

  - name: stg_espn__roster_entry_slots
    description: >
      One row per (scoring period, team, player, eligible slot): the slots ESPN said the
      player was eligible for when the payload was fetched (fetched_at), attached to that
      period's roster. ESPN returns current eligibility whatever period is requested, so
      for a backfilled period this is NOT the day's eligibility: across the 2026 backfill
      no player's eligible slots change in 180 periods, and an earlier capture of the
      same periods differs for 4 players (#52). Only a capture made on the day carries
      that day's eligibility.
    columns:
      - name: scoring_period
        data_tests: [not_null]
      - name: espn_player_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: lineup_slot_id
        data_tests: [not_null]
      - name: lineup_slot
        data_tests: [not_null]
      - name: is_starting_slot
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [league_id, season, scoring_period, team_id, espn_player_id, lineup_slot_id]

  - name: stg_espn__scoring_periods
    description: >
      One row per (league, season, scoring period), from 1 to that league-season's own
      final scoring period, mapping it to the calendar date it scored on. The date is counted
      from the period-1 date that ESPN's pro schedule implies for the season, not from ESPN's
      period counter; MLB's opening day is the check, not the source.
      The bridge between ESPN rosters and MLB game logs.
    columns:
      - name: scoring_period
        data_tests: [not_null]
      - name: scoring_date
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period]
      - dbt_utils.unique_combination_of_columns:
          name: stg_espn__scoring_periods_one_period_per_date
          arguments:
            combination_of_columns: [league_id, season, scoring_date]

  - name: stg_espn__matchups
    description: One row per head-to-head matchup, with the category win/loss/tie tally.
    columns:
      - name: matchup_id
        data_tests: [not_null]
      - name: matchup_period
        data_tests: [not_null]
      - name: home_team_id
        data_tests: [not_null]
      - name: away_team_id
        data_tests: [not_null]
      - name: winner
        data_tests:
          - accepted_values:
              arguments:
                values: ["HOME", "AWAY", "TIE", "UNDECIDED"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_id]
      - dbt_utils.expression_is_true:
          name: stg_espn__matchups_teams_differ
          arguments:
            expression: "home_team_id != away_team_id"

  - name: stg_espn__matchup_periods
    description: >
      One row per (matchup period, scoring period): the days a head-to-head matchup was
      scored over. Periods are not a uniform length in this league -- 12, 14 and 7 days
      all occur -- so consumers must take the span from here rather than assume a week.
    columns:
      - name: matchup_period
        data_tests: [not_null]
      - name: scoring_period
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_period, scoring_period]

  - name: stg_espn__matchup_days
    description: >
      One row per (scoring period, matchup period): the matchup period ESPN marked, with
      rosterForCurrentScoringPeriod on its matchup sides, in the response it gave for that
      scoring period. The mapping for a past season, whose matchups carry no
      pointsByScoringPeriod (ADR 0055). Empty where no matchup_days response is loaded,
      which includes CI. scoring_period is the one asked for, not read from the payload.
    columns:
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: scoring_period
        data_tests: [not_null]
      - name: matchup_period
        data_tests: [not_null]
      - name: fetched_at
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period, matchup_period]

  - name: stg_espn__matchup_player_lines
    description: >
      One row per (matchup, side, ESPN player, stat): ESPN's own record of what each
      player was credited with in a matchup, from rosterForMatchupPeriod in the
      matchup-days captures. Actual stats only (statSourceId 0, statSplitTypeId 5); a
      value that is not a number is left out. A matchup's lines come from the newest
      capture of the last scoring period of its matchup period that has a capture, and
      scoring_period and fetched_at say which. Empty where no matchup_days response is
      loaded, which includes CI. Staged for the reconciliation (spec 0147); no name or
      member data is read.
    columns:
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: matchup_period
        description: The schedule element's matchupPeriodId.
        data_tests: [not_null]
      - name: matchup_id
        description: The schedule element's id, as in stg_espn__matchups.
        data_tests: [not_null]
      - name: team_id
        description: The side's teamId.
        data_tests: [not_null]
      - name: espn_player_id
        description: The entry's playerId.
        data_tests: [not_null]
      - name: stat_id
        description: A key of the line's stats object.
        data_tests: [not_null]
      - name: stat_value
        description: Its value, for the whole matchup period.
        data_tests: [not_null]
      - name: scoring_period
        description: The scoring period of the capture the row was read from.
        data_tests: [not_null]
      - name: fetched_at
        description: When that capture was fetched.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_id, team_id, espn_player_id, stat_id]

  - name: stg_espn__lineup_slot_limits
    description: >
      One row per lineup slot with how many a team fills each day -- the shape of a legal
      lineup, read from settings rather than hardcoded. Slots this league does not use
      are kept with slot_count = 0.
    columns:
      - name: lineup_slot_id
        data_tests: [not_null]
      - name: slot_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, lineup_slot_id]
      # Only slots the league actually fills have to be named. ESPN enumerates a slot 18
      # that espn-api does not name and that no league here uses (slot_count 0, and no
      # player is ever eligible for it); inventing a name for it would be a guess. A
      # slot with players in it and no name is a real gap in the seed.
      - dbt_utils.expression_is_true:
          name: stg_espn__lineup_slot_limits_used_slots_are_named
          arguments:
            expression: "lineup_slot is not null"
            config:
              where: "slot_count > 0"

  - name: stg_espn__lineup_slot_stat_limits
    description: >
      One row per (league, season, lineup slot) that ESPN puts a limit on a stat for, read
      from the newest settings capture's lineupSlotStatLimits. Not stg_espn__lineup_slot_limits,
      which says how many players fill each slot: this says how much of one stat a slot may
      credit. The key is the slot id as ESPN files it and is not interpreted; stat_id 33 is
      games started. limit_value is as ESPN gives it: a per-day rate in a head-to-head
      league-season, a season total in a rotisserie one (ADR 0071). A league-season with no
      limits has no row.
    columns:
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: lineup_slot_id
        data_tests: [not_null]
      - name: stat_id
        data_tests: [not_null]
      - name: limit_value
        data_tests: [not_null]
      - name: fetched_at
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, lineup_slot_id]

  - name: stg_espn__matchup_category_results
    description: >
      One row per (matchup, team, stat). Includes the component stats ESPN reports
      alongside ratio categories; is_scored_category separates them from the categories
      the league actually scores.
    columns:
      - name: stat_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ["WIN", "LOSS", "TIE"]
                where: "is_scored_category"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_id, team_id, stat_id]

  - name: stg_espn__player_game_stats
    description: >
      ESPN's own per-game stat lines for rostered players: one row per (scoring period,
      player, ESPN game, stat), actual stats only, from each period's own roster
      snapshot. A doubleheader is two game lines. Used by the reconciliation to trace a
      matchup residual to the player-day that causes it.
    columns:
      - name: espn_game_id
        description: ESPN's game id (externalId), not MLB's game_pk.
        data_tests: [not_null]
      - name: stat_id
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period, espn_player_id, espn_game_id, stat_id]

  - name: stg_espn__transaction_logs
    description: >
      One row per league and season with at least one transactions response loaded, and
      the newest capture's time. Present for a landed log with no transaction in it, so
      "no log landed" can be told apart from "a log with nothing in it" (ADR 0056). Reads
      identifiers only, never the topics.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season]
    columns:
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: fetched_at
        data_tests: [not_null]

  - name: stg_espn__transactions
    description: >
      One row per player movement (add, drop, waiver claim, trade), from every page of
      the newest capture. Lineup moves are excluded; a message type missing from
      espn_activity_types surfaces as a null activity and fails its not_null test.
      Excludes the ESPN account GUID of the member who made the move. "Newest capture" is
      per league and season. league_id and season come from the capture's partitions.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, transaction_id]
    columns:
      - name: league_id
        data_type: varchar
        data_tests: [not_null]
      - name: season
        data_type: integer
        data_tests: [not_null]
      - name: topic_id
        data_type: varchar
      - name: transaction_id
        data_type: varchar
        data_tests: [not_null]
      - name: transacted_at
        data_type: timestamp with time zone
      - name: transaction_date
        data_type: date
        data_tests: [not_null]
      - name: message_type_id
        data_type: bigint
      - name: activity
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["FA ADDED", "WAIVER ADDED", "DROPPED", "TRADED"]
      - name: espn_player_id
        data_type: bigint
        data_tests: [not_null]
      - name: message_to
        data_type: bigint
        description: >
          ESPN's `to` field, as sent. For message types 178, 180, 179 and 181 it is the
          acting team. For type 239 it is -1. Not a team id in general.
      - name: message_from
        data_type: bigint
        description: >
          ESPN's `from` field, as sent. For type 239 it is a lineup slot id (16 is the
          bench, 17 the injured list), not a team. Not a team id in general.
      - name: message_for
        data_type: bigint
        description: >
          ESPN's `for` field, as sent. For type 239 it is the acting team. Type 180 also
          carries it, and there it is NOT the acting team (it matches the claiming roster
          on 1 of 20 in 2026, where `to` matches every in-season one); its meaning for 180
          is not established. Null where ESPN omits it.
      - name: fetched_at
        data_type: timestamp

  - name: stg_espn__pro_games
    description: >
      One row per (season, ESPN game): ESPN's own schedule of MLB games, from the newest
      pro_schedule capture of each season. It states which scoring period each game
      belongs to, which is how ESPN dates its scoring periods. Team ids are ESPN's, not
      MLB's.
    columns:
      - name: season
        description: The season the capture was filed under.
        data_tests: [not_null]
      - name: espn_game_id
        description: ESPN's game id as text; the externalId of the roster stat lines.
        data_tests: [not_null]
      - name: scoring_period
        description: The scoring period ESPN assigns the game to.
        data_tests: [not_null]
      - name: game_start_at_utc
        description: The scheduled start, in UTC.
        data_tests: [not_null]
      - name: game_date
        description: The US/Eastern calendar date of the start.
        data_tests: [not_null]
      - name: home_pro_team_id
        description: ESPN's id of the home team.
        data_tests: [not_null]
      - name: away_pro_team_id
        description: ESPN's id of the away team.
        data_tests: [not_null]
      - name: fetched_at
        data_type: timestamp
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, espn_game_id]

unit_tests:
  - name: roster_entry_slots_keep_only_the_slots_the_league_has
    description: >
      ESPN lists a player as eligible for slot ids a league may not have: in 2025 two
      call-ups carry slot 22, which no season's settings hold and the seed does not name.
      An eligibility is kept only for a slot in that league-season's own slot settings,
      whatever its count (slot 13 has none here), so the player keeps 13 and 14 and
      loses 22. Catches the filter being dropped (a row with no slot name), or reading
      another season's settings (2024 has slot 22 here and must not rescue it).
    model: stg_espn__roster_entry_slots
    given:
      # The roster capture view's row, `teams` typed as the view declares it; and the
      # manifest, which the latest-capture macro chooses on (same file_path).
      - input: ref('stg_raw__espn_roster')
        format: sql
        rows: |
          select
              'espn' as source, 'roster' as endpoint, '/l' as request_path,
              'scoringPeriodId=85&view=mRoster' as request_key, '20261012T000000Z' as fetched_at,
              '{"season": 2025, "league_id": "1", "scoring_period": 85}'::JSON as partitions,
              'a1' as file_path, '1' as id, 2025::BIGINT as "seasonId",
              from_json('[{"id":3,"roster":{"entries":[{"playerId":77,"playerPoolEntry":{"player":{"eligibleSlots":[13,14,22]}}}]}}]', '[{"id": "BIGINT", "roster": {"entries": [{"playerId": "BIGINT", "lineupSlotId": "BIGINT", "injuryStatus": "VARCHAR", "acquisitionType": "VARCHAR", "playerPoolEntry": {"player": {"fullName": "VARCHAR", "defaultPositionId": "BIGINT", "proTeamId": "BIGINT", "eligibleSlots": ["BIGINT"], "stats": [{"scoringPeriodId": "BIGINT", "statSourceId": "BIGINT", "statSplitTypeId": "BIGINT", "externalId": "VARCHAR", "stats": "JSON"}]}}}]}}]') as teams
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: roster, request_path: /l, request_key: "scoringPeriodId=85&view=mRoster", fetched_at: "20261012T000000Z", partitions: '{"season": 2025, "league_id": "1", "scoring_period": 85}', file_path: a1}
      - input: ref('espn_lineup_slots')
        rows:
          - {lineup_slot_id: 13, slot_abbrev: P, is_starting_slot: true}
          - {lineup_slot_id: 14, slot_abbrev: SP, is_starting_slot: true}
      - input: ref('stg_espn__lineup_slot_limits')
        rows:
          - {league_id: "1", season: 2025, lineup_slot_id: 13, slot_count: 0}
          - {league_id: "1", season: 2025, lineup_slot_id: 14, slot_count: 2}
          - {league_id: "1", season: 2024, lineup_slot_id: 22, slot_count: 1}
    expect:
      rows:
        - {league_id: "1", season: 2025, scoring_period: 85, team_id: 3, espn_player_id: 77, lineup_slot_id: 13, lineup_slot: P}
        - {league_id: "1", season: 2025, scoring_period: 85, team_id: 3, espn_player_id: 77, lineup_slot_id: 14, lineup_slot: SP}

  - name: matchup_days_one_marked_period_gives_one_row
    description: >
      R5.2. Scoring period 5 is answered with three matchup periods; only period 4 carries
      rosterForCurrentScoringPeriod. Period 4 has two matchups marked on both sides, and a
      third marked on its home side only (its away is an empty bye object). Period 3's
      sides carry rosterForMatchupPeriod (the lines of spec 0147) and no marker. Catches
      the marker read from the wrong key, a side that merely has some roster member
      counting as marked (period 3), and an unmarked period (3, 5) being returned. It
      cannot catch a row per marked side or matchup: dbt compares a unit test's rows as a
      set, so duplicates pass. The model's uniqueness test and
      stg_espn__matchup_days_mark_one_period catch those (shown on 2026-10-14 by removing
      the distinct: both failed with 1,469 rows on the real warehouse).
    model: stg_espn__matchup_days
    given:
      # The capture view's row, `schedule` typed as the view declares it (each side a
      # declared structure, spec 0147); and the manifest, which the latest-capture macro
      # chooses on.
      - input: ref('stg_raw__espn_matchup_days')
        format: sql
        rows: |
          select
              'espn' as source, 'matchup_days' as endpoint, '/l' as request_path,
              'scoringPeriodId=5&view=mMatchupScore,mScoreboard' as request_key,
              '20260901T000000Z' as fetched_at,
              '{"season": 2018, "league_id": "1", "scoring_period": 5}'::JSON as partitions,
              'a1' as file_path, '1' as id, 2018::BIGINT as "seasonId",
              from_json('[{"matchupPeriodId": 3, "home": {"teamId": 1, "rosterForMatchupPeriod": {"entries": []}}, "away": {"teamId": 2, "rosterForMatchupPeriod": {"entries": []}}}, {"matchupPeriodId": 4, "home": {"teamId": 1, "rosterForCurrentScoringPeriod": {"entries": []}}, "away": {"teamId": 2, "rosterForCurrentScoringPeriod": {"entries": []}}}, {"matchupPeriodId": 4, "home": {"teamId": 3, "rosterForCurrentScoringPeriod": {"entries": []}}, "away": {"teamId": 4, "rosterForCurrentScoringPeriod": {"entries": []}}}, {"matchupPeriodId": 4, "home": {"teamId": 5, "rosterForCurrentScoringPeriod": {"entries": []}}, "away": {}}, {"matchupPeriodId": 5, "home": {"teamId": 1}, "away": {"teamId": 2}}]', '[{"id": "BIGINT", "matchupPeriodId": "BIGINT", "home": {"teamId": "BIGINT", "rosterForCurrentScoringPeriod": "JSON", "rosterForMatchupPeriod": {"entries": [{"playerId": "BIGINT", "playerPoolEntry": {"player": {"stats": [{"statSourceId": "BIGINT", "statSplitTypeId": "BIGINT", "scoringPeriodId": "BIGINT", "stats": "JSON"}]}}}]}}, "away": {"teamId": "BIGINT", "rosterForCurrentScoringPeriod": "JSON", "rosterForMatchupPeriod": {"entries": [{"playerId": "BIGINT", "playerPoolEntry": {"player": {"stats": [{"statSourceId": "BIGINT", "statSplitTypeId": "BIGINT", "scoringPeriodId": "BIGINT", "stats": "JSON"}]}}}]}}}]') as schedule
      - input: source('raw', 'captures')
        rows:
          - {source: espn, endpoint: matchup_days, request_path: /l, request_key: "scoringPeriodId=5&view=mMatchupScore,mScoreboard", fetched_at: "20260901T000000Z", partitions: '{"season": 2018, "league_id": "1", "scoring_period": 5}', file_path: a1}
    expect:
      rows:
        - {league_id: "1", season: 2018, scoring_period: 5, matchup_period: 4, fetched_at: "2026-09-01 00:00:00"}

  - name: matchup_days_the_newer_capture_of_a_scoring_period_wins
    description: >
      R5.2. Two captures of scoring period 5: the older (09-01) marks matchup period 4, the
      newer (09-15) marks 6, and the newer is listed first. Catches a model that keeps both
      (two rows) or the older one.
    model: stg_espn__matchup_days
    given:
      - input: ref('stg_raw__espn_matchup_days')
        format: sql
        rows: |
          select
