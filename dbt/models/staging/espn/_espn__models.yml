version: 2

models:
  - name: stg_espn__league_settings
    description: One row per (league, season) with the settings snapshot that was newest at build time.
    columns:
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: scoring_type
        data_tests:
          - not_null
      - name: team_count
        data_tests: [not_null]
      - name: latest_scoring_period
        description: >
          ESPN's own game-wide period counter at the time of the settings capture. It
          stops moving after the season ends, so it is not a date and nothing derives a
          date from it.
      - name: final_scoring_period
        description: The league-season's last scoring period; sets how many periods exist.
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season]

  - name: stg_espn__scoring_categories
    description: >
      One row per scored category. is_reverse marks lower-is-better categories such as
      ERA and WHIP. display_label is what ESPN shows a human; stat_abbrev names the unit
      actually stored (stat 34 displays as IP but holds outs).
    columns:
      - name: stat_id
        data_tests: [not_null]
      - name: display_label
        data_tests: [not_null]
      - name: is_reverse
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, stat_id]

  - name: stg_espn__teams
    description: >
      One row per fantasy team. Deliberately excludes members, owners and primaryOwner:
      those identify real people who did not opt into a public repo.
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: wins
        data_tests: [not_null]
      - name: playoff_seed
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, team_id]

  - name: stg_espn__roster_entries
    description: One row per (league, season, scoring period, team, player).
    columns:
      - name: scoring_period
        data_tests: [not_null]
      - name: espn_player_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: lineup_slot_id
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period, team_id, espn_player_id]

  - name: stg_espn__roster_entry_slots
    description: >
      One row per (scoring period, team, player, eligible slot): the slots ESPN said the
      player was eligible for when the payload was fetched (fetched_at), attached to that
      period's roster. ESPN returns current eligibility whatever period is requested, so
      for a backfilled period this is NOT the day's eligibility: across the 2026 backfill
      no player's eligible slots change in 180 periods, and an earlier capture of the
      same periods differs for 4 players (#52). Only a capture made on the day carries
      that day's eligibility.
    columns:
      - name: scoring_period
        data_tests: [not_null]
      - name: espn_player_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: lineup_slot_id
        data_tests: [not_null]
      - name: lineup_slot
        data_tests: [not_null]
      - name: is_starting_slot
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [league_id, season, scoring_period, team_id, espn_player_id, lineup_slot_id]

  - name: stg_espn__scoring_periods
    description: >
      One row per (league, season, scoring period), from 1 to that league-season's own
      final scoring period, mapping it to the calendar date it scored on. The date is counted
      from MLB's regular-season opening day of the season, not from ESPN's period counter.
      The bridge between ESPN rosters and MLB game logs.
    columns:
      - name: scoring_period
        data_tests: [not_null]
      - name: scoring_date
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period]
      - dbt_utils.unique_combination_of_columns:
          name: stg_espn__scoring_periods_one_period_per_date
          arguments:
            combination_of_columns: [league_id, season, scoring_date]

  - name: stg_espn__matchups
    description: One row per head-to-head matchup, with the category win/loss/tie tally.
    columns:
      - name: matchup_id
        data_tests: [not_null]
      - name: matchup_period
        data_tests: [not_null]
      - name: home_team_id
        data_tests: [not_null]
      - name: away_team_id
        data_tests: [not_null]
      - name: winner
        data_tests:
          - accepted_values:
              arguments:
                values: ["HOME", "AWAY", "TIE", "UNDECIDED"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_id]
      - dbt_utils.expression_is_true:
          name: stg_espn__matchups_teams_differ
          arguments:
            expression: "home_team_id != away_team_id"

  - name: stg_espn__matchup_periods
    description: >
      One row per (matchup period, scoring period): the days a head-to-head matchup was
      scored over. Periods are not a uniform length in this league -- 12, 14 and 7 days
      all occur -- so consumers must take the span from here rather than assume a week.
    columns:
      - name: matchup_period
        data_tests: [not_null]
      - name: scoring_period
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_period, scoring_period]

  - name: stg_espn__lineup_slot_limits
    description: >
      One row per lineup slot with how many a team fills each day -- the shape of a legal
      lineup, read from settings rather than hardcoded. Slots this league does not use
      are kept with slot_count = 0.
    columns:
      - name: lineup_slot_id
        data_tests: [not_null]
      - name: slot_count
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, lineup_slot_id]
      # Only slots the league actually fills have to be named. ESPN enumerates a slot 18
      # that espn-api does not name and that no league here uses (slot_count 0, and no
      # player is ever eligible for it); inventing a name for it would be a guess. A
      # slot with players in it and no name is a real gap in the seed.
      - dbt_utils.expression_is_true:
          name: stg_espn__lineup_slot_limits_used_slots_are_named
          arguments:
            expression: "lineup_slot is not null"
            config:
              where: "slot_count > 0"

  - name: stg_espn__matchup_category_results
    description: >
      One row per (matchup, team, stat). Includes the component stats ESPN reports
      alongside ratio categories; is_scored_category separates them from the categories
      the league actually scores.
    columns:
      - name: stat_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: result
        data_tests:
          - accepted_values:
              arguments:
                values: ["WIN", "LOSS", "TIE"]
                where: "is_scored_category"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, matchup_id, team_id, stat_id]

  - name: stg_espn__player_game_stats
    description: >
      ESPN's own per-game stat lines for rostered players: one row per (scoring period,
      player, ESPN game, stat), actual stats only, from each period's own roster
      snapshot. A doubleheader is two game lines. Used by the reconciliation to trace a
      matchup residual to the player-day that causes it.
    columns:
      - name: espn_game_id
        description: ESPN's game id (externalId), not MLB's game_pk.
        data_tests: [not_null]
      - name: stat_id
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period, espn_player_id, espn_game_id, stat_id]

  - name: stg_espn__transactions
    description: >
      One row per player movement (add, drop, waiver claim, trade), from every page of
      the newest capture. Lineup moves are excluded; a message type missing from
      espn_activity_types surfaces as a null activity and fails its not_null test.
      Excludes the ESPN account GUID of the member who made the move. "Newest capture" is
      per league and season. league_id and season come from the capture's partitions.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, transaction_id]
    columns:
      - name: league_id
        data_type: varchar
        data_tests: [not_null]
      - name: season
        data_type: integer
        data_tests: [not_null]
      - name: topic_id
        data_type: varchar
      - name: transaction_id
        data_type: varchar
        data_tests: [not_null]
      - name: transacted_at
        data_type: timestamp with time zone
      - name: transaction_date
        data_type: date
        data_tests: [not_null]
      - name: message_type_id
        data_type: bigint
      - name: activity
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["FA ADDED", "WAIVER ADDED", "DROPPED", "TRADED"]
      - name: espn_player_id
        data_type: bigint
        data_tests: [not_null]
      - name: message_to
        data_type: bigint
        description: >
          ESPN's `to` field, as sent. For message types 178, 180, 179 and 181 it is the
          acting team. For type 239 it is -1. Not a team id in general.
      - name: message_from
        data_type: bigint
        description: >
          ESPN's `from` field, as sent. For type 239 it is a lineup slot id (16 is the
          bench, 17 the injured list), not a team. Not a team id in general.
      - name: message_for
        data_type: bigint
        description: >
          ESPN's `for` field, as sent. For type 239 it is the acting team. Type 180 also
          carries it, and there it is NOT the acting team (it matches the claiming roster
          on 1 of 20 in 2026, where `to` matches every in-season one); its meaning for 180
          is not established. Null where ESPN omits it.
      - name: fetched_at
        data_type: timestamp

  - name: stg_espn__pro_games
    description: >
      One row per (season, ESPN game): ESPN's own schedule of MLB games, from the newest
      pro_schedule capture of each season. It states which scoring period each game
      belongs to, which is how ESPN dates its scoring periods. Team ids are ESPN's, not
      MLB's.
    columns:
      - name: season
        description: The season the capture was filed under.
        data_tests: [not_null]
      - name: espn_game_id
        description: ESPN's game id as text; the externalId of the roster stat lines.
        data_tests: [not_null]
      - name: scoring_period
        description: The scoring period ESPN assigns the game to.
        data_tests: [not_null]
      - name: game_start_at_utc
        description: The scheduled start, in UTC.
        data_tests: [not_null]
      - name: game_date
        description: The US/Eastern calendar date of the start.
        data_tests: [not_null]
      - name: home_pro_team_id
        description: ESPN's id of the home team.
        data_tests: [not_null]
      - name: away_pro_team_id
        description: ESPN's id of the away team.
        data_tests: [not_null]
      - name: fetched_at
        data_type: timestamp
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, espn_game_id]

unit_tests:
  - name: transactions_keep_each_league_seasons_newest_run
    description: >
      Catches a global newest run. League A's newest run (fetched 09-01) is older than
      league B's (09-15), so a single max(fetched_at) over every league would keep B's
      pages and drop A's. Each keeps its own newest run, and A's older run (08-01, message
      m-old) is not used.
    model: stg_espn__transactions
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: espn, endpoint: transactions, request_path: /a, request_key: view=x, fetched_at: "20260801T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": [{"id": "t0", "date": 1700000000000, "messages": [{"id": "m-old", "date": 1700000000000, "messageTypeId": 178, "targetId": 1, "to": 1}]}]}'}
          - {source: espn, endpoint: transactions, request_path: /a, request_key: view=x, fetched_at: "20260901T000000Z", file_path: a2, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": [{"id": "t1", "date": 1700000000000, "messages": [{"id": "m1", "date": 1700000000000, "messageTypeId": 178, "targetId": 2, "to": 1}]}]}'}
          - {source: espn, endpoint: transactions, request_path: /b, request_key: view=x, fetched_at: "20260915T000000Z", file_path: b1, partitions: '{"season": 2026, "league_id": "B"}', payload: '{"topics": [{"id": "t2", "date": 1700000000000, "messages": [{"id": "m1", "date": 1700000000000, "messageTypeId": 178, "targetId": 3, "to": 1}]}]}'}
      - input: ref('espn_activity_types')
        rows:
          - {message_type_id: 178, activity: "FA ADDED", is_transaction: true}
    expect:
      rows:
        - {league_id: "A", season: 2026, transaction_id: "m1", espn_player_id: 2}
        - {league_id: "B", season: 2026, transaction_id: "m1", espn_player_id: 3}

  - name: transactions_a_message_on_two_pages_is_taken_from_the_first_page
    description: >
      Catches a missing or changed tie-break. Activity landing between two page requests
      can put one message on both pages of a run, and every page of a run shares one
      fetched_at, so recency cannot choose. The copy on the page with the lower
      request_key is kept (offset=0 before offset=2000), whichever order the rows arrive
      in: here the later page is listed first and carries a different target, so a
      dedupe with no tie-break, or one that prefers the last page, returns player 9.
    model: stg_espn__transactions
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: espn, endpoint: transactions, request_path: /a, request_key: "limit=2000&offset=2000&view=x", fetched_at: "20260901T000000Z", file_path: a2, partitions: '{"season": 2026, "league_id": "A", "offset": 2000}', payload: '{"topics": [{"id": "t1", "date": 1700000000000, "messages": [{"id": "m1", "date": 1700000000000, "messageTypeId": 178, "targetId": 9, "to": 1}]}]}'}
          - {source: espn, endpoint: transactions, request_path: /a, request_key: "limit=2000&offset=0&view=x", fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "A"}', payload: '{"topics": [{"id": "t1", "date": 1700000000000, "messages": [{"id": "m1", "date": 1700000000000, "messageTypeId": 178, "targetId": 2, "to": 1}]}]}'}
      - input: ref('espn_activity_types')
        rows:
          - {message_type_id: 178, activity: "FA ADDED", is_transaction: true}
    expect:
      rows:
        - {league_id: "A", season: 2026, transaction_id: "m1", espn_player_id: 2}

  - name: scoring_periods_run_to_each_leagues_own_final_period
    description: >
      Catches one series generated to the longest league's final period. Two league-seasons
      with final periods 2 and 5 must produce 2 and 5 rows; a global maximum would give
      both 5.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "A", season: 2026, latest_scoring_period: 1, final_scoring_period: 2, fetched_at: "2026-04-01 12:00:00"}
          - {league_id: "B", season: 2026, latest_scoring_period: 1, final_scoring_period: 5, fetched_at: "2026-04-01 12:00:00"}
      - input: ref('stg_mlb__games')
        rows:
          - {season: 2026, game_type: "R", official_date: "2026-04-01"}
    expect:
      rows:
        - {league_id: "A", season: 2026, scoring_period: 1}
        - {league_id: "A", season: 2026, scoring_period: 2}
        - {league_id: "B", season: 2026, scoring_period: 1}
        - {league_id: "B", season: 2026, scoring_period: 2}
        - {league_id: "B", season: 2026, scoring_period: 3}
        - {league_id: "B", season: 2026, scoring_period: 4}
        - {league_id: "B", season: 2026, scoring_period: 5}

  - name: latest_response_is_chosen_per_league_and_season
    description: >
      Catches a global "latest". League 1 was captured earlier than league 2, so selecting
      the single newest response would return league 2 alone and silently drop league 1.
      Each league-season must keep its own newest capture: league 1 has two, and only the
      later (final period 180) may be used, not the earlier one (final period 100).
    model: stg_espn__league_settings
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260901T000000Z", file_path: a1, partitions: '{"season": 2026, "league_id": "1"}', payload: '{"id": 1, "seasonId": 2026, "status": {"finalScoringPeriod": 100}}'}
          - {source: espn, endpoint: settings, request_path: /a, request_key: view=mSettings, fetched_at: "20260902T000000Z", file_path: a2, partitions: '{"season": 2026, "league_id": "1"}', payload: '{"id": 1, "seasonId": 2026, "status": {"finalScoringPeriod": 180}}'}
          - {source: espn, endpoint: settings, request_path: /b, request_key: view=mSettings, fetched_at: "20260915T000000Z", file_path: b1, partitions: '{"season": 2026, "league_id": "2"}', payload: '{"id": 2, "seasonId": 2026, "status": {"finalScoringPeriod": 150}}'}
    expect:
      rows:
        - {league_id: "1", season: 2026, final_scoring_period: 180}
        - {league_id: "2", season: 2026, final_scoring_period: 150}

  - name: scoring_period_dates_do_not_depend_on_the_settings_capture
    description: >
      Catches the bug of #70: dating periods from the settings capture. ESPN's period
      counter stops after the season, so a capture fetched on 2026-10-07 says the current
      period is 188 while the league's final period is 3 here; counting back from that
      moves period 1 off MLB's opening day. Whatever the counter and the fetch time say,
      period 1 must be the date of the first regular-season game, and later games must not
      matter.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - league_id: "1"
            season: 2026
            latest_scoring_period: 188
            final_scoring_period: 3
            fetched_at: "2026-10-07 17:16:57"
      - input: ref('stg_mlb__games')
        rows:
          - {season: 2026, game_type: "R", official_date: "2026-03-26"}
          - {season: 2026, game_type: "R", official_date: "2026-03-25"}
          - {season: 2026, game_type: "R", official_date: "2026-03-25"}
          - {season: 2026, game_type: "R", official_date: "2026-04-02"}
    expect:
      rows:
        - scoring_period: 1
          scoring_date: "2026-03-25"
        - scoring_period: 2
          scoring_date: "2026-03-26"
        - scoring_period: 3
          scoring_date: "2026-03-27"

  - name: scoring_periods_are_dated_from_their_own_seasons_opening_day
    description: >
      Catches one opening day for every season. With 2026 and 2027 both loaded, a global
      minimum would date the 2027 league from 2026's opening day. Each league-season must
      be dated from the first regular-season game of its own season.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2026, latest_scoring_period: 2, final_scoring_period: 2, fetched_at: "2026-04-01 12:00:00"}
          - {league_id: "1", season: 2027, latest_scoring_period: 2, final_scoring_period: 2, fetched_at: "2027-04-01 12:00:00"}
      - input: ref('stg_mlb__games')
        rows:
          - {season: 2026, game_type: "R", official_date: "2026-03-25"}
          - {season: 2027, game_type: "R", official_date: "2027-03-30"}
    expect:
      rows:
        - {league_id: "1", season: 2026, scoring_period: 1, scoring_date: "2026-03-25"}
        - {league_id: "1", season: 2026, scoring_period: 2, scoring_date: "2026-03-26"}
        - {league_id: "1", season: 2027, scoring_period: 1, scoring_date: "2027-03-30"}
        - {league_id: "1", season: 2027, scoring_period: 2, scoring_date: "2027-03-31"}

  - name: scoring_periods_ignore_games_of_other_types
    description: >
      Catches spring training or exhibition games moving opening day. A game of another
      game_type (S) on an earlier date than the first regular-season (R) game must not
      count; period 1 is the first R game.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2026, latest_scoring_period: 1, final_scoring_period: 2, fetched_at: "2026-04-01 12:00:00"}
      - input: ref('stg_mlb__games')
        rows:
          - {season: 2026, game_type: "S", official_date: "2026-02-20"}
          - {season: 2026, game_type: "R", official_date: "2026-03-25"}
    expect:
      rows:
        - {league_id: "1", season: 2026, scoring_period: 1, scoring_date: "2026-03-25"}
        - {league_id: "1", season: 2026, scoring_period: 2, scoring_date: "2026-03-26"}

  - name: scoring_periods_keep_their_rows_when_no_mlb_season_is_loaded
    description: >
      Catches an inner join silently dropping a league-season whose MLB season is not
      loaded. The periods must still exist, with a null scoring_date, so the not_null test
      on scoring_date fails the build instead of downstream models building empty.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - {league_id: "1", season: 2027, latest_scoring_period: 1, final_scoring_period: 2, fetched_at: "2027-04-01 12:00:00"}
      - input: ref('stg_mlb__games')
        rows:
          - {season: 2026, game_type: "R", official_date: "2026-03-25"}
    expect:
      rows:
        - {league_id: "1", season: 2027, scoring_period: 1, scoring_date: null}
        - {league_id: "1", season: 2027, scoring_period: 2, scoring_date: null}

  - name: pro_games_a_game_listed_under_both_teams_is_one_row
    description: >
      Catches counting a game once per listing. ESPN lists every game under its home team
      and again, identically, under its away team, so unnesting without collapsing gives
      two rows per game and breaks the (season, game) uniqueness. Game 100 is listed
      under teams 12 and 5 and must be one row; game 101 is listed once each way and
      stays a row of its own.
    model: stg_espn__pro_games
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", file_path: p1, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 0, "abbrev": "FA"}, {"id": 12, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}], "3": [{"id": 101, "date": 1775171100000, "scoringPeriodId": 3, "homeProTeamId": 5, "awayProTeamId": 12}]}}, {"id": 5, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}], "3": [{"id": 101, "date": 1775171100000, "scoringPeriodId": 3, "homeProTeamId": 5, "awayProTeamId": 12}]}}]}}'}
    expect:
      rows:
        - {season: 2026, espn_game_id: "100", scoring_period: 2, game_start_at_utc: "2026-04-01 17:05:00", game_date: "2026-04-01", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-30 00:00:00"}
        - {season: 2026, espn_game_id: "101", scoring_period: 3, game_start_at_utc: "2026-04-02 23:05:00", game_date: "2026-04-02", home_pro_team_id: 5, away_pro_team_id: 12, fetched_at: "2026-09-30 00:00:00"}

  - name: pro_games_late_utc_starts_belong_to_the_previous_eastern_date
    description: >
      Catches dating a game by its UTC date, or by a conversion that depends on the
      session time zone. A start at 02:05 UTC on 2026-04-01 is 22:05 on 2026-03-31
      Eastern, and ESPN scores it on the 31st; the UTC date would put it a period late.
    model: stg_espn__pro_games
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", file_path: p1, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"1": [{"id": 100, "date": 1775009100000, "scoringPeriodId": 1, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
    expect:
      rows:
        - {season: 2026, espn_game_id: "100", scoring_period: 1, game_start_at_utc: "2026-04-01 02:05:00", game_date: "2026-03-31", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-30 00:00:00"}

  - name: pro_games_read_only_the_newest_capture_of_a_season
    description: >
      Catches merging captures of one season. A schedule is a statement about the season
      at one moment, so a game the newer capture no longer lists (101) must drop out, not
      linger from the older one. Only game 100, in the newer capture, may appear.
    model: stg_espn__pro_games
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260901T000000Z", file_path: p1, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}, {"id": 101, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", file_path: p2, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
    expect:
      rows:
        - {season: 2026, espn_game_id: "100", scoring_period: 2, game_start_at_utc: "2026-04-01 17:05:00", game_date: "2026-04-01", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-30 00:00:00"}

  - name: pro_games_keep_seasons_apart
    description: >
      Catches a global "latest" or a season taken from the wrong place. A 2026 capture
      and a 2027 capture each keep their own games, filed under their own season, even
      though the 2026 one was fetched later in the same run.
    model: stg_espn__pro_games
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260930T000000Z", file_path: p1, partitions: '{"season": 2026}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"2": [{"id": 100, "date": 1775063100000, "scoringPeriodId": 2, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
          - {source: espn, endpoint: pro_schedule, request_path: /p, request_key: view=proTeamSchedules_wl, fetched_at: "20260929T000000Z", file_path: p2, partitions: '{"season": 2027}', payload: '{"settings": {"proTeams": [{"id": 12, "proGamesByScoringPeriod": {"1": [{"id": 200, "date": 1806620700000, "scoringPeriodId": 1, "homeProTeamId": 12, "awayProTeamId": 5}]}}]}}'}
    expect:
      rows:
        - {season: 2026, espn_game_id: "100", scoring_period: 2, game_start_at_utc: "2026-04-01 17:05:00", game_date: "2026-04-01", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-30 00:00:00"}
        - {season: 2027, espn_game_id: "200", scoring_period: 1, game_start_at_utc: "2027-04-01 23:05:00", game_date: "2027-04-01", home_pro_team_id: 12, away_pro_team_id: 5, fetched_at: "2026-09-29 00:00:00"}

seeds:
  - name: espn_stat_ids
    description: >
      ESPN statId -> name, generated from espn-api's STATS_MAP (MIT) by
      scripts/make_espn_seeds.py. Regenerate rather than edit by hand.
    columns:
      - name: stat_id
        data_tests: [not_null, unique]
      - name: display_label
        data_tests: [not_null]
  - name: espn_activity_types
    description: >
      ESPN messageTypeId -> activity (FA ADDED, DROPPED, TRADED...). is_transaction is
      false for lineup moves (188), which the unfiltered activity log also carries (#26):
      they rearrange a roster but move no player between teams. movement, method and
      team_field say how each transaction type moves a player and which message field
      names the acting team (#11, ADR 0004); they are empty for types with no rule
      (a trade, a lineup move), so int_fantasy__transactions fails on a type nobody has
      ruled on rather than guessing.
    columns:
      - name: message_type_id
        data_tests: [not_null, unique]
      - name: is_transaction
        data_tests: [not_null]
      - name: movement
        description: "add (player joins a roster) or drop (player leaves one); empty when the type has no rule."
        data_tests:
          - accepted_values:
              arguments:
                values: [add, drop]
      - name: method
        description: "How the player moved: free_agent, waiver or drop; empty when the type has no rule."
        data_tests:
          - accepted_values:
              arguments:
                values: [free_agent, waiver, drop]
      - name: team_field
        description: "Which message field names the acting team: to (adds, drops 179 and 181) or for (drop 239); empty when the type has no rule."
        data_tests:
          - accepted_values:
              arguments:
                values: [to, for]
  - name: espn_lineup_slots
    description: >
      ESPN lineupSlotId -> slot abbreviation (C, 1B, BE, IL...). is_starting_slot is
      false for exactly bench and injured list: a benched player's real game still
      happens, it is just not credited to the fantasy team. slot_role says which side of a
      started player's game ESPN credits (#10): batting from hitter slots only, pitching
      from P/SP/RP only. Measured, not assumed: summing everything a started player did
      leaves up to 18 of 286 matchup sides off ESPN per stat, crediting by role leaves
      only official-scoring differences.
    columns:
      - name: lineup_slot_id
        data_tests: [not_null, unique]
      - name: is_starting_slot
        data_tests: [not_null]
      - name: slot_role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hitter, pitcher, bench]
    data_tests:
      - dbt_utils.expression_is_true:
          name: espn_lineup_slots_bench_is_exactly_the_non_starting_slots
          arguments:
            expression: "is_starting_slot = (slot_role != 'bench')"
  - name: espn_stat_components
    description: >
      How each stat ESPN reports for a matchup side is computed from credited components
      (#10): value = sum(weight * component) over numerator rows, divided by the same
      over denominator rows when there are any. Rates carry their scale in the weights
      (ERA's 27, WHIP's 3, since outs stand in for innings). Covers all 24 stats in
      scoreByStat, including the 7 that are only components of the 17 scored categories.
    config:
      column_types:
        stat_id: bigint
        part: varchar
        component: varchar
        weight: double
    columns:
      - name: stat_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('espn_stat_ids')
                field: stat_id
      - name: part
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [numerator, denominator]
      - name: component
        description: >
          A column of int_fantasy__started_player_days (and so of the matchup side
          totals). Listed exhaustively, because a misspelt component would join to
          nothing and score a silent zero.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [games_batted, plate_appearances, at_bats, hits, doubles, triples, home_runs, runs, runs_batted_in, batter_walks, batter_strikeouts, stolen_bases, caught_stealing, hit_by_pitch, sacrifice_flies, total_bases, games_pitched, games_started, outs_recorded, batters_faced, hits_allowed, runs_allowed, earned_runs, home_runs_allowed, pitcher_walks, pitcher_strikeouts, hit_batsmen, wins, losses, saves, holds, blown_saves]
      - name: weight
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [stat_id, part, component]
  - name: espn_reconciliation_residuals
    description: >
      Every known difference between our recomputed matchup totals and ESPN's
      scoreByStat, with its cause and evidence (#10). expected_difference is ours minus
      ESPN's, for count stats only; a rate's residual follows from its components.
      fct_matchup_scores_match_espn fails on any residual not listed here AND on any
      row here that no longer matches a live residual, so the register can't grow into
      a tolerance. Causes: official_scoring_change (MLB's later boxscore differs from
      ESPN's own game line for that player-day; ESPN never applied the change) and
      espn_total_inconsistent (ESPN's side total differs from the sum of ESPN's own
      per-player lines for the matchup, which equals ours).
    config:
      column_types:
        matchup_id: bigint
        team_id: bigint
        stat_id: bigint
        expected_difference: double
    columns:
      - name: expected_difference
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "!= 0"
      - name: cause
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [official_scoring_change, espn_total_inconsistent]
      - name: evidence
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [matchup_id, team_id, stat_id]
  - name: espn_player_positions
    description: ESPN defaultPositionId -> position abbreviation.
    columns:
      - name: position_id
        data_tests: [not_null, unique]
