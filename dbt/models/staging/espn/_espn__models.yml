version: 2

models:
  - name: stg_espn__league_settings
    description: One row per (league, season) with the settings snapshot that was newest at build time.
    columns:
      - name: league_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: scoring_type
        data_tests:
          - not_null
      - name: team_count
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season]

  - name: stg_espn__scoring_categories
    description: >
      One row per scored category. is_reverse marks lower-is-better categories such as
      ERA and WHIP. display_label is what ESPN shows a human; stat_abbrev names the unit
      actually stored (stat 34 displays as IP but holds outs).
    columns:
      - name: stat_id
        data_tests: [not_null]
      - name: display_label
        data_tests: [not_null]
      - name: is_reverse
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, stat_id]

  - name: stg_espn__teams
    description: >
      One row per fantasy team. Deliberately excludes members, owners and primaryOwner:
      those identify real people who did not opt into a public repo.
    columns:
      - name: team_id
        data_tests: [not_null]
      - name: wins
        data_tests: [not_null]
      - name: playoff_seed
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, team_id]

  - name: stg_espn__roster_entries
    description: One row per (league, season, scoring period, team, player).
    columns:
      - name: scoring_period
        data_tests: [not_null]
      - name: espn_player_id
        data_tests: [not_null]
      - name: team_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_espn__teams')
                field: team_id
      - name: lineup_slot_id
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period, team_id, espn_player_id]

  - name: stg_espn__scoring_periods
    description: >
      One row per scoring period, mapping it to the calendar date it scored on
      (US/Eastern boundary). The bridge between ESPN rosters and MLB game logs.
    columns:
      - name: scoring_period
        data_tests: [not_null, unique]
      - name: scoring_date
        data_tests: [not_null, unique]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [league_id, season, scoring_period]

unit_tests:
  - name: scoring_period_dates_use_the_eastern_day_boundary
    description: >
      A settings snapshot taken at 02:52 UTC belongs to the PREVIOUS Eastern day. If the
      anchor used the UTC date instead, every period -- and therefore every roster --
      would shift forward by one day.
    model: stg_espn__scoring_periods
    given:
      - input: ref('stg_espn__league_settings')
        rows:
          - league_id: "1"
            season: 2026
            latest_scoring_period: 180
            final_scoring_period: 3
            fetched_at: "2026-09-21 02:52:12"
    expect:
      rows:
        - scoring_period: 1
          scoring_date: "2026-03-25"
        - scoring_period: 2
          scoring_date: "2026-03-26"
        - scoring_period: 3
          scoring_date: "2026-03-27"

seeds:
  - name: espn_stat_ids
    description: >
      ESPN statId -> name, generated from espn-api's STATS_MAP (MIT) by
      scripts/make_espn_seeds.py. Regenerate rather than edit by hand.
    columns:
      - name: stat_id
        data_tests: [not_null, unique]
      - name: display_label
        data_tests: [not_null]
  - name: espn_lineup_slots
    description: ESPN lineupSlotId -> slot abbreviation (C, 1B, BE, IL...).
    columns:
      - name: lineup_slot_id
        data_tests: [not_null, unique]
  - name: espn_player_positions
    description: ESPN defaultPositionId -> position abbreviation.
    columns:
      - name: position_id
        data_tests: [not_null, unique]
