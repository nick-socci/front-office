version: 2

models:
  - name: stg_mlb__games
    description: >
      One row per MLB regular-season game, newest snapshot wins. The entry point for
      the MLB side: boxscore ingestion walks this model's game_pk list.
    columns:
      - name: game_pk
        description: MLB's stable game identifier; the grain of this model.
        data_tests:
          - not_null
          - unique
      - name: game_guid
        data_tests:
          - not_null
      - name: game_type
        description: Always 'R' here; other game types are filtered out.
        data_tests:
          - accepted_values:
              arguments:
                values: ["R"]
      - name: season
        data_tests:
          - not_null
      - name: official_date
        description: The date MLB assigns the game, which is what ESPN scoring aligns to.
        data_tests:
          - not_null
      - name: game_state
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Final", "Preview", "Live"]
      - name: game_state_detail
        description: >
          MLB's detailedState. Every value must be listed in the mlb_game_states seed,
          so a new state (a forfeit, say) stops the build until someone decides whether
          it counts as played.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('mlb_game_states')
                field: detailed_state
      - name: is_played
        description: >
          True when the game was actually played (Final, Completed Early); false for a
          game that is over without having been played (Postponed, Cancelled). MLB files
          both kinds under game_state 'Final', so game_state cannot tell them apart.
        data_tests:
          - not_null
      - name: home_team_id
        data_tests:
          - not_null
      - name: away_team_id
        data_tests:
          - not_null
      - name: fetched_at
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          name: stg_mlb__games_home_and_away_differ
          arguments:
            expression: "home_team_id != away_team_id"

  - name: stg_mlb__batting_game_logs
    description: >
      One row per (game, batter) with component counts only. Rate stats such as AVG are
      deliberately absent: they are ratios of these columns and must be computed from
      summed components downstream, never averaged per game.
    columns:
      - name: game_pk
        description: Recovered from the request metadata; the boxscore payload has no gamePk.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mlb__games')
                field: game_pk
      - name: mlbam_player_id
        data_tests:
          - not_null
      - name: side
        data_tests:
          - accepted_values:
              arguments:
                values: ["home", "away"]
      - name: team_id
        data_tests:
          - not_null
      - name: at_bats
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_pk, mlbam_player_id]
      - dbt_utils.expression_is_true:
          name: stg_mlb__batting_hits_cannot_exceed_at_bats
          arguments:
            expression: "hits <= at_bats"
      - dbt_utils.expression_is_true:
          name: stg_mlb__batting_extra_base_hits_cannot_exceed_hits
          arguments:
            expression: "doubles + triples + home_runs <= hits"

  - name: stg_mlb__pitching_game_logs
    description: >
      One row per (game, pitcher) with component counts only. Innings are stored as
      outs_recorded; innings_pitched keeps MLB's original notation purely so a test can
      cross-check the two.
    columns:
      - name: game_pk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_mlb__games')
                field: game_pk
      - name: mlbam_player_id
        data_tests:
          - not_null
      - name: outs_recorded
        description: The honest unit for innings. "6.1" innings is 19 outs.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: team_id
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [game_pk, mlbam_player_id]
      - dbt_utils.expression_is_true:
          name: stg_mlb__pitching_earned_runs_cannot_exceed_runs
          arguments:
            expression: "earned_runs <= runs_allowed"

  - name: stg_mlb__players
    description: >
      One row per (season, mlbam_player_id): the player as the newest capture of that
      season that lists him describes him. A player a later capture drops keeps his last
      row. The name is MLB's fullName and nothing else of the name fields is read.
      primary_position is MLB's designation as of the fetch (P, SS, TWP, ...), not on a
      date in the season. season comes from the capture's request, because the payload
      has no season field.
    columns:
      - name: season
        description: The season the list was requested for, from the request_key.
        data_tests:
          - not_null
      - name: mlbam_player_id
        description: MLB's id for the player.
        data_tests:
          - not_null
      - name: player_name
        description: MLB's fullName.
        data_tests:
          - not_null
      - name: primary_position
        description: MLB's primary position abbreviation, as of the fetch.
        data_tests:
          - not_null
      - name: bats
        description: Batting side, MLB's code (L, R or S).
        data_tests:
          - accepted_values:
              arguments:
                values: ["L", "R", "S"]
      - name: throws
        description: Throwing hand, MLB's code (L, R or S).
        data_tests:
          - accepted_values:
              arguments:
                values: ["L", "R", "S"]
      - name: birth_date
      - name: mlb_debut_date
        description: Null for a player who has not debuted.
      - name: fetched_at
        description: When the capture this row came from was fetched.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, mlbam_player_id]

unit_tests:
  - name: games_prefer_the_played_entry_over_a_cancelled_or_postponed_one
    description: >
      A not-played placeholder and the played game that replaced it share a game_pk in
      one response, so recency can't choose. The played entry must win whichever comes
      first in the payload, for cancelled as well as postponed placeholders, matching
      ingestion's NOT_PLAYED tie-break (PR #43 review).
    model: stg_mlb__games
    given:
      - input: source('raw', 'api_responses')
        rows:
          - source: mlb
            endpoint: schedule
            request_key: "season=2026"
            fetched_at: "20260601T000000Z"
            file_path: schedule.json
            payload: '{"dates":[{"games":[{"gamePk":1,"gameType":"R","officialDate":"2026-06-01","status":{"abstractGameState":"Final","detailedState":"Cancelled"},"teams":{"home":{"team":{"id":10}},"away":{"team":{"id":20}}}},{"gamePk":1,"gameType":"R","officialDate":"2026-06-01","status":{"abstractGameState":"Final","detailedState":"Final"},"teams":{"home":{"team":{"id":10}},"away":{"team":{"id":20}}}},{"gamePk":2,"gameType":"R","officialDate":"2026-06-01","status":{"abstractGameState":"Final","detailedState":"Final"},"teams":{"home":{"team":{"id":10}},"away":{"team":{"id":20}}}},{"gamePk":2,"gameType":"R","officialDate":"2026-06-01","status":{"abstractGameState":"Final","detailedState":"Cancelled"},"teams":{"home":{"team":{"id":10}},"away":{"team":{"id":20}}}},{"gamePk":3,"gameType":"R","officialDate":"2026-06-01","status":{"abstractGameState":"Final","detailedState":"Postponed"},"teams":{"home":{"team":{"id":10}},"away":{"team":{"id":20}}}},{"gamePk":3,"gameType":"R","officialDate":"2026-06-01","status":{"abstractGameState":"Final","detailedState":"Completed Early"},"teams":{"home":{"team":{"id":10}},"away":{"team":{"id":20}}}}]}]}'
      - input: ref('mlb_game_states')
        rows:
          - {detailed_state: Final, is_played: true}
          - {detailed_state: Completed Early, is_played: true}
          - {detailed_state: Postponed, is_played: false}
          - {detailed_state: Cancelled, is_played: false}
    expect:
      rows:
        - {game_pk: 1, game_state_detail: Final, is_played: true}
        - {game_pk: 2, game_state_detail: Final, is_played: true}
        - {game_pk: 3, game_state_detail: Completed Early, is_played: true}

  - name: pitching_keeps_the_newest_snapshot_per_pitcher
    description: >
      A boxscore refetched inside the settle window supersedes the earlier copy. Here an
      official scoring change turns an earned run into an unearned one; the model must
      report the corrected value, not the original.
    model: stg_mlb__pitching_game_logs
    given:
      - input: source('raw', 'api_responses')
        rows:
          - source: mlb
            endpoint: boxscore
            request_key: "gamePk=1"
            fetched_at: "20260401T000000Z"
            file_path: first.json
            payload: '{"teams":{"home":{"team":{"id":10},"players":{"ID100":{"person":{"id":100,"fullName":"P One"},"stats":{"pitching":{"gamesPitched":1,"gamesStarted":1,"outs":19,"inningsPitched":"6.1","earnedRuns":3,"runs":3}}}}},"away":{"team":{"id":20},"players":{}}}}'
          - source: mlb
            endpoint: boxscore
            request_key: "gamePk=1"
            fetched_at: "20260405T000000Z"
            file_path: second.json
            payload: '{"teams":{"home":{"team":{"id":10},"players":{"ID100":{"person":{"id":100,"fullName":"P One"},"stats":{"pitching":{"gamesPitched":1,"gamesStarted":1,"outs":19,"inningsPitched":"6.1","earnedRuns":2,"runs":3}}}}},"away":{"team":{"id":20},"players":{}}}}'
    expect:
      rows:
        - game_pk: 1
          mlbam_player_id: 100
          outs_recorded: 19
          innings_pitched: "6.1"
          earned_runs: 2
          runs_allowed: 3

  - name: batting_includes_appearances_without_plate_appearances
    description: >
      A bench player who never entered must be excluded, but a pinch runner with zero
      plate appearances who steals a base must be included. Filtering on plate
      appearances rather than gamesPlayed would silently drop real stolen bases.
    model: stg_mlb__batting_game_logs
    given:
      - input: source('raw', 'api_responses')
        rows:
          - source: mlb
            endpoint: boxscore
            request_key: "gamePk=2"
            fetched_at: "20260401T000000Z"
            file_path: bat.json
            payload: '{"teams":{"home":{"team":{"id":10},"players":{"ID200":{"person":{"id":200,"fullName":"Starter"},"stats":{"batting":{"gamesPlayed":1,"plateAppearances":4,"atBats":4,"hits":2,"doubles":1,"triples":0,"homeRuns":0,"stolenBases":0}}},"ID201":{"person":{"id":201,"fullName":"Bench"},"stats":{"batting":{}}},"ID202":{"person":{"id":202,"fullName":"Pinch Runner"},"stats":{"batting":{"gamesPlayed":1,"plateAppearances":0,"atBats":0,"hits":0,"doubles":0,"triples":0,"homeRuns":0,"stolenBases":1}}}}},"away":{"team":{"id":20},"players":{}}}}'
    expect:
      rows:
        - game_pk: 2
          mlbam_player_id: 200
          at_bats: 4
          hits: 2
          stolen_bases: 0
        - game_pk: 2
          mlbam_player_id: 202
          at_bats: 0
          hits: 0
          stolen_bases: 1

  - name: stg_mlb__players_keeps_the_newest_capture_per_season_and_player
    description: >
      Two captures of one season that disagree on a player: the newer one's row wins. A
      player only the older capture lists keeps his row. The same player in another
      season is a row of his own.
    model: stg_mlb__players
    given:
      - input: source('raw', 'api_responses')
        rows:
          - source: mlb
            endpoint: players
            request_key: "season=2026"
            fetched_at: "20260401T000000Z"
            file_path: players-2026-20260401T000000Z.json
            payload: '{"people":[{"id":1,"fullName":"Old Name","primaryPosition":{"abbreviation":"P"},"batSide":{"code":"L"},"pitchHand":{"code":"L"},"birthDate":"1999-06-01","mlbDebutDate":"2023-06-05"},{"id":2,"fullName":"Only Older","primaryPosition":{"abbreviation":"C"},"batSide":{"code":"R"},"pitchHand":{"code":"R"},"birthDate":"1999-06-01","mlbDebutDate":"2023-06-05"}]}'
          - source: mlb
            endpoint: players
            request_key: "season=2026"
            fetched_at: "20260901T000000Z"
            file_path: players-2026-20260901T000000Z.json
            payload: '{"people":[{"id":1,"fullName":"New Name","primaryPosition":{"abbreviation":"SS"},"batSide":{"code":"S"},"pitchHand":{"code":"R"},"birthDate":"1999-06-01","mlbDebutDate":"2023-06-05"}]}'
          - source: mlb
            endpoint: players
            request_key: "season=2025"
            fetched_at: "20250901T000000Z"
            file_path: players-2025-20250901T000000Z.json
            payload: '{"people":[{"id":1,"fullName":"Past Name","primaryPosition":{"abbreviation":"P"},"batSide":{"code":"L"},"pitchHand":{"code":"L"},"birthDate":"1999-06-01","mlbDebutDate":"2023-06-05"}]}'
    expect:
      rows:
        - {season: 2026, mlbam_player_id: 1, player_name: New Name, primary_position: SS, bats: S, throws: R, birth_date: "1999-06-01", mlb_debut_date: "2023-06-05"}
        - {season: 2026, mlbam_player_id: 2, player_name: Only Older, primary_position: C, bats: R, throws: R, birth_date: "1999-06-01", mlb_debut_date: "2023-06-05"}
        - {season: 2025, mlbam_player_id: 1, player_name: Past Name, primary_position: P, bats: L, throws: L, birth_date: "1999-06-01", mlb_debut_date: "2023-06-05"}

seeds:
  - name: mlb_game_states
    description: >
      MLB detailedState -> is_played. Matches ingestion's NOT_PLAYED set (#36): the
      false rows are games that are over without having been played, which have no
      boxscore worth loading. A played-or-not decision belongs here, not in SQL, so the
      warehouse and the audit can't drift apart silently.
    config:
      column_types:
        detailed_state: varchar
        is_played: boolean
    columns:
      - name: detailed_state
        data_tests: [not_null, unique]
      - name: is_played
        data_tests: [not_null]
