version: 2

models:
  - name: stg_raw__season_responses
    description: >
      The raw responses with the season each capture belongs to as a date, so that models
      built a season at a time (microbatch) can be filtered by dbt on it. A view over
      the raw table; a capture with no season has a null season_start and is in no batch.
    columns:
      - name: source
        description: mlb / espn / idmap.
      - name: endpoint
        description: Which endpoint produced the response, e.g. schedule, boxscore.
      - name: request_path
        description: URL path of the request, no host or query string; part of the key.
      - name: request_key
        description: Canonical (sorted) request parameters.
      - name: fetched_at
        description: UTC stamp, matching the landing filename.
      - name: partitions
        description: Landing partitions as JSON, e.g. league_id and season for ESPN.
      - name: payload
        description: The response body, unmodified.
      - name: file_path
        description: Landing-zone path, for tracing a row back to its file.
      - name: season_start
        description: >
          The first of January of the capture's season, taken from the season in its
          partitions. The model's event time. Null when the capture has no season (the
          id map), which is deliberate: such a capture is in no batch.

unit_tests:
  - name: season_start_is_the_first_of_january_of_the_partitions_season
    description: >
      Catches a season mapped to the wrong date. A capture filed under season 2026 gives
      2026-01-01 and one under 2025 gives 2025-01-01, so a season read as another year,
      or as another day of the year, fails.
    model: stg_raw__season_responses
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: mlb, endpoint: schedule, request_path: /a, request_key: k, fetched_at: "20260801T000000Z", file_path: a, partitions: '{"season": 2026}', payload: '{}'}
          - {source: mlb, endpoint: schedule, request_path: /b, request_key: k, fetched_at: "20250801T000000Z", file_path: b, partitions: '{"season": 2025}', payload: '{}'}
    expect:
      format: dict
      rows:
        - {file_path: a, season_start: "2026-01-01"}
        - {file_path: b, season_start: "2025-01-01"}

  - name: a_capture_with_no_season_has_no_season_start
    description: >
      Catches a capture with no season being given a date and so landing in a batch. The
      id map's partitions are empty, so its season_start must be null, not a default year.
    model: stg_raw__season_responses
    given:
      - input: source('raw', 'api_responses')
        format: dict
        rows:
          - {source: idmap, endpoint: register, request_path: /a, request_key: k, fetched_at: "20260801T000000Z", file_path: a, partitions: '{}', payload: '{}'}
    expect:
      format: dict
      rows:
        - {file_path: a, season_start: null}
