name: front_office
version: 0.1.0
profile: front_office

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  front_office:
    staging:
      # Staging models are views by default: a view is just stored SQL, so it costs
      # nothing until queried. Models that parse large JSON payloads override this
      # to `table` (see milestone 3).
      +materialized: view
      +schema: staging

    intermediate:
      # The layer between staging (shaped like the API) and marts (shaped like a
      # question). Views by default; the two models that do real aggregation
      # override to table.
      +materialized: view
      +schema: intermediate

    marts:
      # Shaped like a question ("who won each category?"), read by people and the
      # dashboard. Tables, rebuilt in full every run: see fct_matchup_category_scores for
      # why incremental is deferred.
      +materialized: table
      +schema: marts

    reconciliation:
      # The only layer that pairs our numbers with the platform's own (#10). Source-
      # specific by design: each platform gets a folder, and nothing reads from here.
      # `fantasy/` holds the other kind of check: our values against matchups scored
      # again with each player swapped for replacement (spec 0089).
      +materialized: table
      +schema: reconciliation

vars:
  # When true, league- and team-identifying text is replaced with stable aliases.
  # League members did not opt into appearing in a public repo, so CI (and anything
  # published) runs with this on; local dev defaults to real names.
  anonymize: false
  # How many measured matchups of a league's earlier seasons a category needs before its
  # scale uses them, and what they then count as when blended with the season's own
  # (ADR 0027). One number with one meaning; not a method switch. Lowered only by unit
  # tests and by scripts/check_tenant_isolation.py, whose fixtures have two matchups a
  # season.
  fantasy_scale_prior_matchups: 100
