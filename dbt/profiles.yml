# Connection settings. dbt looks for this in ~/.dbt by default, so the repo sets
# DBT_PROFILES_DIR=. (see README / CI) to use this file instead.
front_office:
  target: dev
  outputs:
    # Your real warehouse, built from the full landed season.
    dev:
      type: duckdb
      path: "{{ env_var('FO_DUCKDB_PATH', '../data/warehouse.duckdb') }}"
      # One node at a time, on four DuckDB threads. dbt-duckdb builds every node on one
      # DuckDB instance, so nodes built at once share one memory limit; one at a time keeps
      # the build's memory the same for one season as for eight (ADR 0100).
      threads: 1
      settings:
        threads: 4
      # The plugin and the solver it registers are imported from here (ADR 0103); resolved
      # against the working directory, so the paths are given for dbt run from dbt/ and from
      # the repo root (the SQL linter's dbt templater runs there).
      module_paths: ["python_modules", "functions", "dbt/python_modules", "dbt/functions"]
      # Registers the lineup solver as a SQL function on dbt's connections.
      plugins:
        - module: fo_duckdb_functions

    # CI: a throwaway database built from the committed fixture landing zone.
    # Same SQL, tiny anonymised data, no credentials.
    ci:
      type: duckdb
      path: "{{ env_var('FO_CI_DUCKDB_PATH', 'ci.duckdb') }}"
      threads: 4
      # The plugin and the solver it registers are imported from here (ADR 0103); resolved
      # against the working directory, so the paths are given for dbt run from dbt/ and from
      # the repo root (the SQL linter's dbt templater runs there).
      module_paths: ["python_modules", "functions", "dbt/python_modules", "dbt/functions"]
      # Registers the lineup solver as a SQL function on dbt's connections.
      plugins:
        - module: fo_duckdb_functions

    # BigQuery, for the `bigquery` selector (specs 0130, 0137). Credentials are application-default
    # (gcloud auth application-default login); nothing about them is in this file.
    bq:
      type: bigquery
      method: oauth
      project: "{{ env_var('FO_BQ_PROJECT') }}"
      dataset: main
      location: US
      threads: 4
      priority: interactive
      maximum_bytes_billed: 10000000000
      # Eight seasons of box scores and matchup days take the heaviest staging parses past
      # 600 s (spec 0135, Amendments). The bytes cap above is the cost guard, not this.
      job_execution_timeout_seconds: 1800
