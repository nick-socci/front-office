# Named selections, used as `dbt build --selector <name>`.
selectors:
  - name: bigquery_slice
    description: >
      Every model that builds on BigQuery: all of them but the lineup solver's Python model
      and what reads it (ADR 0096; #137 removes the exclusion). One test is left out too:
      it checks DuckDB's capture glob against the loader's manifest, and BigQuery has
      neither (spec 0135, Amendments).
    definition:
      union:
        - method: fqn
          value: "*"
          indirect_selection: cautious
        - exclude:
            - method: fqn
              value: int_fantasy__optimal_lineups
              children: true
            - method: fqn
              value: stg_raw__capture_views_cover_the_manifest
